<style>

  body{margin:0;background:#e9edf3;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--text);display:flex;justify-content:center;padding:20px;min-height:100vh;}

    width:min(1440px,100%); height:calc(100vh - 40px); min-height:680px;background:var(--bg);border:1px solid rgba(28,28,30,.08);
    border-radius:20px;box-shadow:0 18px 60px rgba(31,42,68,.16);overflow:hidden;display:grid;
    grid-template-columns:248px minmax(0,1fr);grid-template-rows:72px minmax(0,1fr);position:relative;
  }
  #topbar{
    grid-column:2;grid-row:1;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:0.5px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;padding:0 28px;
  }
  .page-heading{min-width:0;}
  #topbar h1{font-size:20px;font-weight:700;letter-spacing:-.25px;margin:0 0 3px;}
  #device-summary{font-size:12px;color:var(--text-muted);margin:0;}
  #topbar button{background:#fff;border:.5px solid var(--border);border-radius:10px;font-size:14px;color:var(--text-2);cursor:pointer;padding:8px 11px;min-height:38px;}
  .desktop-button-label{margin-left:5px;}
  #content{grid-column:2;grid-row:2;overflow-y:auto;padding:24px 28px 40px;width:100%;}
  #content>*{max-width:1060px;margin-left:auto;margin-right:auto;}

  .brand-icon{width:38px;height:38px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 8px 20px rgba(0,122,255,.3);}

  .brand-subtitle{color:#8e9aaf;font-size:11px;margin:0;}

  .shortcut-card{background:#fff;border:0.5px solid var(--border);border-radius:13px;padding:11px;min-height:72px;cursor:pointer;position:relative;}

  .shortcut-meta{font-size:11px;color:var(--text-muted);margin:0;}
  .favorite-btn{border:0;background:none;color:var(--accent);font-size:21px;line-height:1;padding:4px;min-height:0;cursor:pointer;flex-shrink:0;}
  .ios-entry{background:#fff;border:.5px solid var(--border);border-radius:14px;min-height:58px;padding:10px 12px;display:flex;align-items:center;gap:11px;cursor:pointer;margin-bottom:12px;}

  #pdf-canvas-wrap{display:flex;justify-content:center;padding:8px;background:#3a3a38;}

</style>

<body>
<div id="phone">
  <div id="topbar">
    <div class="page-heading">
      <h1 id="page-title">作業查詢</h1>
      <p id="device-summary">讀取本機資料中…</p>
    </div>
    <button id="data-mgmt-btn" title="資料管理">⋯<span class="desktop-button-label">資料管理</span></button>
  </div>
  <div id="content"></div>
  <div id="tabbar">
    <div class="desktop-brand">
      <div class="brand-icon">✓</div>
      <div><p class="brand-title">站務工作助手</p><p class="brand-subtitle">離線作業查詢系統</p></div>
    </div>
    <button class="tab-btn" data-tab="sop"><span class="icon">🔎</span>作業查詢</button>
    <button class="tab-btn" data-tab="library"><span class="icon">🗂️</span>文件庫</button>
    <button class="tab-btn" data-tab="personnel"><span class="icon">👤</span>事件/人員</button>
    <button class="tab-btn" data-tab="ridership"><span class="icon">📊</span>車站運量</button>
    <div class="desktop-privacy"><span class="privacy-dot"></span>本機離線儲存<br>PDF及查詢資料不會上傳</div>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = './vendor/pdf.worker.min.js';

/* ---------- IndexedDB layer ---------- */
const DB_NAME = 'stationAssistantDB';
const STORES = ['pdfFiles','sopDocs','announcements','personnel','ridership','favorites','recentViews','synonymGroups','unmatchedQueries'];
// 避免直接內嵌的PDF worker在受管制瀏覽器假Worker模式下與通用變數名稱 db 衝突。
let stationAssistantDb;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, 3);
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      STORES.forEach(name=>{
        if(!d.objectStoreNames.contains(name)){
          d.createObjectStore(name,{keyPath:'id',autoIncrement:true});
        }
      });
    };
    req.onsuccess = ()=>{
      stationAssistantDb=req.result;
      stationAssistantDb.onversionchange=()=>{stationAssistantDb?.close();stationAssistantDb=undefined;};
      stationAssistantDb.onclose=()=>{stationAssistantDb=undefined;};
      resolve(stationAssistantDb);
    };
    req.onerror = ()=>reject(req.error);
  });
}
function ensureDB(){
  return stationAssistantDb ? Promise.resolve(stationAssistantDb) : openDB();
}
function txStore(name, mode){
  if(!stationAssistantDb) throw new Error('本機資料庫尚未開啟');
  return stationAssistantDb.transaction(name, mode).objectStore(name);
}
async function dbGetAll(name){
  await ensureDB();
  return new Promise((res,rej)=>{
    const r = txStore(name,'readonly').getAll();
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function dbAdd(name, obj){
  await ensureDB();
  return new Promise((res,rej)=>{
    const r = txStore(name,'readwrite').add(obj);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function dbPut(name, obj){
  await ensureDB();
  return new Promise((res,rej)=>{
    const r = txStore(name,'readwrite').put(obj);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function dbDelete(name, id){
  await ensureDB();
  return new Promise((res,rej)=>{
    const r = txStore(name,'readwrite').delete(id);
    r.onsuccess=()=>res(); r.onerror=()=>rej(r.error);
  });
}
async function dbGet(name,id){
  await ensureDB();
  return new Promise((res,rej)=>{
    const r=txStore(name,'readonly').get(id);
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
}
function withTimeout(promise,ms,message){
  let timer;
  const timeout=new Promise((_,reject)=>{
    timer=setTimeout(()=>reject(new Error(message)),ms);
  });
  return Promise.race([promise,timeout]).finally(()=>clearTimeout(timer));
}

/* ---------- In-memory cache ---------- */
const cache = { pdfFiles:[], sopDocs:[], announcements:[], personnel:[], ridership:[], favorites:[], recentViews:[], synonymGroups:[], unmatchedQueries:[] };
async function reloadCache(){
  for(const name of STORES){ cache[name] = await dbGetAll(name); }
}

/* ---------- App state ---------- */
let currentTab = 'sop';
let sopFilter = 'content'; // 'content' | 'all'
let searchSource = 'all'; // 'all' | 'sop' | 'notice'
let sopKeyword = '';
let noticeKeyword = '';
let personnelKeyword = '';
let ridershipKeyword = '';
let procedureKeyword = '';
let procedureEditMode = false;

const titleMap = {sop:'作業查詢', library:'文件庫', personnel:'特殊事件/人員', ridership:'車站運量查詢'};

/* ---------- PDF parsing helpers ---------- */
function isRevisionPage(text){
  const compact = text.replace(/\s+/g,'');
  if(compact.includes('文件異動狀況表')) return true;
  const set1 = compact.includes('修訂緣由') && compact.includes('修訂內容概述');
  const set2 = compact.includes('版別') && compact.includes('編訂') && compact.includes('審查') && compact.includes('核定');
  return set1 || set2;
}
function isRevisionStartPage(text){
  const compact = text.replace(/\s+/g,'');
  // 每份文件封面後的第一張異動表，會有表名或完整的異動表主要欄位。
  return compact.includes('文件異動狀況表') ||
    (compact.includes('發行日期') &&
     compact.includes('修訂緣由') &&
     compact.includes('修訂內容概述'));
}
function isCoverPage(text){
  const compact = text.replace(/\s+/g,'');
  const hasCode = compact.includes('文件編號');
  const hasFirstIssue = compact.includes('首次發行日期') || compact.includes('初次發行日期');
  const hasOwner = compact.includes('編訂單位') || compact.includes('保管單位');
  // 公司封面固定會同時出現文件編號及首次發行日期；第三欄作為掃描／抽字不完整時的備援。
  return (hasCode && hasFirstIssue) || (hasCode && hasOwner && !compact.includes('文件異動狀況表'));
}
function extractHeaderInfo(text){
  const compact = text.replace(/\s+/g,'');
  const nameM = compact.match(/文件名稱[:：]?([\s\S]*?)(?=文件編號|最新版別|版別|章節|首次發行日期|初次發行日期|編訂單位|保管單位|$)/);
  const codeM = compact.match(/文件編號[:：]?([\s\S]*?)(?=首次發行日期|初次發行日期|最新版別|編訂單位|保管單位|$)/);
  return {
    name: nameM ? nameM[1].trim() : null,
    code: codeM ? codeM[1].trim() : null
  };
}
function resolvedDocName(doc){
  for(const page of doc.pages||[]){
    const compact=String(page.formattedText||page.text||'').replace(/\s+/g,'');
    const m=compact.match(/文件名稱[:：]?(.{2,100}?)(?=文件編號|最新版別|版別|章節|首次發行日期|初次發行日期|編訂單位|保管單位)/);
    if(m){
      const candidate=m[1].replace(/[，,。；;：:]+$/,'').trim();
      if(candidate.length>=2&&candidate.length<=80&&!/(?:修訂第|編訂|審查|核定|工程師|中心主任)/.test(candidate)) return candidate;
    }
  }
  const original=String(doc.name||'').trim();
  if(original.length<=80&&!/(?:修訂第|編訂|審查|核定|工程師|中心主任)/.test(original)) return original;
  return '站務工作說明書';
}
function guessTitle(coverText){
  let cleaned = coverText.replace(/\s+/g,'').trim();
  // 常見前綴：把公司抬頭類的詞先去掉再取一段當標題
  const stopWords = ['股份有限公司','有限公司'];
  stopWords.forEach(w=>{
    const idx = cleaned.indexOf(w);
    if(idx>=0) cleaned = cleaned.slice(idx+w.length);
  });
  return cleaned.slice(0,24) || '未命名文件';
}
function extractFormattedText(textContent,pageHeight){
  const layoutLines=[];
  let currentLine=[],lastY=null;
  const flushLine=()=>{
    if(currentLine.length) layoutLines.push(currentLine.join(' ').replace(/\s+/g,' ').trim());
    currentLine=[];
  };
  textContent.items.forEach(it=>{
    const str=(it.str||'').trim();
    if(!str) return;
    const y=it.transform ? it.transform[5] : lastY;
    // 排除頁面最下方獨立的文件內部頁碼；APP另以PDF總檔頁碼顯示。
    if(pageHeight && y<pageHeight*.075 && /^\d{1,4}$/.test(str)) return;
    if(currentLine.length && lastY!==null && y!==null && Math.abs(y-lastY)>3) flushLine();
    currentLine.push(str);
    lastY=y;
    if(it.hasEOL) flushLine();
  });
  flushLine();
  return layoutLines.filter(Boolean).join('\n');
}
async function parsePdfArrayBuffer(buf,onProgress=()=>{},shouldCancel=()=>false){
  const loadingTask=pdfjsLib.getDocument({data:buf.slice(0)});
  const pdf = await loadingTask.promise;
  const pages = [];
  onProgress(0,pdf.numPages,'開始解析');
  for(let i=1;i<=pdf.numPages;i++){
    if(shouldCancel()){
      await loadingTask.destroy();
      const err=new Error('使用者已取消PDF解析');
      err.name='ImportCancelledError';
      throw err;
    }
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    const text = tc.items.map(it=>it.str).join(' ');
    const viewport = page.getViewport({scale:1});
    const formattedText=extractFormattedText(tc,viewport.height);
    const positionedText = tc.items.map(it=>({
      text:(it.str || '').trim(),
      x:it.transform ? it.transform[4] : 0,
      y:it.transform ? it.transform[5] : 0
    })).filter(it=>it.text && it.y<=viewport.height*.18);
    pages.push({absolutePage:i, text, formattedText, positionedText, pageWidth:viewport.width, pageHeight:viewport.height});
    page.cleanup();
    onProgress(i,pdf.numPages,'解析頁面文字');
    // 大型合併PDF定期讓出主執行緒，避免瀏覽器將頁面判定為沒有回應。
    if(i%4===0) await new Promise(resolve=>setTimeout(resolve,0));
  }
  await loadingTask.destroy();
  return pages;
}
function romanToInt(s){
  const vals={i:1,v:5,x:10,l:50,c:100,d:500,m:1000};
  s=s.toLowerCase();
  if(!/^[ivxlcdm]+$/.test(s)) return null;
  let total=0;
  for(let i=0;i<s.length;i++){
    const cur=vals[s[i]], next=vals[s[i+1]];
    if(next && cur<next) total-=cur; else total+=cur;
  }
  return total;
}
function parsePageLabelToken(token){
  const cleaned = String(token || '').trim().replace(/[－—–\-_.頁第]/g,'');
  if(/^\d{1,4}$/.test(cleaned)) return {type:'arabic', value:parseInt(cleaned,10)};
  if(/^[ivxlcdm]{1,6}$/i.test(cleaned)){
    const v = romanToInt(cleaned);
    if(v) return {type:'roman', value:v};
  }
  return null;
}
function extractPageLabel(page){
  // PDF 文字陣列的先後順序不代表版面位置，優先從頁面底部 18% 尋找置中的頁碼。
  const footer = (page.positionedText || [])
    .filter(it=>it.y <= page.pageHeight * .18)
    .map(it=>({it, label:parsePageLabelToken(it.text)}))
    .filter(x=>x.label)
    .sort((a,b)=>Math.abs(a.it.x-page.pageWidth/2)-Math.abs(b.it.x-page.pageWidth/2));
  if(footer.length) return footer[0].label;
  // 舊式或座標缺失 PDF 的備援。
  const tokens = page.text.trim().split(/\s+/);
  const last = tokens[tokens.length-1] || '';
  return parsePageLabelToken(last) || {type:'none', value:null};
}
function segmentDocuments(pages){
  const labels = pages.map(p=>extractPageLabel(p));
  const boundaries = new Set();
  const explicitCovers = new Set();
  pages.forEach((page,i)=>{
    // 單靠「文件編號／首次發行日期」會把正文中的表單誤認成封面。
    // 依公司文件固定結構，只有「封面之後緊接異動表」才視為新文件。
    const nextIsRevisionStart = i+1 < pages.length && isRevisionStartPage(pages[i+1].text);
    if(isCoverPage(page.text) && nextIsRevisionStart) explicitCovers.add(i);
  });
  if(explicitCovers.size){
    // 找到真正封面時，以第一個封面為起點；封面之前的總目錄／對照表不建立成SOP。
    explicitCovers.forEach(i=>boundaries.add(i));
  } else {
    // 若整份 PDF 都抽不到封面固定欄位，保留第1頁並退回以 i／正文 1 的重置位置推測分界。
    boundaries.add(0);
    for(let i=0;i<pages.length;i++){
      const lab = labels[i];
      if(lab.type==='roman' && lab.value===1){
        boundaries.add(i);
      } else if(lab.type==='arabic' && lab.value===1){
        const prev = i>0 ? labels[i-1] : null;
        if(!prev || prev.type!=='roman') boundaries.add(i);
      }
    }
  }
  // 把緊接在邊界前、沒有頁碼的封面頁往前納入這份新文件，並記錄哪些索引才是真正的封面頁
  const coverIdxSet = new Set();
  const finalSet = new Set();
  boundaries.forEach(idx=>{
    let start = idx;
    while(!explicitCovers.size && start>0 && labels[start-1].type==='none' && !boundaries.has(start-1)){
      coverIdxSet.add(start-1);
      start--;
    }
    if(explicitCovers.has(idx)) coverIdxSet.add(idx);
    finalSet.add(start);
  });
  const sorted = Array.from(finalSet).sort((a,b)=>a-b);

  const docs = [];
  for(let i=0;i<sorted.length;i++){
    const start = sorted[i];
    const end = (i+1<sorted.length) ? sorted[i+1]-1 : pages.length-1;
    const slice = pages.slice(start, end+1);
    let info = extractHeaderInfo(slice[0].text);
    if(!info.name){
      for(const pg of slice){ const alt = extractHeaderInfo(pg.text); if(alt.name){ info = alt; break; } }
    }
    const name = info.name || guessTitle(slice[0].text);
    const docPages = slice.map((p,rel)=>{
      const absIdx = start+rel;
      // 型態判斷改為只依內容特徵（修訂紀錄關鍵字），封面只認定為明確被歸類的封面索引，不再受頁碼抓取失敗影響
      const type = coverIdxSet.has(absIdx) ? 'cover' : (isRevisionPage(p.text) ? 'revision' : 'content');
      return { pageNum: rel+1, absolutePage: p.absolutePage, text: p.text, formattedText:p.formattedText, type, _label: labels[absIdx] };
    });
    docs.push({name, pages:docPages});
  }
  return docs;
}

function bindImeSafeSearch(input, setValue, rerender){
  if(!input) return;
  let composing = false;
  input.addEventListener('compositionstart', ()=>{ composing = true; });
  input.addEventListener('input', e=>{
    setValue(e.target.value);
    if(!composing && !e.isComposing) rerender();
  });
  input.addEventListener('compositionend', e=>{
    composing = false;
    setValue(e.target.value);
    rerender();
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function parseSearchTerms(keyword){
  return [...new Set(keyword.trim().split(/\s+/).map(s=>s.trim()).filter(Boolean))];
}
function readablePdfText(text){
  let out = String(text || '').replace(/\s+/g,' ').trim();
  // 移除PDF抽字時夾在中文字之間的假空格，但保留一般詞組及英文空格。
  for(let i=0;i<6;i++){
    const next = out.replace(/([\u3400-\u9fff])\s+([\u3400-\u9fff])/g,'$1$2');
    if(next===out) break;
    out=next;
  }
  return out;
}
function searchComparable(text){
  return readablePdfText(text).toLocaleLowerCase().replace(/\s+/g,'');
}
function makeSearchSnippet(text, term){
  const readable = readablePdfText(text);
  const compactTerm = term.replace(/\s+/g,'');
  const comparable = readable.toLocaleLowerCase();
  let idx = comparable.indexOf(compactTerm.toLocaleLowerCase());
  if(idx<0){
    // 搜尋時忽略空格；若原文仍有特殊空白，退回顯示頁面開頭。
    return `…${escapeHtml(readable.slice(0,70))}${readable.length>70?'…':''}`;
  }
  const start = Math.max(0,idx-32);
  const end = Math.min(readable.length,idx+compactTerm.length+48);
  return `${start>0?'…':''}${escapeHtml(readable.slice(start,idx))}<span class="highlight">${escapeHtml(readable.slice(idx,idx+compactTerm.length))}</span>${escapeHtml(readable.slice(idx+compactTerm.length,end))}${end<readable.length?'…':''}`;
}
const SMART_CONCEPTS=[

  ['列車異常','列車故障'],

const QUESTION_WORDS=/如何|怎麼辦|怎麼|怎樣|遭遇|遇到|發生|應如何|要如何|請問|規定為何|處理方式/g;
const ACTION_ALIASES=['處理','處置','應變','排除','救援','通報','停機','管制','確認'];
let lastSearchPlan=null;
function buildSmartSearchPlan(keyword){
  const normalized=searchComparable(keyword);
  const groups=[];
  const customGroups=cache.synonymGroups.map(g=>[g.canonical,...(g.aliases||[])].filter(Boolean));
  [...SMART_CONCEPTS,...customGroups].forEach(aliases=>{
    if(aliases[0]==='真實火警'&&/(?:非真實火警|火警誤報|誤報|假火警)/.test(normalized)) return;
    if(aliases.some(alias=>normalized.includes(searchComparable(alias)))) groups.push(aliases);
  });
  const rawTerms=parseSearchTerms(keyword.replace(QUESTION_WORDS,' ').replace(/[，。？！、；：]/g,' '));
  rawTerms.forEach(term=>{
    if(term.length<2||ACTION_ALIASES.includes(term)) return;
    if(!groups.some(group=>group.some(alias=>searchComparable(alias).includes(searchComparable(term))||searchComparable(term).includes(searchComparable(alias))))) groups.push([term]);
  });
  if(!groups.length){
    parseSearchTerms(keyword).forEach(term=>groups.push([term]));
  }
  const expanded=[...new Set(groups.flat())];
  const intent=ACTION_ALIASES.filter(word=>normalized.includes(searchComparable(word)));
  if(/如何|怎麼|處理方式|怎麼辦/.test(keyword)&&!intent.length) intent.push('處理','處置','應變');
  return {groups,expanded,intent,isSmart:expanded.some(t=>!normalized.includes(searchComparable(t)))||/如何|怎麼|怎樣|請問/.test(keyword)};
}
function groupMatches(text,group){
  const comparable=searchComparable(text);
  return group.some(alias=>comparable.includes(searchComparable(alias)));
}
function highlightedClause(text,terms){
  const readable=readablePdfText(text);
  const display=readable.length>320?`${readable.slice(0,320)}…`:readable;
  return highlightReaderText(display,terms);

function searchSop(keyword,plan){
  const out = [];
  cache.sopDocs.forEach(doc=>{
    const displayName=resolvedDocName(doc);
    const titleMatches=plan.groups.map(group=>groupMatches(displayName,group));
    const pages = doc.pages.filter(p=>p.type!=='cover' && !(sopFilter==='content' && p.type==='revision'));
    if(titleMatches.every(Boolean) && pages.length){
      const p=pages[0];
      out.push({source:'sop',docId:doc.id,docName:displayName,pdfFileId:doc.pdfFileId,pageNum:p.pageNum,absolutePage:p.absolutePage,titleMatched:true,snippetsHtml:[],score:50});
      return;
    }
    pages.forEach(p=>{
      const paragraphs=parseSopParagraphs(p.formattedText||p.text);
      paragraphs.forEach(paragraph=>{
        const clauseMatches=plan.groups.map(group=>groupMatches(paragraph.text,group));
        if(!plan.groups.every((group,i)=>titleMatches[i]||clauseMatches[i])) return;
        const matchedAliases=plan.expanded.filter(alias=>groupMatches(paragraph.text,[alias]));
        let score=clauseMatches.filter(Boolean).length*10+titleMatches.filter(Boolean).length*4;
        score+=plan.intent.filter(word=>groupMatches(paragraph.text,[word])).length*2;
        if(paragraph.marker) score+=2;
        out.push({
          source:'sop',docId:doc.id,docName:displayName,pdfFileId:doc.pdfFileId,pageNum:p.pageNum,absolutePage:p.absolutePage,
          titleMatched:titleMatches.some(Boolean),clauseMarker:paragraph.marker,score,
          snippetsHtml:[highlightedClause(paragraph.text,matchedAliases.length?matchedAliases:plan.expanded)]
        });
      });
    });
  });
  return out.sort((a,b)=>b.score-a.score||a.docName.localeCompare(b.docName,'zh-Hant')||a.pageNum-b.pageNum).slice(0,100);
}
function searchNotices(keyword,plan){
  return cache.announcements.map(n=>{
    const combined=searchComparable(`${n.title} ${n.category||''} ${n.content||''}`);
    const matches=plan.groups.map(group=>group.some(alias=>combined.includes(searchComparable(alias))));
    if(!matches.every(Boolean)) return null;
    const matched=plan.expanded.filter(alias=>combined.includes(searchComparable(alias)));
    return {
    source:'notice',noticeId:n.id,docName:n.title,pageNum:null,absolutePage:null,
    titleMatched:plan.groups.some(group=>groupMatches(n.title,group)),score:matches.filter(Boolean).length*10,
    snippetsHtml:[highlightedClause(n.content||n.title,matched)]
  };}).filter(Boolean).sort((a,b)=>b.score-a.score);
}
function searchUnified(keyword){
  const plan=buildSmartSearchPlan(keyword);
  lastSearchPlan=plan;
  let out=[];
  if(searchSource!=='notice') out=out.concat(searchSop(keyword,plan));
  if(searchSource!=='sop') out=out.concat(searchNotices(keyword,plan));
  return out.sort((a,b)=>(b.score||0)-(a.score||0));
}
async function recordUnmatchedQuery(query){
  const cleaned=String(query||'').trim();
  if(!cleaned) return;
  const existing=cache.unmatchedQueries.find(q=>q.query===cleaned);
  if(existing){
    existing.count=(existing.count||1)+1;
    existing.lastUsedAt=new Date().toISOString();
    await dbPut('unmatchedQueries',existing);
  }else{
    await dbAdd('unmatchedQueries',{query:cleaned,count:1,lastUsedAt:new Date().toISOString()});
  }
  cache.unmatchedQueries=await dbGetAll('unmatchedQueries');
}

function sortedProcedures(){
  return [...cache.favorites].sort((a,b)=>
    (Number(a.sortOrder)||999999)-(Number(b.sortOrder)||999999) ||
    (a.createdAt||'').localeCompare(b.createdAt||'')
  );
}
async function moveProcedure(id,direction){
  const rows=sortedProcedures();
  const index=rows.findIndex(r=>r.id===id);
  const other=index+direction;
  if(index<0||other<0||other>=rows.length) return;
  rows.forEach((row,i)=>{ if(!row.sortOrder) row.sortOrder=i+1; });
  const temp=rows[index].sortOrder;
  rows[index].sortOrder=rows[other].sortOrder;
  rows[other].sortOrder=temp;
  await dbPut('favorites',rows[index]);
  await dbPut('favorites',rows[other]);
  await reloadCache();
}

async function handlePdfImport(file){
  let cancelled=false;
  let importStage='讀取PDF';
  const startedAt=Date.now();
  contentEl.innerHTML = `<div class="card" style="max-width:620px;text-align:center;padding:30px 26px;">
    <div style="font-size:32px;margin-bottom:10px;">📄</div>
    <h2 style="font-size:18px;margin:0 0 6px;">正在解析PDF</h2>
    <p id="pdf-progress-file" class="muted" style="margin:0 0 18px;word-break:break-all;">${escapeHtml(file.name)}</p>
    <div style="height:9px;background:#e5e5ea;border-radius:99px;overflow:hidden;">
      <div id="pdf-progress-bar" style="width:1%;height:100%;background:var(--accent);border-radius:99px;transition:width .2s ease;"></div>
    </div>
    <p id="pdf-progress-main" style="font-size:15px;font-weight:650;margin:14px 0 4px;">讀取檔案中…</p>
    <p id="pdf-progress-time" class="tiny-muted" style="margin:0 0 18px;">大型合併PDF可能需要數分鐘，請保持此頁開啟</p>
    <button class="secondary" id="pdf-import-cancel">取消解析</button>
  </div>`;
  const cancelBtn=document.getElementById('pdf-import-cancel');
  cancelBtn.addEventListener('click',()=>{
    cancelled=true;
    cancelBtn.disabled=true;
    cancelBtn.textContent='正在取消…';
  });
  const timer=setInterval(()=>{
    const elapsed=Math.floor((Date.now()-startedAt)/1000);
    const timeEl=document.getElementById('pdf-progress-time');
    if(timeEl) timeEl.textContent=`已執行 ${Math.floor(elapsed/60)}分${String(elapsed%60).padStart(2,'0')}秒｜大型合併PDF可能需要數分鐘`;
  },1000);
  try{
    const buf = await file.arrayBuffer();
    if(cancelled){
      const err=new Error('使用者已取消PDF解析');
      err.name='ImportCancelledError';
      throw err;
    }
    importStage='解析PDF';
    const pages = await parsePdfArrayBuffer(buf,(current,total,stage)=>{
      const pct=total?Math.max(1,Math.round(current/total*100)):1;
      const bar=document.getElementById('pdf-progress-bar');
      const main=document.getElementById('pdf-progress-main');
      if(bar) bar.style.width=`${pct}%`;
      if(main) main.textContent=current===0
        ? `共 ${total.toLocaleString()} 頁，準備開始`
        : `${stage}：第 ${current.toLocaleString()}／${total.toLocaleString()} 頁（${pct}%）`;
    },()=>cancelled);
    const main=document.getElementById('pdf-progress-main');
    if(main) main.textContent='正在辨識封面、修訂紀錄與文件邊界…';
    importStage='辨識文件邊界';
    const docs = segmentDocuments(pages);
    if(cancelled){
      const err=new Error('使用者已取消PDF解析');
      err.name='ImportCancelledError';
      throw err;
    }
    const textOnlyMode=location.protocol==='file:';
    if(main) main.textContent=textOnlyMode
      ? '正在建立本機文字索引…'
      : '正在儲存至本機資料庫…';
    importStage='寫入本機資料庫';
    await ensureDB();
    const pdfFileId = await withTimeout(dbAdd('pdfFiles', {
      fileName:file.name, displayName:file.name.replace(/\.pdf$/i,''),
      // file:// 受管制電腦不把大型PDF二進位檔寫入IndexedDB，避免交易長時間停滯。
      data:textOnlyMode?null:buf, originalStored:!textOnlyMode,
      uploadedAt:new Date().toISOString(), pageCount:pages.length, documentCount:0,
      fileSize:file.size, status:textOnlyMode?'待確認（文字索引模式）':'待確認'
    }),20000,'本機資料庫在20秒內沒有回應，請關閉所有舊版頁面並重新開啟瀏覽器。');
    clearInterval(timer);
    showImportReview(docs, pdfFileId, textOnlyMode);
  }catch(err){
    clearInterval(timer);
    console.error('PDF匯入失敗',err);
    if(err?.name==='ImportCancelledError'){
      renderLibrary();
      return;
    }
    const quota=/quota|storage|空間/i.test(`${err?.name||''} ${err?.message||''}`);
    const databaseError=importStage==='寫入本機資料庫'||/transaction|database|indexeddb|本機資料庫/i.test(`${err?.name||''} ${err?.message||''}`);
    contentEl.innerHTML=`<div class="card" style="max-width:620px;text-align:center;padding:30px 26px;">
      <div style="font-size:34px;margin-bottom:10px;">⚠️</div>
      <h2 style="font-size:18px;margin:0 0 8px;">${databaseError?'本機資料儲存未完成':'PDF解析未完成'}</h2>
      <p class="muted" style="line-height:1.7;margin:0 0 8px;">${quota?'瀏覽器本機儲存空間不足，請先匯出備份並清理不需要的文件。':databaseError?'PDF已完成解析，但瀏覽器本機資料庫連線中斷，請關閉其他同版本頁面後重試。':'可能是PDF格式、密碼保護、記憶體不足或解析元件載入失敗。'}</p>
      <p class="tiny-muted" style="margin:0 0 8px;">失敗階段：${escapeHtml(importStage)}</p>
      <p class="tiny-muted" style="word-break:break-all;background:#f2f2f7;padding:9px;border-radius:8px;margin:0 0 16px;">${escapeHtml(err?.message||'未知錯誤')}</p>
      <button class="primary" id="pdf-import-retry" style="margin-right:8px;">重新選擇PDF</button>
      <button class="secondary" id="pdf-import-back">返回文件庫</button>
    </div>`;
    document.getElementById('pdf-import-retry').addEventListener('click',()=>{
      renderLibrary();
      setTimeout(()=>document.getElementById('pdf-file-input')?.click(),0);
    });
    document.getElementById('pdf-import-back').addEventListener('click',()=>renderLibrary());
  }
}

    <button id="review-cancel" style="background:none;border:none;font-size:18px;">✕</button></div>
    <div class="modal-body">

        <p class="muted" style="line-height:1.65;margin:6px 0 0;">已完成PDF解析。為避免公司電腦的本機資料庫卡住，系統只保存文字、文件分段及頁碼；原始PDF請直接從電腦資料夾開啟。</p>
      </div>`:''}
      <div id="review-body">${renderReviewBody(docs)}</div>
    </div>
    <div style="padding:12px 16px;border-top:0.5px solid var(--border);background:var(--card);">
      <button class="primary" id="review-confirm" style="width:100%;">確認匯入</button>
    </div>
  </div></div>`;
  contentEl.insertAdjacentHTML('beforeend', html);

  function bindReviewEvents(){
    document.querySelectorAll('[data-name-idx]').forEach(inp=>{
      inp.addEventListener('input', ()=>{ docs[Number(inp.dataset.nameIdx)].name = inp.value; });
    });
    document.querySelectorAll('[data-toggle-detail]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const el = document.getElementById('detail-'+btn.dataset.toggleDetail);
        el.style.display = el.style.display==='none' ? 'block' : 'none';
      });
    });
    document.querySelectorAll('[data-show-full]').forEach(p=>{
      p.addEventListener('click', ()=>{
        const el = document.getElementById('full-'+p.dataset.showFull);
        el.style.display = el.style.display==='none' ? 'block' : 'none';
      });
    });
    document.querySelectorAll('[data-merge-up]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const i = Number(btn.dataset.mergeUp);
        // 合併：把doc[i]的頁面接到doc[i-1]後面，並重新標記型態（此doc原本的封面頁改標為正文，因已併入前一份）
        const merging = docs[i];
        merging.pages.forEach((p,idx)=>{ if(idx===0) p.type='content'; });
        docs[i-1].pages = docs[i-1].pages.concat(merging.pages);
        docs.splice(i,1);
        document.getElementById('review-body').innerHTML = renderReviewBody(docs);
        bindReviewEvents();
      });
    });
  }
  bindReviewEvents();

  document.getElementById('review-cancel').addEventListener('click', async ()=>{
    await dbDelete('pdfFiles', pdfFileId);
    render();
  });
  document.getElementById('review-confirm').addEventListener('click', async ()=>{
    for(const doc of docs){
      await dbAdd('sopDocs', {pdfFileId, name: doc.name || '未命名文件', pages:doc.pages});
    }
    const pdfRec=cache.pdfFiles.find(f=>f.id===pdfFileId) || await dbGet('pdfFiles',pdfFileId);
    if(pdfRec){
      pdfRec.documentCount=docs.length;
      pdfRec.status=textOnlyMode?'已完成（文字索引）':'已完成';
      await dbPut('pdfFiles',pdfRec);
    }
    await reloadCache();
    sopKeyword=''; sopFilter='content';
    currentTab='library';
    render();
  });
}

/* --- SOP text reader modal --- */
function highlightReaderText(text, terms){
  const readable = readablePdfText(text);
  const lower = readable.toLocaleLowerCase();
  const ranges=[];
  terms.forEach(term=>{
    const needle=readablePdfText(term).toLocaleLowerCase();
    if(!needle) return;
    let from=0,idx;
    while((idx=lower.indexOf(needle,from))>=0){
      ranges.push([idx,idx+needle.length]);
      from=idx+Math.max(1,needle.length);
    }
  });
  ranges.sort((a,b)=>a[0]-b[0]);
  const merged=[];
  ranges.forEach(r=>{
    const last=merged[merged.length-1];
    if(last && r[0]<=last[1]) last[1]=Math.max(last[1],r[1]);
    else merged.push([...r]);
  });
  let html='',pos=0;
  merged.forEach(([start,end])=>{
    html+=escapeHtml(readable.slice(pos,start));
    html+=`<span class="highlight">${escapeHtml(readable.slice(start,end))}</span>`;
    pos=end;
  });
  return html+escapeHtml(readable.slice(pos));
}
function stripSopPageHeader(text){
  let source=String(text||'').trim();
  let rawLines=source.split(/\n+/);
  const chapterIndex=rawLines.slice(0,6).findIndex(line=>/章\s*節\s*[:：]/.test(line));
  if(chapterIndex>=0){
    const chapterLine=rawLines[chapterIndex].replace(/\s+/g,' ').trim();
    const afterChapter=chapterLine.split(/章\s*節\s*[:：]/).slice(1).join('').trim();
    const bodyStart=afterChapter.match(/^(?:\d{1,4}\s+)?(\d{1,3}(?:\.\d+)*\.\s*[\u3400-\u9fff][\s\S]*)$/);
    rawLines=rawLines.slice(chapterIndex+1);
    if(bodyStart) rawLines.unshift(bodyStart[1]);
  }else{
    source=source.replace(/^[\s\S]*?文件名稱[\s\S]*?章節\s*[:：]\s*(?:\d{1,3}\s+(?=\d{1,3}\.))?/,'');
    rawLines=source.split(/\n+/);
  }
  return rawLines.map((line,lineIndex)=>{
    let cleaned=line.replace(/\s+/g,' ').trim();
    if(/^(文件名稱|文件編號)\s*[:：]/.test(cleaned)) return '';
    if(/^最新版別\s*[:：]/.test(cleaned)) return '';
    if(/^\d{1,4}$/.test(cleaned)) return '';
    if(/最新版別/.test(cleaned) && /章節/.test(cleaned)){
      cleaned=cleaned.replace(/^.*?章節\s*[:：]?\s*\d+\s*/,'');
    }
    return cleaned;
  }).filter(Boolean);
}
function parenthesisDelta(text){
  let delta=0;
  for(const c of text){ if(c==='('||c==='（') delta++; if(c===')'||c==='）') delta--; }
  return delta;
}
function detectClauseMarker(line,insideParentheses){
  if(insideParentheses) return null;
  let top=line.match(/^(\d{1,2})\.(?=\s*[\u3400-\u9fff【])/);
  if(top) return {marker:top[1],className:'level-2'};
  let m=line.match(/^(\d{1,2}(?:\.\d+){1,4})\.?(?=\s|[^\d.])/);
  if(m){
    const after=line.slice(m[0].length).trim();
    if(/^(?:說明|規定|辦理|所述)/.test(after)) return null;
    const depth=m[1].split('.').length;
    return {marker:m[1],className:depth===2?'level-2':'level-3'};
  }
  m=line.match(/^([A-Z](?:\.\d+)+|[A-Z]\.)(?=\s|[\u3400-\u9fff【（(])/);
  if(m) return {marker:m[1].replace(/\.$/,''),className:'letter'};
  m=line.match(/^[（(](\d+)[）)]/);
  if(m) return {marker:`(${m[1]})`,className:'subitem'};
  m=line.match(/^(步驟[一二三四五六七八九十]+)[、：:\s]/);
  if(m) return {marker:m[1],className:'letter'};
  return null;
}
function splitInlineStructures(line){
  const candidates=[];
  const patterns=[
    /\d{1,2}(?:\.\d+){1,4}\.?(?=\s*[\u3400-\u9fff【])/g,
    /\d{1,2}\.(?=\s*[\u3400-\u9fff【])/g,
    /[A-Z]\.(?:\d+)?(?=\s|[\u3400-\u9fff【])/g,
    /步驟[一二三四五六七八九十]+(?=[、：:\s])/g
  ];
  patterns.forEach(pattern=>{
    for(const m of line.matchAll(pattern)){
      if(m.index===0) continue;
      const before=line.slice(0,m.index);
      const prev=before.slice(-4);
      if((before.match(/[（(]/g)||[]).length>(before.match(/[）)]/g)||[]).length) continue;
      if(/(?:見|詳見|參照|依照|比照)\s*$/.test(prev)) continue;
      const preceding=line[m.index-1]||'';
      if(!/[\s。；;：:，,）)]/.test(preceding)) continue;
      candidates.push(m.index);
    }
  });
  const points=[0,...new Set(candidates)].sort((a,b)=>a-b);
  return points.map((start,i)=>line.slice(start,points[i+1]??line.length).trim()).filter(Boolean);
}
function parseSopParagraphs(text){
  const lines=stripSopPageHeader(text).flatMap(splitInlineStructures);
  const paragraphs=[];
  let current=null,parenDepth=0;
  const pushCurrent=()=>{ if(current?.text) paragraphs.push(current); current=null; };
  lines.forEach(line=>{
    const marker=detectClauseMarker(line,parenDepth>0);
    if(marker){
      pushCurrent();
      current={text:line,marker:marker.marker,className:marker.className};
      parenDepth=Math.max(0,parenthesisDelta(line));
    }else if(current){
      current.text+=` ${line}`;
      parenDepth=Math.max(0,parenDepth+parenthesisDelta(line));
    }else{
      current={text:line,marker:null,className:''};
      parenDepth=Math.max(0,parenthesisDelta(line));
    }
  });
  pushCurrent();
  return paragraphs;
}
function formatStructuredSopText(text,terms){
  return parseSopParagraphs(text).map(paragraph=>{
    let content=highlightReaderText(paragraph.text,terms);
    content=content.replace(/(見|詳見|依照?|參照|比照)(?:第)?((?:\d+(?:\.\d+)+)|(?:[A-Z]\.\d+))/g,
      '$1<span class="reference-chip" data-clause-ref="$2">$2</span>');
    const clauseAttr=paragraph.marker?` data-clause="${escapeHtml(paragraph.marker)}"`:'';
    return `<div class="sop-block ${paragraph.className}"${clauseAttr}>${content}</div>`;
  }).join('');
}
function readablePageForCopy(page){
  return parseSopParagraphs(page.formattedText||page.text).map(p=>p.text).join('\n\n');
}
async function copyTextToClipboard(text){
  try{
    if(navigator.clipboard?.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(_){}
  const area=document.createElement('textarea');
  area.value=text;
  area.style.position='fixed';
  area.style.opacity='0';
  document.body.appendChild(area);
  area.focus();area.select();
  const ok=document.execCommand('copy');
  area.remove();
  return ok;
}
async function ensureDocumentLayoutText(doc){
  if(doc.pages.every(p=>p.formattedText)) return;
  const rec=cache.pdfFiles.find(f=>f.id===doc.pdfFileId);
  if(!rec?.data) return;
  const loading=document.createElement('div');
  loading.className='modal-overlay';
  loading.style.zIndex='80';
  loading.innerHTML=`<div class="modal-sheet" style="height:auto;"><div class="modal-body" style="text-align:center;padding:30px;">
    <div style="font-size:28px;">⏳</div><p>首次整理PDF原始段落，請稍候…</p>
  </div></div>`;
  document.getElementById('phone').appendChild(loading);
  try{
    const pdf=await pdfjsLib.getDocument({data:rec.data.slice(0)}).promise;
    for(const p of doc.pages){
      if(p.formattedText) continue;
      const pdfPage=await pdf.getPage(p.absolutePage);
      const tc=await pdfPage.getTextContent();
      const viewport=pdfPage.getViewport({scale:1});
      p.formattedText=extractFormattedText(tc,viewport.height);
    }
    await dbPut('sopDocs',doc);
  }finally{
    loading.remove();
  }
}
async function openTextReader(docId,absolutePage,targetClause=null){
  const doc=cache.sopDocs.find(d=>d.id===docId);
  if(!doc) return alert('找不到這份文件，請重新整理後再試。');
  await ensureDocumentLayoutText(doc);
  const displayName=resolvedDocName(doc);
  await addRecentView({type:'sop',docId:doc.id,absolutePage,title:displayName});
  const eligible=doc.pages.filter(p=>p.type!=='cover' && !(sopFilter==='content' && p.type==='revision'));
  let currentIndex=eligible.findIndex(p=>p.absolutePage===absolutePage);
  if(currentIndex<0) currentIndex=0;
  const terms=parseSearchTerms(sopKeyword);
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.style.zIndex='70';
  overlay.innerHTML=`<div class="modal-sheet" style="height:96%;">
    <div class="modal-header">
      <span style="font-weight:600;font-size:13px;line-height:1.4;padding-right:8px;">${escapeHtml(displayName)}</span>
      <button id="reader-close" style="background:none;border:none;font-size:18px;flex-shrink:0;">✕</button>
    </div>
    <div class="modal-body" id="reader-body"></div>
    <div style="padding:10px 14px;border-top:0.5px solid var(--border);background:var(--card);">
      <div class="reader-nav">
        <button class="secondary" id="reader-prev">← 上一頁</button>
        <button class="secondary" id="reader-next">下一頁 →</button>
      </div>
      <div class="reader-nav" style="margin-bottom:0;">
        <button class="secondary" id="reader-favorite">☆ 加入常用</button>
        <button class="primary" id="reader-pdf">查看PDF原版</button>
      </div>
    </div>
  </div>`;
  document.getElementById('phone').appendChild(overlay);
  function draw(){
    const start=Math.max(0,currentIndex-1);
    const end=Math.min(eligible.length-1,currentIndex+1);
    let html=`<p class="tiny-muted" style="margin:0 0 10px;">顯示命中頁及相鄰頁；藍框為目前頁面。</p>`;
    for(let i=start;i<=end;i++){
      const p=eligible[i];
      html+=`<section class="reader-page ${i===currentIndex?'current':''}" data-reader-index="${i}">
        <div class="reader-page-title">
          <span>${typeLabel(p.type)}</span>
          <div class="row"><span>PDF第${p.absolutePage}頁</span>
            <button class="mini-action" data-copy-reader-page="${i}">複製</button></div>
        </div>
        <div class="reader-text">${formatStructuredSopText(p.formattedText||p.text,terms)}</div>
      </section>`;
    }
    document.getElementById('reader-body').innerHTML=html;
    document.getElementById('reader-prev').disabled=currentIndex===0;
    document.getElementById('reader-next').disabled=currentIndex===eligible.length-1;
    const currentSaved={type:'sop',docId:doc.id,absolutePage:eligible[currentIndex].absolutePage,title:displayName};
    document.getElementById('reader-favorite').textContent=favoriteFor(currentSaved)?'★ 已加入常用':'☆ 加入常用';
    document.querySelectorAll('[data-reader-index]').forEach(el=>{
      el.addEventListener('click',e=>{
        if(e.target.closest('button')||window.getSelection()?.toString()) return;
        currentIndex=Number(el.dataset.readerIndex); draw();
      });
    });
    document.querySelectorAll('[data-copy-reader-page]').forEach(btn=>{
      btn.addEventListener('click',async e=>{
        e.stopPropagation();
        const page=eligible[Number(btn.dataset.copyReaderPage)];
        const ok=await copyTextToClipboard(readablePageForCopy(page));
        const original=btn.textContent;
        btn.textContent=ok?'已複製':'複製失敗';
        setTimeout(()=>{if(btn.isConnected)btn.textContent=original;},1200);
      });
    });
    document.querySelectorAll('[data-clause-ref]').forEach(refEl=>{
      refEl.addEventListener('click',e=>{
        e.stopPropagation();
        const target=refEl.dataset.clauseRef;
        const targetIndex=eligible.findIndex(p=>
          parseSopParagraphs(p.formattedText||p.text).some(paragraph=>paragraph.marker===target)
        );
        if(targetIndex<0) return alert(`本文件中找不到條文 ${target}，請查看PDF原版。`);
        currentIndex=targetIndex;
        draw();
        setTimeout(()=>{
          [...document.querySelectorAll('[data-clause]')].find(el=>el.dataset.clause===target)
            ?.scrollIntoView({behavior:'smooth',block:'center'});
        },80);
      });
    });
    requestAnimationFrame(()=>{
      document.querySelector('.reader-page.current')?.scrollIntoView({block:'center'});
    });
  }
  document.getElementById('reader-close').addEventListener('click',()=>{
    overlay.remove();
    if(currentTab==='sop'&&!sopKeyword) render();
  });
  document.getElementById('reader-prev').addEventListener('click',()=>{ if(currentIndex>0){currentIndex--;draw();} });
  document.getElementById('reader-next').addEventListener('click',()=>{ if(currentIndex<eligible.length-1){currentIndex++;draw();} });
  document.getElementById('reader-favorite').addEventListener('click',async()=>{
    const p=eligible[currentIndex];
    await toggleFavorite({type:'sop',docId:doc.id,absolutePage:p.absolutePage,title:displayName});
    draw();
  });
  document.getElementById('reader-pdf').addEventListener('click',()=>{
    const p=eligible[currentIndex];
    overlay.remove();
    openPdfViewer(doc.pdfFileId,p.absolutePage);
  });
  draw();
  if(targetClause){
    setTimeout(()=>{
      [...document.querySelectorAll('[data-clause]')].find(el=>el.dataset.clause===targetClause)
        ?.scrollIntoView({behavior:'smooth',block:'center'});
    },120);
  }
}

async function openPdfViewer(pdfFileId, pageNum){
  const rec = cache.pdfFiles.find(f=>f.id===pdfFileId);
  if(!rec) return;
  if(!rec.data){
    return alert(`此文件以電腦文字索引模式匯入，未將原始PDF存入瀏覽器。\n\n請直接從電腦資料夾開啟：${rec.fileName||'原始PDF'}`);
  }
  const html = `<div class="modal-overlay" id="pdf-viewer-overlay" style="z-index:80;"><div class="modal-sheet" style="height:96%;">
    <div class="modal-header"><span style="font-weight:500;">第${pageNum}頁</span>
    <button id="pdf-viewer-close" style="background:none;border:none;font-size:18px;">✕</button></div>
    <div class="modal-body" style="padding:0;" id="pdf-canvas-wrap"><p class="muted" style="padding:20px;">載入中…</p></div>
  </div></div>`;
  contentEl.insertAdjacentHTML('beforeend', html);
  document.getElementById('pdf-viewer-close').addEventListener('click', ()=>{
    document.getElementById('pdf-viewer-overlay').remove();
  });
  const pdf = await pdfjsLib.getDocument({data:rec.data.slice(0)}).promise;
  const page = await pdf.getPage(pageNum);
  const viewport = page.getViewport({scale:1.4});
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width; canvas.height = viewport.height;
  const wrap = document.getElementById('pdf-canvas-wrap');
  wrap.innerHTML=''; wrap.appendChild(canvas);
  await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
}

function formatFileSize(bytes){

  return n>=1048576 ? `${(n/1048576).toFixed(1)} MB` : `${Math.ceil(n/1024)} KB`;
}
function formatUploadDate(value){

            <p class="ios-entry-subtitle">查詢 ${q.count||1} 次</p></div>
          <button class="mini-action" data-teach-unmatched="${q.id}">建立對應</button>
        </div>`;
      });
      html+='</div>';
    }
    body.innerHTML=html;
    body.querySelectorAll('[data-synonym-edit]').forEach(btn=>btn.addEventListener('click',async()=>{
      const group=cache.synonymGroups.find(g=>g.id===Number(btn.dataset.synonymEdit));
      if(group&&await openSynonymDialog('',group.canonical,group)) draw();
    }));
    body.querySelectorAll('[data-synonym-delete]').forEach(btn=>btn.addEventListener('click',async()=>{
      if(!confirm('確定刪除這組自訂同義詞嗎？')) return;
      await dbDelete('synonymGroups',Number(btn.dataset.synonymDelete));await reloadCache();draw();
    }));
    body.querySelectorAll('[data-teach-unmatched]').forEach(btn=>btn.addEventListener('click',async()=>{
      const row=cache.unmatchedQueries.find(q=>q.id===Number(btn.dataset.teachUnmatched));
      if(row&&await openSynonymDialog(row.query,'')){
        await dbDelete('unmatchedQueries',row.id);await reloadCache();draw();
      }
    }));
    body.querySelector('#clear-unmatched')?.addEventListener('click',async()=>{
      if(!confirm('確定清除所有查無結果紀錄嗎？')) return;
      for(const row of cache.unmatchedQueries) await dbDelete('unmatchedQueries',row.id);
      await reloadCache();draw();
    });
  }
  overlay.querySelector('#synonym-back').addEventListener('click',()=>{overlay.remove();renderLibrary();});
  overlay.querySelector('#synonym-add').addEventListener('click',async()=>{if(await openSynonymDialog('','')) draw();});
  draw();
}

/* --- Data management (export/import) --- */
function bufToBase64(buf){
  let binary=''; const bytes = new Uint8Array(buf);
  const chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    binary += String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
  }
  return btoa(binary);
}
function base64ToBuf(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return bytes.buffer;
}
async function exportData(){
  const dump = {};
  for(const name of STORES){
    const rows = await dbGetAll(name);
    dump[name] = rows.map(r=>{
      if(name==='pdfFiles') return {...r, data:r.data?bufToBase64(r.data):null};
      return r;
    });
  }
  const blob = new Blob([JSON.stringify(dump)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `station-assistant-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
}
async function importData(file){
  const text = await file.text();
  const dump = JSON.parse(text);
  for(const name of STORES){
    if(!dump[name]) continue;
    for(const row of dump[name]){
      const copy = {...row};
      delete copy.id;
      if(name==='pdfFiles'){
        if(location.protocol==='file:'){
          copy.data=null;
          copy.originalStored=false;
          if(copy.status?.startsWith('已完成')) copy.status='已完成（文字索引）';
        }else{
          copy.data=copy.data?base64ToBuf(copy.data):null;
        }
      }
      await dbAdd(name, copy);
    }
  }
  await reloadCache();
  render();
}
function openDataMgmt(){
  const html = `<div class="modal-overlay" id="dm-overlay"><div class="modal-sheet" style="height:auto;">
    <div class="modal-header"><span style="font-weight:500;">資料管理</span>
      <button id="dm-close" style="background:none;border:none;font-size:18px;">✕</button></div>
    <div class="modal-body">
      <div class="card" style="margin-top:0;">
        <div class="row between"><strong style="font-size:14px;">本機資料狀態</strong><span class="badge cover">離線儲存</span></div>
        <p class="muted" style="margin:8px 0 0;">${cache.pdfFiles.length} 個PDF來源・${cache.sopDocs.length} 份SOP・${cache.announcements.length} 則通告</p>
        <p class="tiny-muted" style="margin:5px 0 0;">手機 GitHub PWA版本 v3.0・2026.07.31</p>
      </div>
      <p class="muted">匯出後可透過公司允許的方式傳到另一台裝置，再手動匯入。各裝置資料彼此獨立，不會自動同步。</p>
      <button class="primary" id="dm-export" style="width:100%;margin-bottom:10px;">匯出至其他裝置</button>
      <button class="secondary" id="dm-import" style="width:100%;">從其他裝置匯入</button>
      <input type="file" id="dm-import-input" accept="application/json" style="display:none">
    </div>
  </div></div>`;
  contentEl.insertAdjacentHTML('beforeend', html);
  document.getElementById('dm-close').addEventListener('click', ()=>document.getElementById('dm-overlay').remove());
  document.getElementById('dm-export').addEventListener('click', exportData);
  document.getElementById('dm-import').addEventListener('click', ()=>document.getElementById('dm-import-input').click());
  document.getElementById('dm-import-input').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(confirm('匯入的資料會加進目前資料庫（不會清除既有資料），確定匯入嗎？')){
      await importData(file);
      document.getElementById('dm-overlay').remove();
    }
  });
}
