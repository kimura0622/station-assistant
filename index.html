const RIDERSHIP_LINES = {
  BR:'文湖線', R:'淡水信義線', G:'松山新店線',
  O:'中和新蘆線', BL:'板南線', Y:'環狀線'
};
const MONTH_LABELS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
function parseRidershipStation(raw){
  const source = String(raw||'').replace(/\s+/g,' ').trim();
  const match = source.match(/^(.*?)\s*[（(]\s*((?:BR|BL|B|R|G|O|Y)\s*\d+[A-Z]?)\s*[)）]\s*$/i);
  if(!match) return {station:source, code:'', lineCode:'', lineName:'未識別線別', stationKey:source};
  const station = match[1].trim();
  let code = match[2].replace(/\s+/g,'').toUpperCase();
  const legacyB=code.match(/^B(\d{1,2})$/);
  if(legacyB&&Number(legacyB[1])>=1&&Number(legacyB[1])<=11) code=`BR${Number(legacyB[1])+13}`;
  if(code==='G01A') code='G03A';
  const prefix = (code.match(/^(BR|BL|R|G|O|Y)/)||[])[1] || '';
  return {station, code, lineCode:prefix, lineName:RIDERSHIP_LINES[prefix]||'未識別線別', stationKey:code||source};
}
function normalizeHeader(value){
  return String(value??'').replace(/[\s\u3000_\-()（）]/g,'').toLowerCase();
}
function detectWorkbookYear(fileName){
  const western = String(fileName).match(/(?:^|[^\d])((?:19|20)\d{2})(?:[^\d]|$)/);
  if(western) return Number(western[1]);
  const roc = String(fileName).match(/(?:^|[^\d])(\d{3})(?:[^\d]|$)/);
  if(roc && Number(roc[1])>=100 && Number(roc[1])<=199) return Number(roc[1])+1911;
  return null;
}
function daysInMonth(year, month){
  return new Date(Number(year), Number(month), 0).getDate();
}
function formatRidershipValue(value, metric){
  if(value===null || value===undefined || Number.isNaN(Number(value))) return '—';
  return `${Math.round(Number(value)).toLocaleString()}${metric==='averageDaily'?' 人次/日':' 人次'}`;
}
function stationDisplay(row){
  return `${row.station}${row.code?`（${row.lineName}・${row.code}）`:''}`;
}
function stationShortDisplay(row){return `${row.station||''}${row.code?`（${row.code}）`:''}`;}
function stationCodeParts(row){
  const code=String(row?.code||'').toUpperCase(),match=code.match(/^(BR|BL|R|G|O)(\d+)([A-Z]?)$/),lineOrder={BR:1,R:2,G:3,O:4,BL:5};
  return match?[lineOrder[match[1]]||99,Number(match[2]),match[3]||'',code]:[99,999,'',code];
}
function compareStationsByCode(a,b){const aa=stationCodeParts(a),bb=stationCodeParts(b);return aa[0]-bb[0]||aa[1]-bb[1]||aa[2].localeCompare(bb[2])||aa[3].localeCompare(bb[3]);}
function formatRidershipKpi(value){return value===null||value===undefined||Number.isNaN(Number(value))?'—':`${Math.round(Number(value)).toLocaleString()}<small class="ridership-unit">人次/日</small>`;}
function monthlyRidershipRecords(){
  return cache.ridership.filter(r=>r.recordType==='monthlyAverage' && r.year && r.month && Number(r.averageDaily)>0 && ['BR','R','G','O','BL'].includes(r.lineCode));
}
function makeLineChart(current, previous, metric, selectedMonth=0){
  const compact=window.innerWidth<600,width=compact?390:Math.max(760,Math.min(window.innerWidth-320,1440)),height=compact?260:292,left=compact?64:76,right=compact?10:18,top=20,bottom=40;
  const values=[...current,...previous].filter(v=>Number.isFinite(v));
  if(!values.length) return '<div class="empty" style="padding:55px 10px;">尚無可繪製資料</div>';
  const dataMax=Math.max(...values,1),rawStep=dataMax/5,magnitude=10**Math.floor(Math.log10(rawStep)),normalized=rawStep/magnitude,niceFactor=[1,2,2.5,3,5,10].find(n=>n>=normalized)||10,step=niceFactor*magnitude,axisMax=Math.ceil(dataMax/step)*step,tickCount=Math.round(axisMax/step),plotWidth=width-left-right,monthWidth=plotWidth/12;
  const x=i=>left+(i+.5)*monthWidth;
  const y=v=>top+(axisMax-v)*(height-top-bottom)/axisMax;
  const path=arr=>{
    let d='',started=false;
    arr.forEach((v,i)=>{
      if(!Number.isFinite(v)){started=false;return;}
      d+=`${started?' L':'M'} ${x(i).toFixed(1)} ${y(v).toFixed(1)}`;started=true;
    });
    return d;
  };
  let grid='',labels='';
  for(let i=0;i<=tickCount;i++){
    const val=i*step,gy=y(val);
    grid+=`<line x1="${left}" y1="${gy}" x2="${width-right}" y2="${gy}" stroke="#e5e8ef" stroke-width="1"/>`;
    labels+=`<text x="${left-10}" y="${gy+5}" text-anchor="end" font-size="${compact?14:12}" font-weight="650" fill="#566579">${Math.round(val).toLocaleString()}</text>`;
  }
  MONTH_LABELS.forEach((m,i)=>labels+=`<text x="${x(i)}" y="${height-12}" text-anchor="middle" font-size="${compact?13:11}" font-weight="650" fill="#566579">${m.replace('月','')}</text>`);
  const selectedMark=selectedMonth>=1&&selectedMonth<=12?`<rect x="${x(selectedMonth-1)-monthWidth*.4}" y="${top-5}" width="${monthWidth*.8}" height="${height-top-bottom+10}" rx="7" fill="#fff8d8" stroke="#e2b900" stroke-width="2"/>`:'';
  const barWidth=monthWidth*(compact?.5:.46),previousBars=previous.map((v,i)=>Number.isFinite(v)?`<rect x="${x(i)-barWidth/2}" y="${y(v)}" width="${barWidth}" height="${Math.max(1,height-bottom-y(v))}" rx="4" fill="#d9dee7"><title>${MONTH_LABELS[i]} 去年 ${formatRidershipValue(v,metric)}</title></rect>`:'').join('');
  const monthHits=MONTH_LABELS.map((m,i)=>`<rect class="chart-month-hit" data-chart-month="${i+1}" x="${left+i*monthWidth}" y="${top}" width="${monthWidth}" height="${height-top-bottom}" tabindex="0" role="button" aria-label="查看${m}明細"><title>查看${m}明細</title></rect>`).join('');
  return `<div class="chart-wrap"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="每月運量趨勢圖；點選月份可查看明細">
    ${selectedMark}${grid}${labels}
    ${previousBars}
    <path d="${path(current)}" fill="none" stroke="#1677ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${current.map((v,i)=>Number.isFinite(v)?`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#1467b8"><title>${MONTH_LABELS[i]} ${formatRidershipValue(v,metric)}</title></circle>`:'').join('')}
    ${monthHits}
  </svg></div>`;
}
function makeYoyChart(current, previous){
  const changes=current.map((v,i)=>Number.isFinite(v)&&Number.isFinite(previous[i])&&previous[i]!==0?(v-previous[i])/previous[i]*100:null);
  if(!changes.some(Number.isFinite)) return '<div class="empty" style="padding:38px 10px;">尚無前一年度資料可比較</div>';
  const width=760,height=190,left=42,right=18,top=14,bottom=34,maxAbs=Math.max(10,...changes.filter(Number.isFinite).map(Math.abs));
  const zero=(height-bottom+top)/2, barW=(width-left-right)/12*.58;
  const bars=changes.map((v,i)=>{
    if(!Number.isFinite(v)) return '';
    const h=Math.abs(v)/maxAbs*(height-top-bottom)/2;

async function importRidershipWorkbook(file){
  if(typeof XLSX==='undefined') throw new Error('Excel 解析元件未載入，請確認程式檔與必要元件完整後重新開啟。');
  const guessedYear=detectWorkbookYear(file.name);
  const input=prompt('請確認資料年度（西元年）', guessedYear||new Date().getFullYear());
  if(input===null) return;
  const year=Number(input);
  if(!Number.isInteger(year)||year<2000||year>2200) throw new Error('年度格式錯誤，請輸入例如 2025。');
  const workbook=XLSX.read(await readFileAsArrayBuffer(file),{type:'array',cellDates:false});
  const accepted=workbook.SheetNames.filter(n=>/^(0[1-9]|1[0-2])$/.test(n));
  const ignored=workbook.SheetNames.filter(n=>!accepted.includes(n));
  const missing=Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0')).filter(n=>!accepted.includes(n));
  const rows=[], warnings=[];let excludedY=0,unknownCode=0;
  accepted.forEach(month=>{
    const grid=XLSX.utils.sheet_to_json(workbook.Sheets[month],{header:1,defval:null,raw:true});
    let headerRow=-1, stationCol=-1, averageCol=-1;
    for(let r=0;r<Math.min(grid.length,15);r++){
      const normalized=(grid[r]||[]).map(normalizeHeader);
      const s=normalized.findIndex(h=>h.includes('車站名稱')||h==='站名'||h==='車站');
      const a=normalized.findIndex(h=>h.includes('平均日運量')||h.includes('日平均運量')||h.includes('平均每日運量'));
      if(s>=0&&a>=0){headerRow=r;stationCol=s;averageCol=a;break;}
    }
    if(headerRow<0){warnings.push(`${month}：找不到「車站名稱／平均日運量」欄位`);return;}
    for(let r=headerRow+1;r<grid.length;r++){
      const rawStation=grid[r]?.[stationCol];
      const rawAverage=grid[r]?.[averageCol];
      if(rawStation===null||String(rawStation).trim()==='') continue;
      const average=Number(String(rawAverage??'').replace(/,/g,'').trim());
      if(!Number.isFinite(average)||average<=0) continue;
      const parsed=parseRidershipStation(rawStation);
      if(parsed.lineCode==='Y'){excludedY++;continue;}
      if(!['BR','R','G','O','BL'].includes(parsed.lineCode)){unknownCode++;warnings.push(`${month} 第${r+1}列：無法識別公司權管路線代號`);continue;}
      const days=daysInMonth(year,Number(month));
      rows.push({
        recordType:'monthlyAverage', year, month, ...parsed,
        averageDaily:average, days, estimatedMonthly:average*days,
        sourceFile:file.name, importedAt:new Date().toISOString(),
        importKey:`${year}-${month}-${parsed.stationKey}`
      });
    }
  });
  if(!rows.length) throw new Error('12個月份分頁中沒有找到可匯入的運量資料。');
  const summary=`檔案：${file.name}\n年度：${year}\n讀取月份：${accepted.join('、')||'無'}\n忽略分頁：${ignored.join('、')||'無'}\n缺少月份：${missing.join('、')||'無'}\n可匯入：${rows.length.toLocaleString()} 筆\n排除環狀線：${excludedY} 筆\n無法識別代號：${unknownCode} 筆\n警告：${warnings.length} 項`;
  if(!confirm(`${summary}\n\n確定寫入本機資料庫嗎？相同年度、月份及工程代號將更新原資料。`)) return;
  const existing=new Map(monthlyRidershipRecords().map(r=>[r.importKey||`${r.year}-${r.month}-${r.stationKey||r.code||r.station}`,r]));
  let added=0,updated=0;
  for(const row of rows){
    const old=existing.get(row.importKey);
    if(old){await dbPut('ridership',{...old,...row,id:old.id});updated++;}
    else{await dbAdd('ridership',row);added++;}
  }
  lastRidershipImportReport=`成功匯入 ${year} 年：新增 ${added.toLocaleString()} 筆、更新 ${updated.toLocaleString()} 筆；排除環狀線 ${excludedY} 筆。${unknownCode?` 無法識別代號 ${unknownCode} 筆。`:''}${ignored.length?` 已忽略 ${ignored.length} 個非月份分頁。`:''}${missing.length?` 缺少 ${missing.join('、')} 月。`:''}`;
  await reloadCache();
  ridershipView.year=String(year);
  ridershipView.rankMonth='';
  renderRidership();
}

function renderRidership(){
  if(ridershipView.section==='manage')return renderRidershipLegacy();
  const records=monthlyRidershipRecords();
  const years=[...new Set(records.map(r=>Number(r.year)))].sort((a,b)=>b-a);
  if(!ridershipView.year&&years.length)ridershipView.year=String(years[0]);
  const year=Number(ridershipView.year||years[0]||new Date().getFullYear());
  const availableMonths=[...new Set(records.filter(r=>Number(r.year)===year).map(r=>Number(r.month)).filter(m=>m>=1&&m<=12))].sort((a,b)=>a-b);
  const latestMonth=availableMonths.at(-1)||1;
  if(!ridershipView.rankMonth||Number(ridershipView.rankMonth)<1||Number(ridershipView.rankMonth)>12)ridershipView.rankMonth=String(latestMonth).padStart(2,'0');
  const chosenMonth=Number(ridershipView.rankMonth),chosenIndex=chosenMonth-1;
  const stationScope=ridershipView.rankScope||'all';
  const stationMap=new Map();
  records.forEach(r=>{const key=r.stationKey||r.code||r.station;if(!stationMap.has(key))stationMap.set(key,r);});
  const stations=[...stationMap.entries()].filter(([,r])=>stationScope==='all'||r.lineCode===stationScope).sort((a,b)=>compareStationsByCode(a[1],b[1]));
  if(!ridershipView.stationKey||!stations.some(([key])=>key===ridershipView.stationKey))ridershipView.stationKey=stations[0]?.[0]||'';
  const stationKey=ridershipView.stationKey,selected=stationMap.get(stationKey),metric='averageDaily';
  const current=Array(12).fill(null),previous=Array(12).fill(null);
  records.filter(r=>(r.stationKey||r.code||r.station)===stationKey).forEach(r=>{const idx=Number(r.month)-1,value=Number(r.averageDaily);if(Number(r.year)===year)current[idx]=value;if(Number(r.year)===year-1)previous[idx]=value;});
  const chosen=current[chosenIndex],prior=chosenIndex>0?current[chosenIndex-1]:null,previousSame=previous[chosenIndex];
  const mom=Number.isFinite(chosen)&&Number.isFinite(prior)&&prior>0?(chosen-prior)/prior*100:null;
  const yoy=Number.isFinite(chosen)&&Number.isFinite(previousSame)&&previousSame>0?(chosen-previousSame)/previousSame*100:null;
  const scopeRows=records.filter(r=>Number(r.year)===year&&Number(r.month)===chosenMonth&&(stationScope==='all'||r.lineCode===stationScope));
  const ranked=rankRows(scopeRows,metric),rankIndex=ranked.findIndex(r=>(r.stationKey||r.code||r.station)===stationKey),selectedRank=rankIndex>=0?rankIndex+1:0,top=ranked.slice(0,10),bottom=ranked.length>10?ranked.slice(-10):[];
  const yearOptions=years.map(y=>`<option value="${y}" ${y===year?'selected':''}>${y} 年</option>`).join('');
  const scopeOptions=[['all','全線'],['BR','文湖線'],['R','淡水信義線'],['G','松山新店線'],['O','中和新蘆線'],['BL','板南線']].map(([code,label])=>`<option value="${code}" ${stationScope===code?'selected':''}>${label}</option>`).join('');
  const stationOptions=stations.map(([key,r])=>`<option value="${escapeHtml(key)}" ${key===stationKey?'selected':''}>${escapeHtml(r.station)}（${escapeHtml(r.code)}）</option>`).join('');
  const monthOptions=MONTH_LABELS.map((label,i)=>`<option value="${String(i+1).padStart(2,'0')}" ${i+1===chosenMonth?'selected':''}>${label}${availableMonths.includes(i+1)?'':'（今年尚無資料）'}</option>`).join('');
  const detail=ridershipView.detailSection||'trend';
  const detailTabs=`<div class="page-tabs" style="width:100%;display:grid;grid-template-columns:repeat(4,1fr);margin-top:12px"><button class="page-tab ${detail==='trend'?'active':''}" data-ridership-detail="trend">趨勢</button><button class="page-tab ${detail==='monthly'?'active':''}" data-ridership-detail="monthly">明細</button><button class="page-tab ${detail==='ranking'?'active':''}" data-ridership-detail="ranking">排名</button><button class="page-tab ${detail==='events'?'active':''}" data-ridership-detail="events">活動</button></div>`;
  let body='';
  if(!records.length){
    body='<div class="panel empty"><p>尚無年度運量資料</p><p class="muted">請至資料管理匯入年度 Excel。</p></div>';
  }else if(detail==='trend'){
    body=`<div class="stat-grid"><div class="stat-card"><div class="stat-label">${chosenMonth}月平均日運量</div><div class="stat-value">${formatRidershipKpi(chosen)}</div><div class="stat-note">${selected?escapeHtml(stationShortDisplay(selected)):'—'}</div></div><div class="stat-card"><div class="stat-label">較上月</div><div class="stat-value ${mom===null?'neutral':mom>=0?'positive':'negative'}">${mom===null?'—':`${mom>=0?'+':''}${mom.toFixed(1)}%`}</div><div class="stat-note">${Number.isFinite(chosen)?(mom===null?'尚無可比較資料':'平均日運量變化'):'尚無今年資料'}</div></div><div class="stat-card"><div class="stat-label">較去年同月</div><div class="stat-value ${yoy===null?'neutral':yoy>=0?'positive':'negative'}">${yoy===null?'—':`${yoy>=0?'+':''}${yoy.toFixed(1)}%`}</div><div class="stat-note">${Number.isFinite(chosen)?(yoy===null?'尚無可比較資料':`${year-1}年${chosenMonth}月`):'尚無今年資料'}</div></div><div class="stat-card"><div class="stat-label">${chosenMonth}月排名</div><div class="stat-value">${selectedRank||'—'} / ${stations.length||'—'}</div><div class="stat-note">${stationScope==='all'?'全線':RIDERSHIP_LINES[stationScope]}</div></div></div><div class="panel"><h3 class="panel-title">每月平均日運量趨勢</h3><p class="panel-note">${escapeHtml(stationShortDisplay(selected||{}))}｜本年度資料至${latestMonth}月</p><div class="chart-legend"><span><i class="legend-dot" style="background:#1677ff"></i>${year}（折線）</span><span><i class="legend-dot" style="background:#d9dee7;border-radius:2px"></i>${year-1}（長條）</span><span>點選月份可看明細</span></div>${makeLineChart(current,previous,metric,chosenMonth)}</div>`;
  }else if(detail==='monthly'){
    body=`<div class="panel"><h3 class="panel-title">${year}年每月明細</h3><p class="panel-note">本年度資料至${latestMonth}月；尚未匯入月份仍保留去年資料供查看。</p><div class="data-table-wrap"><table class="data-table"><thead><tr><th>月份</th><th>${year}</th><th>${year-1}</th><th>年增率</th></tr></thead><tbody>${MONTH_LABELS.map((m,i)=>{const hasCurrent=Number.isFinite(current[i]),change=hasCurrent&&Number.isFinite(previous[i])&&previous[i]>0?(current[i]-previous[i])/previous[i]*100:null;return `<tr class="${i+1===chosenMonth?'selected-month-row':''}"><td>${m}</td><td>${hasCurrent?Math.round(current[i]).toLocaleString():'—'}</td><td>${Number.isFinite(previous[i])?Math.round(previous[i]).toLocaleString():'—'}</td><td class="${change===null?'neutral':change>=0?'positive':'negative'}">${change===null?'—':`${change>=0?'+':''}${change.toFixed(1)}%`}</td></tr>`;}).join('')}</tbody></table></div></div>`;

    const rankListHtml=rankItems.length?`<ol class="rank-list">${rankItems.map(r=>{const key=r.stationKey||r.code||r.station;return `<li class="rank-item ${key===stationKey?'selected-rank-item':''}"><span class="rank-no">${ranked.indexOf(r)+1}</span><div><div class="rank-station">${escapeHtml(stationShortDisplay(r))}</div></div><div class="rank-value">${formatRidershipValue(r.averageDaily,metric)}</div></li>`;}).join('')}</ol>`:`<div class="empty" style="padding:30px">${ranked.length?'資料未超過10筆':'該月尚無排名資料'}</div>`;
    body=`<div class="panel"><h3 class="panel-title">${chosenMonth}月車站排名</h3><p class="panel-note">選定車站：${selectedRank||'—'} / ${stations.length||'—'}｜${stationScope==='all'?'全線':RIDERSHIP_LINES[stationScope]}</p><div class="rank-band-tabs"><button class="${rankBand==='top'?'active':''}" data-rank-band="top">前10名</button><button class="${rankBand==='bottom'?'active':''}" data-rank-band="bottom">後10名</button></div>${rankListHtml}</div>`;

  }
  contentEl.innerHTML=`<div class="page-tabs"><button class="page-tab active" data-ridership-section="query">運量查詢</button><button class="page-tab" data-ridership-section="manage">資料管理</button></div><div class="panel"><div class="ridership-filter-grid"><div class="field" style="margin:0"><label>年度</label><select id="ridership-year">${yearOptions||`<option value="${year}">${year} 年</option>`}</select></div><div class="field" style="margin:0"><label>範圍</label><select id="ridership-scope">${scopeOptions}</select></div><div class="field" style="margin:0"><label>車站</label><select id="ridership-station">${stationOptions||'<option value="">尚無資料</option>'}</select></div><div class="field" style="margin:0"><label>月份</label><select id="ridership-rank-month">${monthOptions||'<option value="">尚無資料</option>'}</select></div></div>${detailTabs}</div>${body}`;

/* --- Data management (export/import) --- */
function bufToBase64(buf){
  let binary=''; const bytes = new Uint8Array(buf);
  const chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    binary += String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
  }
  return btoa(binary);
}
function base64ToBuf(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return bytes.buffer;
}
async function exportData(){
  const dump = {};
  for(const name of STORES){
    const rows = await dbGetAll(name);
    dump[name] = rows.map(r=>{
      if(name==='pdfFiles') return {...r, data: bufToBase64(r.data)};
      return r;
    });
  }
  dump._localData={ridershipEvents:ridershipEvents()};
  const blob = new Blob([JSON.stringify(dump)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `station-assistant-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
  localStorage.setItem('stationAssistantLastBackup',new Date().toLocaleString('zh-TW'));
}
async function importData(file){
  const text = await file.text();
  const dump = JSON.parse(text);
  for(const name of STORES){
    if(!dump[name]) continue;
    for(const row of dump[name]){
      const copy = {...row};
      delete copy.id;
      if(name==='pdfFiles') copy.data = base64ToBuf(copy.data);
      await dbAdd(name, copy);
    }
  }
  if(Array.isArray(dump._localData?.ridershipEvents))saveRidershipEvents(dump._localData.ridershipEvents);
  await reloadCache();
  render();
}

  const html = `<div class="modal-overlay" id="dm-overlay"><div class="modal-sheet" style="height:auto;">
    <div class="modal-header"><span style="font-weight:500;">資料管理</span>
      <button id="dm-close" style="background:none;border:none;font-size:18px;">✕</button></div>

      <button class="primary" id="dm-transfer-export" style="width:100%;margin-bottom:10px;">匯出常用程序與通告</button>
      <button class="secondary" id="dm-transfer-import" style="width:100%;margin-bottom:18px;">匯入常用程序與通告</button>
      <input type="file" id="dm-transfer-input" accept="application/json,.json" style="display:none">
      <p class="tiny-muted">裝置復原用</p>
      <button class="secondary" id="dm-export" style="width:100%;margin-bottom:10px;">匯出完整資料備份</button>
      <button class="secondary" id="dm-import" style="width:100%;">匯入完整資料備份</button>
      <input type="file" id="dm-import-input" accept="application/json" style="display:none">
    </div>
  </div></div>`;
  contentEl.insertAdjacentHTML('beforeend', html);
  document.getElementById('dm-close').addEventListener('click', ()=>document.getElementById('dm-overlay').remove());
  document.getElementById('dm-transfer-export').addEventListener('click', exportProcedures);
  document.getElementById('dm-transfer-import').addEventListener('click', ()=>document.getElementById('dm-transfer-input').click());
  document.getElementById('dm-transfer-input').addEventListener('change', async e=>{const file=e.target.files?.[0];if(file)await importProceduresFile(file);e.target.value='';});
  document.getElementById('dm-export').addEventListener('click', exportData);
  document.getElementById('dm-import').addEventListener('click', ()=>document.getElementById('dm-import-input').click());
  document.getElementById('dm-import-input').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(confirm('匯入的資料會加進目前資料庫（不會清除既有資料），確定匯入嗎？')){
      await importData(file);
      document.getElementById('dm-overlay').remove();
    }
  });
}
