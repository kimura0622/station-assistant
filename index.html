/* --- Ridership tab --- */
const RIDERSHIP_LINES = {
  BR:'文湖線', R:'淡水信義線', G:'松山新店線',
  O:'中和新蘆線', BL:'板南線', Y:'環狀線'
};
const MONTH_LABELS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
function parseRidershipStation(raw){
  const source = String(raw||'').replace(/\s+/g,' ').trim();
  const match = source.match(/^(.*?)\s*[（(]\s*((?:BR|BL|R|G|O|Y)\s*\d*)\s*[)）]\s*$/i);
  if(!match) return {station:source, code:'', lineCode:'', lineName:'未識別線別', stationKey:source};
  const station = match[1].trim();
  const code = match[2].replace(/\s+/g,'').toUpperCase();
  const prefix = (code.match(/^(BR|BL|R|G|O|Y)/)||[])[1] || '';
  return {station, code, lineCode:prefix, lineName:RIDERSHIP_LINES[prefix]||'未識別線別', stationKey:code||source};
}
function normalizeHeader(value){
  return String(value??'').replace(/[\s\u3000_\-()（）]/g,'').toLowerCase();
}
function detectWorkbookYear(fileName){
  const western = String(fileName).match(/(?:^|[^\d])((?:19|20)\d{2})(?:[^\d]|$)/);
  if(western) return Number(western[1]);
  const roc = String(fileName).match(/(?:^|[^\d])(\d{3})(?:[^\d]|$)/);
  if(roc && Number(roc[1])>=100 && Number(roc[1])<=199) return Number(roc[1])+1911;
  return null;
}
function daysInMonth(year, month){
  return new Date(Number(year), Number(month), 0).getDate();
}
function formatRidershipValue(value, metric){
  if(value===null || value===undefined || Number.isNaN(Number(value))) return '—';
  return `${Math.round(Number(value)).toLocaleString()}${metric==='averageDaily'?' 人次/日':' 人次'}`;
}
function stationDisplay(row){
  return `${row.station}${row.code?`（${row.lineName}・${row.code}）`:''}`;
}
function monthlyRidershipRecords(){
  return cache.ridership.filter(r=>r.recordType==='monthlyAverage' && r.year && r.month);
}
function makeLineChart(current, previous, metric){
  const width=760,height=265,left=56,right=18,top=18,bottom=38;
  const values=[...current,...previous].filter(v=>Number.isFinite(v));
  if(!values.length) return '<div class="empty" style="padding:55px 10px;">尚無可繪製資料</div>';
  const max=Math.max(...values,1), min=Math.min(...values,0);
  const x=i=>left+i*(width-left-right)/11;
  const y=v=>top+(max-v)*(height-top-bottom)/(max-min||1);
  const path=arr=>{
    let d='',started=false;
    arr.forEach((v,i)=>{
      if(!Number.isFinite(v)){started=false;return;}
      d+=`${started?' L':'M'} ${x(i).toFixed(1)} ${y(v).toFixed(1)}`;started=true;
    });
    return d;
  };
  let grid='',labels='';
  for(let i=0;i<=4;i++){
    const gy=top+i*(height-top-bottom)/4;
    const val=max-i*(max-min)/4;
    grid+=`<line x1="${left}" y1="${gy}" x2="${width-right}" y2="${gy}" stroke="#e5e8ef" stroke-width="1"/>`;
    labels+=`<text x="${left-8}" y="${gy+4}" text-anchor="end" font-size="10" fill="#8e8e93">${Math.round(val).toLocaleString()}</text>`;
  }
  MONTH_LABELS.forEach((m,i)=>labels+=`<text x="${x(i)}" y="${height-12}" text-anchor="middle" font-size="10" fill="#8e8e93">${m.replace('月','')}</text>`);
  return `<div class="chart-wrap"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="年度每月運量折線圖">
    ${grid}${labels}
    <path d="${path(previous)}" fill="none" stroke="#9aa3af" stroke-width="2.5" stroke-dasharray="7 6"/>
    <path d="${path(current)}" fill="none" stroke="#1677ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${current.map((v,i)=>Number.isFinite(v)?`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#1677ff"><title>${MONTH_LABELS[i]} ${formatRidershipValue(v,metric)}</title></circle>`:'').join('')}
  </svg></div>`;
}
function makeYoyChart(current, previous){
  const changes=current.map((v,i)=>Number.isFinite(v)&&Number.isFinite(previous[i])&&previous[i]!==0?(v-previous[i])/previous[i]*100:null);
  if(!changes.some(Number.isFinite)) return '<div class="empty" style="padding:38px 10px;">尚無前一年度資料可比較</div>';
  const width=760,height=190,left=42,right=18,top=14,bottom=34,maxAbs=Math.max(10,...changes.filter(Number.isFinite).map(Math.abs));
  const zero=(height-bottom+top)/2, barW=(width-left-right)/12*.58;
  const bars=changes.map((v,i)=>{
    if(!Number.isFinite(v)) return '';
    const h=Math.abs(v)/maxAbs*(height-top-bottom)/2;
    const yy=v>=0?zero-h:zero;
    const color=v>=0?'#34a853':'#df4b3f';
    return `<rect x="${left+i*(width-left-right)/12+((width-left-right)/12-barW)/2}" y="${yy}" width="${barW}" height="${Math.max(1,h)}" rx="3" fill="${color}"><title>${MONTH_LABELS[i]} ${v>=0?'+':''}${v.toFixed(1)}%</title></rect>
      <text x="${left+(i+.5)*(width-left-right)/12}" y="${height-12}" text-anchor="middle" font-size="10" fill="#8e8e93">${i+1}</text>`;
  }).join('');
  return `<div class="chart-wrap"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="年增率長條圖">
    <line x1="${left}" y1="${zero}" x2="${width-right}" y2="${zero}" stroke="#b8c0cc"/>
    ${bars}
  </svg></div>`;
}
function rankRows(records, metric){
  return [...records].filter(r=>Number.isFinite(Number(r[metric]))).sort((a,b)=>Number(b[metric])-Number(a[metric]));
}
async function importRidershipWorkbook(file){
  if(typeof XLSX==='undefined') throw new Error('Excel 解析元件未載入，請確認電腦可連線至 cdnjs.cloudflare.com 後重新開啟程式。');
  const guessedYear=detectWorkbookYear(file.name);
  const input=prompt('請確認資料年度（西元年）', guessedYear||new Date().getFullYear());
  if(input===null) return;
  const year=Number(input);
  if(!Number.isInteger(year)||year<2000||year>2200) throw new Error('年度格式錯誤，請輸入例如 2025。');
  const workbook=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:false});
  const accepted=workbook.SheetNames.filter(n=>/^(0[1-9]|1[0-2])$/.test(n));
  const ignored=workbook.SheetNames.filter(n=>!accepted.includes(n));
  const missing=Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0')).filter(n=>!accepted.includes(n));
  const rows=[], warnings=[];
  accepted.forEach(month=>{
    const grid=XLSX.utils.sheet_to_json(workbook.Sheets[month],{header:1,defval:null,raw:true});
    let headerRow=-1, stationCol=-1, averageCol=-1;
    for(let r=0;r<Math.min(grid.length,15);r++){
      const normalized=(grid[r]||[]).map(normalizeHeader);
      const s=normalized.findIndex(h=>h.includes('車站名稱')||h==='站名'||h==='車站');
      const a=normalized.findIndex(h=>h.includes('平均日運量')||h.includes('日平均運量')||h.includes('平均每日運量'));
      if(s>=0&&a>=0){headerRow=r;stationCol=s;averageCol=a;break;}
    }
    if(headerRow<0){warnings.push(`${month}：找不到「車站名稱／平均日運量」欄位`);return;}
    for(let r=headerRow+1;r<grid.length;r++){
      const rawStation=grid[r]?.[stationCol];
      const rawAverage=grid[r]?.[averageCol];
      if(rawStation===null||String(rawStation).trim()==='') continue;
      const average=Number(String(rawAverage??'').replace(/,/g,'').trim());
      if(!Number.isFinite(average)){warnings.push(`${month} 第${r+1}列：平均日運量不是數字`);continue;}
      const parsed=parseRidershipStation(rawStation);
      const days=daysInMonth(year,Number(month));
      rows.push({
        recordType:'monthlyAverage', year, month, ...parsed,
        averageDaily:average, days, estimatedMonthly:average*days,
        sourceFile:file.name, importedAt:new Date().toISOString(),
        importKey:`${year}-${month}-${parsed.stationKey}`
      });
    }
  });
  if(!rows.length) throw new Error('12個月份分頁中沒有找到可匯入的運量資料。');
  const summary=`檔案：${file.name}\n年度：${year}\n讀取月份：${accepted.join('、')||'無'}\n忽略分頁：${ignored.join('、')||'無'}\n缺少月份：${missing.join('、')||'無'}\n可匯入：${rows.length.toLocaleString()} 筆\n警告：${warnings.length} 項`;
  if(!confirm(`${summary}\n\n確定寫入本機資料庫嗎？相同年度、月份及工程代號將更新原資料。`)) return;
  const existing=new Map(monthlyRidershipRecords().map(r=>[r.importKey||`${r.year}-${r.month}-${r.stationKey||r.code||r.station}`,r]));
  let added=0,updated=0;
  for(const row of rows){
    const old=existing.get(row.importKey);
    if(old){await dbPut('ridership',{...old,...row,id:old.id});updated++;}
    else{await dbAdd('ridership',row);added++;}
  }
  lastRidershipImportReport=`成功匯入 ${year} 年：新增 ${added.toLocaleString()} 筆、更新 ${updated.toLocaleString()} 筆。${ignored.length?` 已忽略 ${ignored.length} 個非月份分頁。`:''}${missing.length?` 缺少 ${missing.join('、')} 月。`:''}`;
  await reloadCache();
  ridershipView.year=String(year);
  renderRidership();
}
function renderRidership(){
  const records=monthlyRidershipRecords();
  const years=[...new Set(records.map(r=>Number(r.year)))].sort((a,b)=>b-a);
  if(!ridershipView.year&&years.length) ridershipView.year=String(years[0]);
  const year=Number(ridershipView.year||years[0]||new Date().getFullYear());
  const stationMap=new Map();
  records.forEach(r=>{
    const key=r.stationKey||r.code||r.station;
    if(!stationMap.has(key)) stationMap.set(key,r);
  });
  const stations=[...stationMap.entries()].sort((a,b)=>stationDisplay(a[1]).localeCompare(stationDisplay(b[1]),'zh-Hant'));
  if(!ridershipView.stationKey&&stations.length) ridershipView.stationKey=stations[0][0];
  if(ridershipView.stationKey&&!stationMap.has(ridershipView.stationKey)&&stations.length) ridershipView.stationKey=stations[0][0];
  const metric=ridershipView.metric;
  const stationKey=ridershipView.stationKey;
  const selected=stationMap.get(stationKey);
  const current=Array(12).fill(null),previous=Array(12).fill(null);
  records.filter(r=>(r.stationKey||r.code||r.station)===stationKey).forEach(r=>{
    const idx=Number(r.month)-1;
    if(Number(r.year)===year) current[idx]=Number(r[metric]);
    if(Number(r.year)===year-1) previous[idx]=Number(r[metric]);
  });
  const currentTotal=current.filter(Number.isFinite).reduce((a,b)=>a+b,0);
  const validMonths=current.filter(Number.isFinite).length;
  const comparableMonths=current.map((v,i)=>Number.isFinite(v)&&Number.isFinite(previous[i])?i:-1).filter(i=>i>=0);
  const currentComparable=comparableMonths.reduce((sum,i)=>sum+current[i],0);
  const previousComparable=comparableMonths.reduce((sum,i)=>sum+previous[i],0);
  const currentKpi=metric==='averageDaily'&&validMonths?currentTotal/validMonths:currentTotal;
  const yoy=previousComparable?((currentComparable-previousComparable)/previousComparable*100):null;
  const currentYearMonth=records.filter(r=>Number(r.year)===year&&r.month===ridershipView.rankMonth);
  const ranked=rankRows(currentYearMonth,metric);
  const selectedRank=ranked.findIndex(r=>(r.stationKey||r.code||r.station)===stationKey)+1;
  const top=ranked.slice(0,10), bottom=ranked.length>10?ranked.slice(-10).reverse():[];
  const yearOptions=years.map(y=>`<option value="${y}" ${y===year?'selected':''}>${y} 年</option>`).join('');
  const stationOptions=stations.map(([key,r])=>`<option value="${escapeHtml(key)}" ${key===stationKey?'selected':''}>${escapeHtml(stationDisplay(r))}</option>`).join('');
  const rankList=(list,emptyText)=>list.length?`<ol class="rank-list">${list.map((r,i)=>{
    const actualRank=ranked.indexOf(r)+1;
    return `<li class="rank-item"><span class="rank-no">${actualRank}</span><div><div class="rank-station">${escapeHtml(r.station)}${r.code?` (${escapeHtml(r.code)})`:''}</div><div class="rank-line">${escapeHtml(r.lineName||'未識別線別')}</div></div><div class="rank-value">${formatRidershipValue(r[metric],metric)}</div></li>`;
  }).join('')}</ol>`:`<div class="empty" style="padding:30px 10px;">${emptyText}</div>`;
  let html=`<div class="card toolbar-card">
      <div><h2 class="section-title">車站運量分析</h2><p class="section-subtitle">Excel 在本機解析；只讀取 01–12 月分頁，其他分頁自動忽略。</p></div>
      <div class="toolbar-actions">
        <button class="primary" id="ridership-import-btn">匯入年度 Excel</button>
        <button class="secondary" id="ridership-delete-year-btn" ${years.length?'':'disabled'}>刪除本年度資料</button>
        <input id="ridership-file-input" type="file" accept=".xlsx,.xls" style="display:none">
      </div>
    </div>
    ${lastRidershipImportReport?`<div class="import-report">${escapeHtml(lastRidershipImportReport)}</div>`:''}
    <div class="panel">
      <div class="filter-grid">
        <div class="field" style="margin:0"><label>分析年度</label><select id="ridership-year">${yearOptions||`<option value="${year}">${year} 年</option>`}</select></div>
        <div class="field" style="margin:0"><label>車站（交會站依工程代號分開）</label><select id="ridership-station">${stationOptions||'<option value="">尚無資料</option>'}</select></div>
        <div class="field" style="margin:0"><label>排名月份</label><select id="ridership-rank-month">${MONTH_LABELS.map((m,i)=>`<option value="${String(i+1).padStart(2,'0')}" ${ridershipView.rankMonth===String(i+1).padStart(2,'0')?'selected':''}>${m}</option>`).join('')}</select></div>
        <div class="segmented" aria-label="運量指標">
          <button data-metric="averageDaily" class="${metric==='averageDaily'?'active':''}">平均日運量</button>
          <button data-metric="estimatedMonthly" class="${metric==='estimatedMonthly'?'active':''}">推估月運量</button>
        </div>
      </div>
    </div>`;
  if(!records.length){
    html+=`<div class="panel empty"><div class="icon">📈</div><p>尚無年度運量資料</p><p class="muted">請匯入含 01–12 分頁的 Excel 檔開始分析。</p></div>`;
  }else{
    html+=`<div class="stat-grid">
      <div class="stat-card"><div class="stat-label">${year} 年資料月份</div><div class="stat-value">${validMonths}<small style="font-size:13px;color:var(--text-2)"> / 12</small></div><div class="stat-note">${selected?escapeHtml(stationDisplay(selected)):'—'}</div></div>
      <div class="stat-card"><div class="stat-label">${metric==='averageDaily'?'月平均之平均':'年度推估總運量'}</div><div class="stat-value">${formatRidershipValue(currentKpi,metric)}</div><div class="stat-note">僅計入已有資料月份</div></div>
      <div class="stat-card"><div class="stat-label">較 ${year-1} 年</div><div class="stat-value ${yoy===null?'neutral':yoy>=0?'positive':'negative'}">${yoy===null?'—':`${yoy>=0?'+':''}${yoy.toFixed(1)}%`}</div><div class="stat-note">${comparableMonths.length?`以 ${comparableMonths.length} 個相同月份比較`:'缺少前一年可比資料'}</div></div>
      <div class="stat-card"><div class="stat-label">${Number(ridershipView.rankMonth)} 月排名</div><div class="stat-value">${selectedRank?`第 ${selectedRank} 名`:'—'}</div><div class="stat-note">${ranked.length?`共 ${ranked.length} 個站點代號`:'該月尚無資料'}</div></div>
    </div>
    <div class="analysis-grid">
      <div>
        <div class="panel"><h3 class="panel-title">每月運量趨勢</h3><p class="panel-note">${escapeHtml(stationDisplay(selected||{}))}｜${metric==='averageDaily'?'平均日運量':'推估月運量'}</p>
          <div class="chart-legend"><span><i class="legend-dot" style="background:#1677ff"></i>${year}</span><span><i class="legend-dot" style="background:#9aa3af"></i>${year-1}（虛線）</span></div>
          ${makeLineChart(current,previous,metric)}
        </div>
        <div class="panel"><h3 class="panel-title">較前一年變化</h3><p class="panel-note">綠色為增加，紅色為減少；滑鼠停留可查看精確百分比。</p>${makeYoyChart(current,previous)}</div>
      </div>
      <div class="panel"><h3 class="panel-title">${year} 年每月明細</h3><p class="panel-note">缺少資料顯示「—」，不會當作 0。</p>
        <div class="data-table-wrap"><table class="data-table"><thead><tr><th>月份</th><th>${year}</th><th>${year-1}</th><th>年增率</th></tr></thead><tbody>
          ${MONTH_LABELS.map((m,i)=>{
            const change=Number.isFinite(current[i])&&Number.isFinite(previous[i])&&previous[i]!==0?(current[i]-previous[i])/previous[i]*100:null;
            return `<tr><td>${m}</td><td>${formatRidershipValue(current[i],metric).replace(' 人次/日','').replace(' 人次','')}</td><td>${formatRidershipValue(previous[i],metric).replace(' 人次/日','').replace(' 人次','')}</td><td class="${change===null?'neutral':change>=0?'positive':'negative'}">${change===null?'—':`${change>=0?'+':''}${change.toFixed(1)}%`}</td></tr>`;
          }).join('')}
        </tbody></table></div>
      </div>
    </div>
    <div class="rank-columns">
      <div class="panel"><h3 class="panel-title">${Number(ridershipView.rankMonth)} 月前 10 名</h3><p class="panel-note">交會站各線獨立排名。</p>${rankList(top,'該月尚無資料')}</div>
      <div class="panel"><h3 class="panel-title">${Number(ridershipView.rankMonth)} 月後 10 名</h3><p class="panel-note">灰色中性呈現；真正的 0 仍保留參與排名。</p>${rankList(bottom,ranked.length&&ranked.length<=10?'資料未超過 10 筆':'該月尚無資料')}</div>
    </div>`;
  }
  contentEl.innerHTML=html;
  document.getElementById('ridership-import-btn').addEventListener('click',()=>document.getElementById('ridership-file-input').click());
  document.getElementById('ridership-file-input').addEventListener('change',async e=>{
    const file=e.target.files[0]; if(!file)return;
    try{await importRidershipWorkbook(file);}catch(error){alert(`Excel 匯入失敗：${error.message||error}`);}
  });
  document.getElementById('ridership-year').addEventListener('change',e=>{ridershipView.year=e.target.value;renderRidership();});
  document.getElementById('ridership-station').addEventListener('change',e=>{ridershipView.stationKey=e.target.value;renderRidership();});
  document.getElementById('ridership-rank-month').addEventListener('change',e=>{ridershipView.rankMonth=e.target.value;renderRidership();});
  contentEl.querySelectorAll('[data-metric]').forEach(btn=>btn.addEventListener('click',()=>{ridershipView.metric=btn.dataset.metric;renderRidership();}));
  const deleteBtn=document.getElementById('ridership-delete-year-btn');
  if(deleteBtn) deleteBtn.addEventListener('click',async()=>{
    const targets=monthlyRidershipRecords().filter(r=>Number(r.year)===year);
    if(!targets.length||!confirm(`確定刪除 ${year} 年的 ${targets.length.toLocaleString()} 筆運量資料嗎？此動作無法復原。`))return;
    for(const r of targets) await dbDelete('ridership',r.id);
    await reloadCache();ridershipView.year='';ridershipView.stationKey='';renderRidership();
  });
}

/* --- Data management (export/import) --- */
function bufToBase64(buf){
  let binary=''; const bytes = new Uint8Array(buf);
  const chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    binary += String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
  }
  return btoa(binary);
}
function base64ToBuf(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return bytes.buffer;
}
async function exportData(){
  const dump = {};
  for(const name of STORES){
    const rows = await dbGetAll(name);
    dump[name] = rows.map(r=>{
      if(name==='pdfFiles') return {...r, data: bufToBase64(r.data)};
      return r;
    });
  }
  const blob = new Blob([JSON.stringify(dump)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `station-assistant-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
}
async function importData(file){
  const text = await file.text();
  const dump = JSON.parse(text);
  for(const name of STORES){
    if(!dump[name]) continue;
    for(const row of dump[name]){
      const copy = {...row};
      delete copy.id;
      if(name==='pdfFiles') copy.data = base64ToBuf(copy.data);
      await dbAdd(name, copy);
    }
  }
  await reloadCache();
  render();
}
function openDataMgmt(){
  const html = `<div class="modal-overlay" id="dm-overlay"><div class="modal-sheet" style="height:auto;">
    <div class="modal-header"><span style="font-weight:500;">資料管理</span>
      <button id="dm-close" style="background:none;border:none;font-size:18px;">✕</button></div>
    <div class="modal-body">
      <p class="tiny-muted" style="margin-top:0;">電腦專業版 v1.2・2026.08.04</p>
      <p class="muted">匯出資料後可手動傳到另一台裝置匯入；各裝置資料不會自動同步。</p>
      <button class="primary" id="dm-export" style="width:100%;margin-bottom:10px;">匯出資料備份</button>
      <button class="secondary" id="dm-import" style="width:100%;">匯入資料備份</button>
      <input type="file" id="dm-import-input" accept="application/json" style="display:none">
    </div>
  </div></div>`;
  contentEl.insertAdjacentHTML('beforeend', html);
  document.getElementById('dm-close').addEventListener('click', ()=>document.getElementById('dm-overlay').remove());
  document.getElementById('dm-export').addEventListener('click', exportData);
  document.getElementById('dm-import').addEventListener('click', ()=>document.getElementById('dm-import-input').click());
  document.getElementById('dm-import-input').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(confirm('匯入的資料會加進目前資料庫（不會清除既有資料），確定匯入嗎？')){
      await importData(file);
      document.getElementById('dm-overlay').remove();
    }
  });
}

/* ---------- Init ---------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{ currentTab = btn.dataset.tab; sopKeyword=''; render(); });
});
document.getElementById('data-mgmt-btn').addEventListener('click', openDataMgmt);

(async function init(){
  await openDB();
  await reloadCache();
  render();
})();
</script>
