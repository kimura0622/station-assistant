<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>站務工作助手</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f2f2f7; --card:#ffffff; --border:#e5e5ea; --border-strong:#c7c7cc;
    --text:#1c1c1e; --text-2:#636366; --text-muted:#8e8e93;
    --accent:#007aff; --accent-bg:#eaf4ff; --accent-text:#005bb5;
    --danger:#a32d2d; --danger-bg:#fcebeb;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#d1d1d6;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--text);display:flex;justify-content:center;padding:24px 0;min-height:100vh;}
  #phone{
    width:390px; height:820px; background:var(--bg); border-radius:38px; border:7px solid #1c1c1e;
    box-shadow:0 12px 40px rgba(0,0,0,0.25); overflow:hidden; display:flex; flex-direction:column; position:relative;
  }
  #topbar{
    height:56px; flex-shrink:0; background:rgba(249,249,249,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:0.5px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; padding:0 16px;
  }
  #topbar h1{font-size:17px;font-weight:650;margin:0;}
  #topbar button{background:none;border:none;font-size:20px;color:var(--text-2);cursor:pointer;padding:4px;}
  #content{flex:1; overflow-y:auto; padding:14px;}
  #tabbar{
    height:68px;flex-shrink:0;background:rgba(249,249,249,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:0.5px solid var(--border);
    display:flex; align-items:stretch;
  }
  .desktop-brand,.desktop-version{display:none;}
  .tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:var(--text-muted);font-size:11px;cursor:pointer;}
  .tab-btn.active{color:var(--accent);}
  .tab-btn .icon{font-size:20px;}

  .card{background:var(--card);border:0.5px solid var(--border);border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.035);}
  .row{display:flex;align-items:center;gap:8px;}
  .between{justify-content:space-between;}
  .muted{color:var(--text-2);font-size:12px;}
  .tiny-muted{color:var(--text-muted);font-size:11px;}
  input, select, textarea{
    width:100%;border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 12px;min-height:44px;
    font-size:16px;background:#fff;color:var(--text);font-family:inherit;outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,122,255,.13);}
  textarea{resize:vertical;min-height:70px;}
  label{font-size:12px;color:var(--text-2);display:block;margin-bottom:4px;}
  .field{margin-bottom:10px;}
  button.primary{
    background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:10px 14px;min-height:44px;
    font-size:15px;font-weight:600;cursor:pointer;
  }
  button.secondary{
    background:#fff; color:var(--text); border:0.5px solid var(--border-strong); border-radius:var(--radius);
    padding:9px 14px;min-height:44px;font-size:14px;cursor:pointer;
  }
  button.danger-text{background:none;border:none;color:var(--danger);font-size:13px;cursor:pointer;padding:4px;}
  .chip{font-size:12px;padding:4px 10px;border-radius:999px;border:0.5px solid var(--border-strong);color:var(--text-2);cursor:pointer;white-space:nowrap;}
  .chip.active{background:var(--accent-bg);color:var(--accent-text);border-color:var(--accent-bg);}
  .chips-row{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;}
  .empty{text-align:center;padding:60px 20px;color:var(--text-muted);}
  .empty .icon{font-size:36px;margin-bottom:10px;}
  .highlight{color:var(--accent-text);font-weight:500;}
  .search-summary{margin:2px 0 10px;color:var(--text-2);font-size:12px;}
  .search-doc-title{font-size:13px;font-weight:600;line-height:1.45;flex:1;}
  .search-page-badge{font-size:11px;color:var(--accent-text);background:var(--accent-bg);border-radius:999px;padding:3px 8px;white-space:nowrap;}
  .search-snippet{font-size:13px;line-height:1.7;color:var(--text-2);margin:8px 0 0;padding:8px 10px;background:#f7f6f2;border-radius:8px;border-left:3px solid #b5d4ef;}
  .search-keywords{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 10px;}
  .search-keyword{font-size:11px;color:var(--accent-text);background:var(--accent-bg);border-radius:999px;padding:3px 8px;}
  .search-field{position:relative;margin-bottom:10px;}
  .search-field input{padding-left:38px;padding-right:42px;background:#e9e9ee;border:none;}
  .search-field .search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:15px;pointer-events:none;}
  .search-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:27px;height:27px;min-height:0;padding:0;border:0;border-radius:50%;background:#8e8e93;color:white;font-size:16px;line-height:27px;cursor:pointer;}
  .reader-page{background:#fff;border:0.5px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;}
  .reader-page.current{border:1.5px solid var(--accent);background:#f6fbff;}
  .reader-page-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:var(--text-2);}
  .reader-text{font-size:14px;line-height:1.85;white-space:pre-wrap;word-break:break-word;margin:0;color:var(--text);user-select:text;-webkit-user-select:text;}
  .reader-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
  .sop-block{font-size:14px;line-height:1.8;margin:0 0 10px;padding:0 2px;}
  .sop-block.level-2{font-weight:700;font-size:15px;color:var(--accent-text);padding:9px 10px;background:var(--accent-bg);border-radius:10px;}
  .sop-block.level-3{font-weight:650;padding:9px 10px;background:#f2f2f7;border-radius:10px;border-left:3px solid var(--accent);}
  .sop-block.letter{padding:9px 10px;background:#f7f7f9;border-radius:10px;border-left:3px solid #aeaeb2;}
  .sop-block.subitem{margin-left:12px;padding:7px 9px;background:#fafafa;border-radius:8px;}
  .scenario-tag{display:inline-block;font-size:11px;font-weight:600;color:#854f0b;background:#faeeda;padding:2px 7px;border-radius:999px;margin-right:5px;}
  .reference-chip{display:inline-block;color:#005bb5;background:#eaf4ff;border:0;border-radius:999px;padding:1px 6px;margin:0 2px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;}
  .shortcut-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .shortcut-card{background:#fff;border:0.5px solid var(--border);border-radius:13px;padding:11px;min-height:72px;cursor:pointer;position:relative;}
  .shortcut-title{font-size:13px;font-weight:600;line-height:1.35;margin:0 24px 5px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .shortcut-meta{font-size:11px;color:var(--text-muted);margin:0;}
  .favorite-btn{border:0;background:none;color:var(--accent);font-size:21px;line-height:1;padding:4px;min-height:0;cursor:pointer;flex-shrink:0;}
  .ios-entry{background:#fff;border:.5px solid var(--border);border-radius:14px;min-height:58px;padding:10px 12px;display:flex;align-items:center;gap:11px;cursor:pointer;margin-bottom:12px;}
  .ios-entry-icon{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .ios-entry-main{flex:1;min-width:0;}
  .ios-entry-title{font-size:15px;font-weight:600;margin:0 0 2px;}
  .ios-entry-subtitle{font-size:12px;color:var(--text-muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ios-chevron{font-size:21px;color:#c7c7cc;}
  .procedure-row{background:#fff;border-bottom:.5px solid var(--border);padding:11px 12px;display:flex;align-items:center;gap:10px;min-height:62px;}
  .procedure-row:first-child{border-radius:13px 13px 0 0;}
  .procedure-row:last-child{border-bottom:0;border-radius:0 0 13px 13px;}
  .procedure-list{border:.5px solid var(--border);border-radius:13px;overflow:hidden;margin-bottom:14px;}
  .procedure-actions{display:flex;gap:4px;flex-shrink:0;}
  .mini-action{border:0;background:#f2f2f7;color:var(--accent);border-radius:8px;padding:6px 8px;min-height:32px;font-size:12px;cursor:pointer;}
  .badge{font-size:11px;padding:2px 8px;border-radius:6px;background:#f1efe8;color:var(--text-2);}
  .badge.cover{background:var(--accent-bg);color:var(--accent-text);}
  .badge.revision{background:#faeeda;color:#854f0b;}
  .modal-overlay{
    position:absolute;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:flex-end;z-index:20;
  }
  .modal-sheet{
    background:var(--bg);width:100%;max-height:92%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden;
  }
  .modal-header{padding:12px 16px;border-bottom:0.5px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--card);}
  .modal-body{padding:14px;overflow-y:auto;flex:1;}
  .doc-review-item{border:0.5px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff;}
  #pdf-canvas-wrap{display:flex;justify-content:center;padding:8px;background:#3a3a38;}
  canvas{max-width:100%;height:auto;background:#fff;}
  .pdf-reader-shell{height:96%;max-height:96%;}
  .pdf-reader-toolbar{padding:9px 12px;border-bottom:.5px solid var(--border);background:var(--card);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pdf-reader-toolbar .toolbar-group{display:flex;align-items:center;gap:6px;}
  .pdf-reader-toolbar button{min-height:36px;padding:6px 10px;}
  .pdf-reader-page-input{width:74px;min-height:36px;padding:6px 8px;font-size:14px;text-align:center;}
  .pdf-reader-status{font-size:12px;color:var(--text-2);margin-left:auto;white-space:nowrap;}
  .pdf-reader-stage{background:#30343b;overflow:auto;flex:1;padding:18px 12px;scroll-behavior:smooth;}
  .pdf-page-frame{width:fit-content;max-width:100%;margin:0 auto 18px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.28);position:relative;}
  .pdf-page-frame.current{outline:3px solid var(--accent);outline-offset:3px;}
  .pdf-page-label{position:sticky;top:4px;z-index:2;width:max-content;margin:0 0 -30px 8px;padding:5px 9px;border-radius:999px;background:rgba(28,28,30,.78);color:#fff;font-size:11px;backdrop-filter:blur(8px);}
  .pdf-page-frame canvas{display:block;max-width:none;}
  .pdf-text-layer{position:absolute;inset:0;overflow:hidden;line-height:1;opacity:1;z-index:1;pointer-events:auto;}
  .pdf-text-layer span,.pdf-text-layer br{position:absolute;color:transparent;white-space:pre;transform-origin:0 0;cursor:text;}
  .pdf-text-layer ::selection{background:rgba(0,122,255,.3);}
  .procedure-range-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .procedure-range-help{margin:8px 0 0;padding:9px 10px;border-radius:9px;background:var(--accent-bg);color:var(--accent-text);font-size:11px;line-height:1.6;}
  .procedure-heading{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 8px;}
  .procedure-heading h2{font-size:15px;margin:0;}
  .procedure-card-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px;}
  .procedure-card{position:relative;min-height:76px;border:0;border-radius:13px;padding:14px 30px 14px 12px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.07);color:#17324d;transition:transform .14s ease,box-shadow .14s ease,opacity .14s ease;user-select:none;}
  .procedure-card:active{cursor:grabbing;}
  .procedure-card.dragging{opacity:.42;transform:scale(.97);}
  .procedure-card.drag-over{box-shadow:0 0 0 3px var(--accent),0 5px 16px rgba(0,0,0,.12);transform:translateY(-2px);}
  .procedure-card-name{font-size:14px;font-weight:700;line-height:1.4;margin:0;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .procedure-card-menu{position:absolute;right:7px;top:7px;width:28px;height:28px;min-height:0;border:0;border-radius:50%;background:rgba(255,255,255,.62);color:#334155;font-size:18px;line-height:1;cursor:pointer;}
  .procedure-blue{background:#dceeff}.procedure-green{background:#dff4e7}.procedure-orange{background:#ffead2}.procedure-purple{background:#eee4ff}.procedure-red{background:#ffe1e1}.procedure-gray{background:#e9ebef}
  .color-options{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px;}
  .color-choice{width:36px;height:36px;min-height:0;border:3px solid transparent;border-radius:50%;cursor:pointer;}
  .color-choice.selected{border-color:#1c1c1e;box-shadow:0 0 0 2px #fff inset;}
  .recent-searches{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 14px;}
  .recent-search-item{display:inline-flex;align-items:center;background:#fff;border:.5px solid var(--border);border-radius:999px;overflow:hidden;}
  .recent-search-use,.recent-search-remove{border:0;background:transparent;min-height:34px;cursor:pointer;color:var(--text-2);}
  .recent-search-use{padding:6px 4px 6px 11px;font-size:12px;}.recent-search-remove{padding:4px 9px 4px 5px;color:var(--text-muted);font-size:15px;}

  /* ---------- 專業桌面版（不更動PDF與資料庫核心） ---------- */
  .section-title{font-size:18px;font-weight:700;margin:0 0 4px;}
  .section-subtitle{font-size:13px;color:var(--text-2);margin:0;}
  .toolbar-card{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .toolbar-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px;}
  .stat-card{background:#fff;border:.5px solid var(--border);border-radius:14px;padding:14px;min-width:0;}
  .stat-label{font-size:12px;color:var(--text-2);margin-bottom:7px;}
  .stat-value{font-size:22px;font-weight:720;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stat-note{font-size:11px;color:var(--text-muted);margin-top:5px;}
  .analysis-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.85fr);gap:12px;}
  .panel{background:#fff;border:.5px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.035);margin-bottom:12px;}
  .panel-title{font-size:15px;font-weight:700;margin:0 0 3px;}
  .panel-note{font-size:12px;color:var(--text-2);margin:0 0 12px;}
  .filter-grid{display:grid;grid-template-columns:1fr 1.5fr 1fr auto;gap:10px;align-items:end;}
  .rank-columns{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .rank-list{margin:0;padding:0;list-style:none;}
  .rank-item{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:.5px solid var(--border);}
  .rank-item:last-child{border-bottom:0;}
  .rank-no{width:26px;height:26px;border-radius:8px;background:#f2f2f7;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-2);}
  .rank-station{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rank-line{font-size:11px;color:var(--text-muted);margin-top:2px;}
  .rank-value{text-align:right;font-size:12px;font-variant-numeric:tabular-nums;}
  .chart-wrap{width:100%;overflow:hidden;}
  .chart-wrap svg{display:block;width:100%;height:auto;}
  .chart-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin:4px 0 10px;}
  .legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;}
  .data-table-wrap{overflow:auto;border:.5px solid var(--border);border-radius:12px;}
  .data-table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap;}
  .data-table th{position:sticky;top:0;background:#f7f7fa;color:var(--text-2);font-weight:650;text-align:right;padding:9px;border-bottom:.5px solid var(--border);}
  .data-table th:first-child,.data-table td:first-child{text-align:left;}
  .data-table td{text-align:right;padding:9px;border-bottom:.5px solid var(--border);font-variant-numeric:tabular-nums;}
  .positive{color:#218739}.negative{color:#c43b32}.neutral{color:var(--text-2)}
  .import-report{background:#f7f7fa;border-radius:12px;padding:11px 12px;font-size:12px;line-height:1.7;color:var(--text-2);margin-top:10px;}
  .segmented{display:flex;background:#eeeeF3;border-radius:9px;padding:2px;}
  .segmented button{border:0;background:transparent;border-radius:7px;padding:7px 10px;font-size:12px;color:var(--text-2);cursor:pointer;min-height:32px;}
  .segmented button.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:650;}

  @media (min-width:900px){
    body{display:block;padding:0;background:#eef1f6;overflow:hidden;}
    #phone{width:100vw;height:100vh;border:0;border-radius:0;box-shadow:none;background:#f5f6fa;display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:64px minmax(0,1fr);overflow:hidden;}
    #topbar{grid-column:2;grid-row:1;height:64px;padding:0 28px;background:rgba(255,255,255,.92);border-bottom:1px solid #e5e8ef;}
    #topbar h1{font-size:20px;letter-spacing:-.01em;}
    #topbar button{width:38px;height:38px;border-radius:10px;background:#f3f4f8;font-size:22px;}
    #content{grid-column:2;grid-row:2;padding:24px 28px 40px;overflow:auto;}
    #content>div:not(.modal-overlay),#content>.card,#content>input{max-width:1440px;margin-left:auto;margin-right:auto;}
    #tabbar{grid-column:1;grid-row:1 / 3;height:auto;background:#121d2f;border:0;display:flex;flex-direction:column;align-items:stretch;padding:18px 12px;gap:6px;order:-1;}
    .desktop-brand{display:block;color:#fff;font-size:18px;font-weight:750;padding:6px 10px 20px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:12px;}
    .desktop-brand small{display:block;color:#91a0b6;font-size:11px;font-weight:500;margin-top:5px;}
    .desktop-version{display:block;margin-top:auto;color:#73829a;font-size:10px;padding:12px 10px 2px;}
    .tab-btn{flex:0 0 auto;min-height:48px;flex-direction:row;justify-content:flex-start;padding:0 12px;gap:12px;border-radius:10px;color:#aeb9ca;font-size:14px;font-weight:600;text-align:left;}
    .tab-btn:hover{background:rgba(255,255,255,.07);color:#fff;}
    .tab-btn.active{background:#1677ff;color:#fff;box-shadow:0 6px 18px rgba(0,101,255,.22);}
    .tab-btn .icon{font-size:18px;width:22px;text-align:center;}
    .card{border-radius:16px;padding:16px 18px;margin-bottom:12px;}
    .modal-overlay{position:fixed;align-items:center;justify-content:center;padding:30px;}
    .modal-sheet{width:min(960px,92vw);max-height:88vh;border-radius:18px;box-shadow:0 24px 70px rgba(13,25,45,.35);}
    .modal-header{padding:15px 20px}.modal-body{padding:20px;}
    .reader-text,.sop-block{font-size:15px;}
    .pdf-reader-shell{width:min(1180px,94vw);max-height:94vh;}
  }
  @media (max-width:899px){
    html,body{width:100%;height:100%;min-height:100%;overflow:hidden;background:var(--bg);}
    body{display:block;padding:0;}
    #phone{width:100%;height:100%;height:100dvh;border:0;border-radius:0;box-shadow:none;}
    #topbar{padding-top:env(safe-area-inset-top);height:calc(56px + env(safe-area-inset-top));}
    #content{padding-bottom:calc(14px + env(safe-area-inset-bottom));}
    #tabbar{height:calc(68px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);}
    .stat-grid{grid-template-columns:1fr 1fr;}
    .analysis-grid,.filter-grid,.rank-columns{grid-template-columns:1fr;}
    .toolbar-card{align-items:flex-start;flex-direction:column;}
    .pdf-reader-shell{height:100%;max-height:100%;border-radius:0;}
    .pdf-reader-toolbar{gap:6px;padding:8px;}
    .pdf-reader-status{width:100%;margin:0;text-align:center;order:5;}
    .pdf-reader-stage{padding:12px 6px;}
    .procedure-card-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
    .procedure-card{min-height:72px;}
  }
  @media (max-width:520px){.procedure-card-grid{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<div id="phone">
  <div id="topbar">
    <h1 id="page-title">作業查詢</h1>
    <button id="data-mgmt-btn" title="資料管理">⋯</button>
  </div>
  <div id="content"></div>
  <div id="tabbar">

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ---------- IndexedDB layer ---------- */
const DB_NAME = 'stationAssistantDB';
const STORES = ['pdfFiles','sopDocs','announcements','personnel','ridership','favorites','recentViews','synonymGroups','unmatchedQueries'];
// 使用專用名稱，避免PDF.js在file://假Worker模式下與通用全域名稱 db 衝突。
let stationOperationsDatabase;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, 3);
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      STORES.forEach(name=>{
        if(!d.objectStoreNames.contains(name)){
          d.createObjectStore(name,{keyPath:'id',autoIncrement:true});
        }
      });
    };
    req.onsuccess = ()=>{stationOperationsDatabase=req.result; resolve(stationOperationsDatabase);};
    req.onerror = ()=>reject(req.error);
  });
}
function txStore(name, mode){
  return stationOperationsDatabase.transaction(name, mode).objectStore(name);
}
function dbGetAll(name){
  return new Promise((res,rej)=>{
    const r = txStore(name,'readonly').getAll();
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function dbAdd(name, obj){
  return new Promise((res,rej)=>{
    const r = txStore(name,'readwrite').add(obj);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function dbPut(name, obj){
  return new Promise((res,rej)=>{
    const r = txStore(name,'readwrite').put(obj);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function dbDelete(name, id){
  return new Promise((res,rej)=>{
    const r = txStore(name,'readwrite').delete(id);
    r.onsuccess=()=>res(); r.onerror=()=>rej(r.error);
  });
}

/* ---------- In-memory cache ---------- */
const cache = { pdfFiles:[], sopDocs:[], announcements:[], personnel:[], ridership:[], favorites:[], recentViews:[], synonymGroups:[], unmatchedQueries:[] };
async function reloadCache(){
  for(const name of STORES){ cache[name] = await dbGetAll(name); }
}

/* ---------- App state ---------- */
let currentTab = 'sop';
let sopFilter = 'content'; // 'content' | 'all'

let noticeKeyword = '';
let personnelKeyword = '';
let ridershipKeyword = '';
let ridershipView = {year:'', stationKey:'', metric:'averageDaily', rankMonth:'01'};

/* ---------- PDF parsing helpers ---------- */
function isRevisionPage(text){
  const compact = text.replace(/\s+/g,'');
  if(compact.includes('文件異動狀況表')) return true;
  const set1 = compact.includes('修訂緣由') && compact.includes('修訂內容概述');
  const set2 = compact.includes('版別') && compact.includes('編訂') && compact.includes('審查') && compact.includes('核定');
  return set1 || set2;
}
function isRevisionStartPage(text){
  const compact = text.replace(/\s+/g,'');
  // 每份文件封面後的第一張異動表，會有表名或完整的異動表主要欄位。
  return compact.includes('文件異動狀況表') ||
    (compact.includes('發行日期') &&
     compact.includes('修訂緣由') &&
     compact.includes('修訂內容概述'));
}
function isCoverPage(text){
  const compact = text.replace(/\s+/g,'');
  const hasCode = compact.includes('文件編號');
  const hasFirstIssue = compact.includes('首次發行日期') || compact.includes('初次發行日期');
  const hasOwner = compact.includes('編訂單位') || compact.includes('保管單位');
  // 公司封面固定會同時出現文件編號及首次發行日期；第三欄作為掃描／抽字不完整時的備援。
  return (hasCode && hasFirstIssue) || (hasCode && hasOwner && !compact.includes('文件異動狀況表'));
}
function extractHeaderInfo(text){
  const compact = text.replace(/\s+/g,'');
  const nameM = compact.match(/文件名稱[:：]?([\s\S]*?)(?=文件編號|最新版別|版別|章節|首次發行日期|初次發行日期|編訂單位|保管單位|$)/);
  const codeM = compact.match(/文件編號[:：]?([\s\S]*?)(?=首次發行日期|初次發行日期|最新版別|編訂單位|保管單位|$)/);
  return {
    name: nameM ? nameM[1].trim() : null,
    code: codeM ? codeM[1].trim() : null
  };
}
function resolvedDocName(doc){
  for(const page of doc.pages||[]){
    const compact=String(page.formattedText||page.text||'').replace(/\s+/g,'');
    const m=compact.match(/文件名稱[:：]?(.{2,100}?)(?=文件編號|最新版別|版別|章節|首次發行日期|初次發行日期|編訂單位|保管單位)/);
    if(m){
      const candidate=m[1].replace(/[，,。；;：:]+$/,'').trim();
      if(candidate.length>=2&&candidate.length<=80&&!/(?:修訂第|編訂|審查|核定|工程師|中心主任)/.test(candidate)) return candidate;
    }
  }
  const original=String(doc.name||'').trim();
  if(original.length<=80&&!/(?:修訂第|編訂|審查|核定|工程師|中心主任)/.test(original)) return original;
  return '站務工作說明書';
}
function guessTitle(coverText){
  let cleaned = coverText.replace(/\s+/g,'').trim();
  // 常見前綴：把公司抬頭類的詞先去掉再取一段當標題
  const stopWords = ['股份有限公司','有限公司'];
  stopWords.forEach(w=>{
    const idx = cleaned.indexOf(w);
    if(idx>=0) cleaned = cleaned.slice(idx+w.length);
  });
  return cleaned.slice(0,24) || '未命名文件';
}
function extractFormattedText(textContent,pageHeight){
  const layoutLines=[];
  let currentLine=[],lastY=null;
  const flushLine=()=>{
    if(currentLine.length) layoutLines.push(currentLine.join(' ').replace(/\s+/g,' ').trim());
    currentLine=[];
  };
  textContent.items.forEach(it=>{
    const str=(it.str||'').trim();
    if(!str) return;
    const y=it.transform ? it.transform[5] : lastY;
    // 排除頁面最下方獨立的文件內部頁碼；APP另以PDF總檔頁碼顯示。
    if(pageHeight && y<pageHeight*.075 && /^\d{1,4}$/.test(str)) return;
    if(currentLine.length && lastY!==null && y!==null && Math.abs(y-lastY)>3) flushLine();
    currentLine.push(str);
    lastY=y;
    if(it.hasEOL) flushLine();
  });
  flushLine();
  return layoutLines.filter(Boolean).join('\n');
}
async function parsePdfArrayBuffer(buf,onProgress=()=>{}){
  const pdf = await pdfjsLib.getDocument({data:buf.slice(0)}).promise;
  const pages = [];
  onProgress(0,pdf.numPages);
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    const text = tc.items.map(it=>it.str).join(' ');
    const viewport = page.getViewport({scale:1});
    const formattedText=extractFormattedText(tc,viewport.height);
    const positionedText = tc.items.map(it=>({
      text:(it.str || '').trim(),
      x:it.transform ? it.transform[4] : 0,
      y:it.transform ? it.transform[5] : 0
    })).filter(it=>it.text);
    pages.push({absolutePage:i, text, formattedText, positionedText, pageWidth:viewport.width, pageHeight:viewport.height});
    onProgress(i,pdf.numPages);
  }
  return pages;
}
function romanToInt(s){
  const vals={i:1,v:5,x:10,l:50,c:100,d:500,m:1000};
  s=s.toLowerCase();
  if(!/^[ivxlcdm]+$/.test(s)) return null;
  let total=0;
  for(let i=0;i<s.length;i++){
    const cur=vals[s[i]], next=vals[s[i+1]];
    if(next && cur<next) total-=cur; else total+=cur;
  }
  return total;
}
function parsePageLabelToken(token){
  const cleaned = String(token || '').trim().replace(/[－—–\-_.頁第]/g,'');
  if(/^\d{1,4}$/.test(cleaned)) return {type:'arabic', value:parseInt(cleaned,10)};
  if(/^[ivxlcdm]{1,6}$/i.test(cleaned)){
    const v = romanToInt(cleaned);
    if(v) return {type:'roman', value:v};
  }
  return null;
}
function extractPageLabel(page){
  // PDF 文字陣列的先後順序不代表版面位置，優先從頁面底部 18% 尋找置中的頁碼。
  const footer = (page.positionedText || [])
    .filter(it=>it.y <= page.pageHeight * .18)
    .map(it=>({it, label:parsePageLabelToken(it.text)}))
    .filter(x=>x.label)
    .sort((a,b)=>Math.abs(a.it.x-page.pageWidth/2)-Math.abs(b.it.x-page.pageWidth/2));
  if(footer.length) return footer[0].label;
  // 舊式或座標缺失 PDF 的備援。
  const tokens = page.text.trim().split(/\s+/);
  const last = tokens[tokens.length-1] || '';
  return parsePageLabelToken(last) || {type:'none', value:null};
}
function segmentDocuments(pages){
  const labels = pages.map(p=>extractPageLabel(p));
  const boundaries = new Set();
  const explicitCovers = new Set();
  pages.forEach((page,i)=>{
    // 單靠「文件編號／首次發行日期」會把正文中的表單誤認成封面。
    // 依公司文件固定結構，只有「封面之後緊接異動表」才視為新文件。
    const nextIsRevisionStart = i+1 < pages.length && isRevisionStartPage(pages[i+1].text);
    if(isCoverPage(page.text) && nextIsRevisionStart) explicitCovers.add(i);
  });
  if(explicitCovers.size){
    // 找到真正封面時，以第一個封面為起點；封面之前的總目錄／對照表不建立成SOP。
    explicitCovers.forEach(i=>boundaries.add(i));
  } else {
    // 若整份 PDF 都抽不到封面固定欄位，保留第1頁並退回以 i／正文 1 的重置位置推測分界。
    boundaries.add(0);
    for(let i=0;i<pages.length;i++){
      const lab = labels[i];
      if(lab.type==='roman' && lab.value===1){
        boundaries.add(i);
      } else if(lab.type==='arabic' && lab.value===1){
        const prev = i>0 ? labels[i-1] : null;
        if(!prev || prev.type!=='roman') boundaries.add(i);
      }
    }
  }
  // 把緊接在邊界前、沒有頁碼的封面頁往前納入這份新文件，並記錄哪些索引才是真正的封面頁
  const coverIdxSet = new Set();
  const finalSet = new Set();
  boundaries.forEach(idx=>{
    let start = idx;
    while(!explicitCovers.size && start>0 && labels[start-1].type==='none' && !boundaries.has(start-1)){
      coverIdxSet.add(start-1);
      start--;
    }
    if(explicitCovers.has(idx)) coverIdxSet.add(idx);
    finalSet.add(start);
  });
  const sorted = Array.from(finalSet).sort((a,b)=>a-b);

  const docs = [];
  for(let i=0;i<sorted.length;i++){
    const start = sorted[i];
    const end = (i+1<sorted.length) ? sorted[i+1]-1 : pages.length-1;
    const slice = pages.slice(start, end+1);
    let info = extractHeaderInfo(slice[0].text);
    if(!info.name){
      for(const pg of slice){ const alt = extractHeaderInfo(pg.text); if(alt.name){ info = alt; break; } }
    }
    const name = info.name || guessTitle(slice[0].text);
    const docPages = slice.map((p,rel)=>{
      const absIdx = start+rel;
      // 型態判斷改為只依內容特徵（修訂紀錄關鍵字），封面只認定為明確被歸類的封面索引，不再受頁碼抓取失敗影響
      const type = coverIdxSet.has(absIdx) ? 'cover' : (isRevisionPage(p.text) ? 'revision' : 'content');
      return { pageNum: rel+1, absolutePage: p.absolutePage, text: p.text, formattedText:p.formattedText, type, _label: labels[absIdx] };
    });
    docs.push({name, pages:docPages});
  }
  return docs;
}

/* ---------- Rendering ---------- */
const contentEl = document.getElementById('content');
const titleEl = document.getElementById('page-title');

// 中文注音／拼音輸入時，compositionend 前不可重建輸入框，否則組字會被中斷。
function bindImeSafeSearch(input, setValue, rerender){
  if(!input) return;
  let composing = false;
  input.addEventListener('compositionstart', ()=>{ composing = true; });
  input.addEventListener('input', e=>{
    setValue(e.target.value);
    if(!composing && !e.isComposing) rerender();
  });
  input.addEventListener('compositionend', e=>{
    composing = false;
    setValue(e.target.value);
    rerender();
  });
}
function focusAtEnd(id){
  const input = document.getElementById(id);
  if(!input) return;
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
}

function render(){
  titleEl.textContent = titleMap[currentTab];
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===currentTab));
  if(currentTab==='sop') renderSop();
  if(currentTab==='library') renderLibrary();
  if(currentTab==='personnel') renderPersonnel();
  if(currentTab==='ridership') renderRidership();
}

/* --- SOP tab --- */
function countTypes(doc){
  let c=0,r=0,ct=0;
  doc.pages.forEach(p=>{ if(p.type==='cover')c++; else if(p.type==='revision')r++; else ct++; });
  return {c,r,ct};
}
function renderSop(){
  const results = sopKeyword.trim() ? searchUnified(sopKeyword.trim()) : null;
  const recentSearches=getSearchHistory();
  let html = `
    <div class="search-field">
      <span class="search-icon">⌕</span>
      <input type="text" id="sop-search-input" placeholder="輸入關鍵字，例如：車站 鑰匙" value="${escapeHtml(sopKeyword)}">
      ${sopKeyword?`<button class="search-clear" id="sop-search-clear" aria-label="清除全部關鍵字">×</button>`:''}
    </div>
    <p class="tiny-muted" style="margin:-4px 0 10px;">可輸入關鍵字或直接描述狀況，例如「電梯困人如何處理」。</p>
    <div class="chips-row">
      <span class="chip ${searchSource==='all'?'active':''}" data-source="all">全部</span>
      <span class="chip ${searchSource==='sop'?'active':''}" data-source="sop">SOP</span>
      <span class="chip ${searchSource==='notice'?'active':''}" data-source="notice">通告</span>
      <span class="chip ${sopFilter==='all'?'active':''}" data-revision-toggle="1">含修訂紀錄</span>
    </div>
    ${!results&&recentSearches.length?`<div class="recent-searches"><span class="tiny-muted">最近搜尋</span>${recentSearches.map((q,i)=>`<span class="recent-search-item"><button class="recent-search-use" data-search-history-use="${i}">${escapeHtml(q)}</button><button class="recent-search-remove" data-search-history-remove="${i}" aria-label="刪除 ${escapeHtml(q)}">×</button></span>`).join('')}<button class="danger-text" id="clear-search-history">清除全部</button></div>`:''}`;

  if(results){
    const terms = lastSearchPlan?.expanded||parseSearchTerms(sopKeyword);
    const docCount = new Set(results.map(r=>`${r.source}-${r.docName}`)).size;
    html += `${lastSearchPlan?.isSmart?'<p class="tiny-muted" style="margin:0 0 5px;">智慧擴充搜尋：</p>':''}
      <div class="search-keywords">${terms.slice(0,12).map(t=>`<span class="search-keyword">${escapeHtml(t)}</span>`).join('')}</div>
      <p class="search-summary">找到 ${docCount} 份資料、${results.length} 條相關內容｜點選卡片直接閱讀原始PDF</p>`;
    results.forEach(r=>{
      const savedItem=r.source==='sop'
        ? {type:'sop',docId:r.docId,absolutePage:r.absolutePage,title:r.docName}
        : {type:'notice',noticeId:r.noticeId,title:r.docName};
      const isFav=!!favoriteFor(savedItem);
      const openAttr=r.source==='sop'
        ? `data-open-text="${r.docId}" data-page="${r.absolutePage}" data-clause-target="${escapeHtml(r.clauseMarker||'')}"`
        : `data-open-notice="${r.noticeId}"`;
      html += `<div class="card" ${openAttr}>
        <div class="row between" style="margin-bottom:4px;">
          <span class="search-doc-title">${r.source==='sop'?'📄':'📣'} ${escapeHtml(r.docName)}</span>
          <span class="search-page-badge">${r.source==='sop'?`PDF第${r.absolutePage}頁${r.clauseMarker?`・${r.clauseMarker}`:''}`:'通告'}</span>
          <button class="favorite-btn" data-fav-type="${savedItem.type}" data-fav-id="${r.source==='sop'?r.docId:r.noticeId}" data-fav-page="${r.absolutePage||''}" data-fav-title="${escapeHtml(r.docName)}">${isFav?'★':'☆'}</button>
        </div>
        ${r.titleMatched?`<p class="tiny-muted" style="margin:6px 0 0;">✓ 文件名稱符合</p>`:''}
        ${r.snippetsHtml.map(s=>`<p class="search-snippet">${s}</p>`).join('')}
        <button class="mini-action" data-teach-query="${escapeHtml(sopKeyword)}" style="margin-top:8px;">＋新增口語說法</button>
      </div>`;
    });
    if(results.length===0){
      html += `<div class="empty" style="padding:38px 20px;"><p>沒有符合的結果</p>
        <button class="primary" id="teach-no-result">新增同義詞</button></div>`;
    }
  } else html += renderShortcutSection();
  contentEl.innerHTML = html;

  const searchInput = document.getElementById('sop-search-input');
  if(searchInput){
    bindImeSafeSearch(searchInput, value=>{ sopKeyword=value; }, render);
    searchInput.addEventListener('keydown',e=>{
      if(e.key==='Escape'){ sopKeyword=''; render(); }
      if(e.key==='Enter'&&sopKeyword.trim()) saveSearchHistory(sopKeyword);
    });
    focusAtEnd('sop-search-input');
  }
  document.getElementById('sop-search-clear')?.addEventListener('click',()=>{
    sopKeyword='';
    render();
    focusAtEnd('sop-search-input');
  });
  contentEl.querySelectorAll('[data-source]').forEach(c=>{
    c.addEventListener('click', ()=>{ searchSource=c.dataset.source; render(); });
  });
  contentEl.querySelectorAll('[data-revision-toggle]').forEach(c=>{
    c.addEventListener('click', ()=>{ sopFilter=sopFilter==='all'?'content':'all'; render(); });
  });
  contentEl.querySelectorAll('[data-open-text]').forEach(card=>{
    card.addEventListener('click', ()=>{
      saveSearchHistory(sopKeyword);
      openSopPdfReader(Number(card.dataset.openText),Number(card.dataset.page));
    });
  });
  contentEl.querySelectorAll('[data-open-notice]').forEach(card=>{
    card.addEventListener('click', ()=>{saveSearchHistory(sopKeyword);openNoticeReader(Number(card.dataset.openNotice));});
  });
  contentEl.querySelectorAll('[data-fav-type]').forEach(btn=>{
    btn.addEventListener('click',async e=>{
      e.stopPropagation();
      const item=btn.dataset.favType==='notice'
        ? {type:'notice',noticeId:Number(btn.dataset.favId),title:btn.dataset.favTitle}
        : {type:'sop',docId:Number(btn.dataset.favId),absolutePage:Number(btn.dataset.favPage),title:btn.dataset.favTitle};
      await toggleFavorite(item); render();
    });
  });
  contentEl.querySelectorAll('[data-teach-query]').forEach(btn=>{
    btn.addEventListener('click',async e=>{
      e.stopPropagation();
      await openSynonymDialog(btn.dataset.teachQuery,'');
    });
  });
  document.getElementById('teach-no-result')?.addEventListener('click',async()=>{
    await recordUnmatchedQuery(sopKeyword);
    if(await openSynonymDialog(sopKeyword,'')) render();
  });
  contentEl.querySelectorAll('[data-procedure-card]').forEach(card=>card.addEventListener('click',e=>{
    if(e.target.closest('[data-procedure-menu]')||Date.now()-procedureDragEndedAt<350) return;
    const item=cache.favorites.find(x=>x.id===Number(card.dataset.procedureCard));
    if(item) openSavedItem(item);
  }));
  bindProcedureCardSorting();
  contentEl.querySelectorAll('[data-procedure-menu]').forEach(btn=>btn.addEventListener('click',e=>{
    e.stopPropagation();openProcedureCardMenu(Number(btn.dataset.procedureMenu));
  }));
  contentEl.querySelectorAll('[data-search-history-use]').forEach(btn=>btn.addEventListener('click',()=>{
    sopKeyword=getSearchHistory()[Number(btn.dataset.searchHistoryUse)]||'';render();
  }));
  contentEl.querySelectorAll('[data-search-history-remove]').forEach(btn=>btn.addEventListener('click',()=>{
    const rows=getSearchHistory();rows.splice(Number(btn.dataset.searchHistoryRemove),1);setSearchHistory(rows);render();
  }));
  document.getElementById('clear-search-history')?.addEventListener('click',()=>{setSearchHistory([]);render();});
  contentEl.querySelectorAll('[data-remove-favorite]').forEach(btn=>{
    btn.addEventListener('click',async e=>{
      e.stopPropagation();
      await dbDelete('favorites',Number(btn.dataset.removeFavorite));
      await reloadCache(); render();
    });
  });
}
function getSearchHistory(){
  try{return JSON.parse(localStorage.getItem(SEARCH_HISTORY_KEY)||'[]').filter(x=>typeof x==='string').slice(0,8);}catch{return [];}
}
function setSearchHistory(rows){localStorage.setItem(SEARCH_HISTORY_KEY,JSON.stringify(rows.slice(0,8)));}
function saveSearchHistory(value){
  const q=String(value||'').trim();if(!q)return;
  setSearchHistory([q,...getSearchHistory().filter(x=>x!==q)]);
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function parseSearchTerms(keyword){

function readablePdfText(text){
  let out = String(text || '').replace(/\s+/g,' ').trim();
  // 移除PDF抽字時夾在中文字之間的假空格，但保留一般詞組及英文空格。
  for(let i=0;i<6;i++){
    const next = out.replace(/([\u3400-\u9fff])\s+([\u3400-\u9fff])/g,'$1$2');
    if(next===out) break;
    out=next;
  }
  return out;
}

function makeSearchSnippet(text, term){
  const readable = readablePdfText(text);
  const compactTerm = term.replace(/\s+/g,'');
  const comparable = readable.toLocaleLowerCase();
  let idx = comparable.indexOf(compactTerm.toLocaleLowerCase());
  if(idx<0){
    // 搜尋時忽略空格；若原文仍有特殊空白，退回顯示頁面開頭。
    return `…${escapeHtml(readable.slice(0,70))}${readable.length>70?'…':''}`;
  }
  const start = Math.max(0,idx-32);
  const end = Math.min(readable.length,idx+compactTerm.length+48);
  return `${start>0?'…':''}${escapeHtml(readable.slice(start,idx))}<span class="highlight">${escapeHtml(readable.slice(idx,idx+compactTerm.length))}</span>${escapeHtml(readable.slice(idx+compactTerm.length,end))}${end<readable.length?'…':''}`;
}
const SMART_CONCEPTS=[
  ['電梯','升降機'],
  ['電扶梯','扶梯'],
  ['困人','受困','受困旅客','電梯受困'],
  ['非真實火警','火警誤報','誤報','假火警'],
  ['真實火警','火災','起火'],

const QUESTION_WORDS=/如何|怎麼辦|怎麼|怎樣|遭遇|遇到|發生|應如何|要如何|請問|規定為何|處理方式/g;
const ACTION_ALIASES=['處理','處置','應變','排除','救援','通報','停機','管制','確認'];
let lastSearchPlan=null;
function buildSmartSearchPlan(keyword){
  const normalized=searchComparable(keyword);
  const groups=[];
  const customGroups=cache.synonymGroups.map(g=>[g.canonical,...(g.aliases||[])].filter(Boolean));
  [...SMART_CONCEPTS,...customGroups].forEach(aliases=>{
    if(aliases[0]==='真實火警'&&/(?:非真實火警|火警誤報|誤報|假火警)/.test(normalized)) return;
    if(aliases.some(alias=>normalized.includes(searchComparable(alias)))) groups.push(aliases);
  });
  const rawTerms=parseSearchTerms(keyword.replace(QUESTION_WORDS,' ').replace(/[，。？！、；：]/g,' '));
  rawTerms.forEach(term=>{
    if(term.length<2||ACTION_ALIASES.includes(term)) return;
    if(!groups.some(group=>group.some(alias=>searchComparable(alias).includes(searchComparable(term))||searchComparable(term).includes(searchComparable(alias))))) groups.push([term]);
  });
  if(!groups.length){
    parseSearchTerms(keyword).forEach(term=>groups.push([term]));
  }
  const expanded=[...new Set(groups.flat())];
  const intent=ACTION_ALIASES.filter(word=>normalized.includes(searchComparable(word)));
  if(/如何|怎麼|處理方式|怎麼辦/.test(keyword)&&!intent.length) intent.push('處理','處置','應變');
  return {groups,expanded,intent,isSmart:expanded.some(t=>!normalized.includes(searchComparable(t)))||/如何|怎麼|怎樣|請問/.test(keyword)};

function groupMatches(text,group){
  const comparable=searchComparable(text);

function searchSop(keyword,plan){
  const out = [];
  cache.sopDocs.forEach(doc=>{
    const displayName=resolvedDocName(doc);
    const titleMatches=plan.groups.map(group=>groupMatches(displayName,group));
    const pages = doc.pages.filter(p=>p.type!=='cover' && !(sopFilter==='content' && p.type==='revision'));
    if(titleMatches.every(Boolean) && pages.length){
      const p=pages[0];
      out.push({source:'sop',docId:doc.id,docName:displayName,pdfFileId:doc.pdfFileId,pageNum:p.pageNum,absolutePage:p.absolutePage,titleMatched:true,snippetsHtml:[],score:50});
      return;
    }
    pages.forEach(p=>{
      const paragraphs=parseSopParagraphs(p.formattedText||p.text);
      paragraphs.forEach(paragraph=>{
        const clauseMatches=plan.groups.map(group=>groupMatches(paragraph.text,group));
        if(!plan.groups.every((group,i)=>titleMatches[i]||clauseMatches[i])) return;
        const matchedAliases=plan.expanded.filter(alias=>groupMatches(paragraph.text,[alias]));
        let score=clauseMatches.filter(Boolean).length*10+titleMatches.filter(Boolean).length*4;
        score+=plan.intent.filter(word=>groupMatches(paragraph.text,[word])).length*2;
        if(paragraph.marker) score+=2;
        out.push({
          source:'sop',docId:doc.id,docName:displayName,pdfFileId:doc.pdfFileId,pageNum:p.pageNum,absolutePage:p.absolutePage,
          titleMatched:titleMatches.some(Boolean),clauseMarker:paragraph.marker,score,
          snippetsHtml:[highlightedClause(paragraph.text,matchedAliases.length?matchedAliases:plan.expanded)]
        });
      });
    });
  });
  return out.sort((a,b)=>b.score-a.score||a.docName.localeCompare(b.docName,'zh-Hant')||a.pageNum-b.pageNum).slice(0,100);
}
function searchNotices(keyword,plan){
  return cache.announcements.map(n=>{
    const combined=searchComparable(`${n.title} ${n.category||''} ${n.content||''}`);
    const matches=plan.groups.map(group=>group.some(alias=>combined.includes(searchComparable(alias))));
    if(!matches.every(Boolean)) return null;
    const matched=plan.expanded.filter(alias=>combined.includes(searchComparable(alias)));
    return {
    source:'notice',noticeId:n.id,docName:n.title,pageNum:null,absolutePage:null,
    titleMatched:plan.groups.some(group=>groupMatches(n.title,group)),score:matches.filter(Boolean).length*10,
    snippetsHtml:[highlightedClause(n.content||n.title,matched)]
  };}).filter(Boolean).sort((a,b)=>b.score-a.score);
}
function searchUnified(keyword){
  const plan=buildSmartSearchPlan(keyword);

  if(searchSource!=='notice') out=out.concat(searchSop(keyword,plan));
  if(searchSource!=='sop') out=out.concat(searchNotices(keyword,plan));

}

function bindProcedureCardSorting(){
  const cards=[...contentEl.querySelectorAll('[data-procedure-card]')];
  let draggedId=null;
  cards.forEach(card=>{
    card.addEventListener('dragstart',e=>{
      if(e.target.closest('[data-procedure-menu]')){e.preventDefault();return;}
      draggedId=Number(card.dataset.procedureCard);
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',String(draggedId));
    });
    card.addEventListener('dragover',e=>{
      if(!draggedId||draggedId===Number(card.dataset.procedureCard))return;
      e.preventDefault();e.dataTransfer.dropEffect='move';card.classList.add('drag-over');
    });
    card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));
    card.addEventListener('drop',async e=>{
      e.preventDefault();card.classList.remove('drag-over');
      const targetId=Number(card.dataset.procedureCard);
      if(draggedId&&draggedId!==targetId) await reorderProcedures(draggedId,targetId);
      draggedId=null;render();
    });
    card.addEventListener('dragend',()=>{
      procedureDragEndedAt=Date.now();
      draggedId=null;cards.forEach(x=>x.classList.remove('dragging','drag-over'));
    });
  });

async function reorderProcedures(draggedId,targetId){
  const rows=sortedProcedures();
  const from=rows.findIndex(row=>row.id===Number(draggedId));

  if(from<0||to<0||from===to)return;
  const [moved]=rows.splice(from,1);rows.splice(to,0,moved);
  for(let i=0;i<rows.length;i++){
    rows[i].sortOrder=i+1;
    await dbPut('favorites',rows[i]);
  }
  await reloadCache();

async function handlePdfImport(file){
  const startedAt=Date.now();
  contentEl.innerHTML = `<div class="card" style="text-align:center;padding:28px 20px;">
    <div style="font-size:30px;">📄</div>
    <p style="font-weight:600;margin:8px 0 4px;">正在解析PDF</p>
    <p class="tiny-muted" style="margin:0 0 14px;word-break:break-all;">${escapeHtml(file.name)}</p>
    <div style="height:8px;background:#e5e5ea;border-radius:99px;overflow:hidden;">
      <div id="pc-progress-bar" style="height:100%;width:1%;background:var(--accent);transition:width .2s;"></div>
    </div>
    <p id="pc-progress-main" class="muted" style="margin:12px 0 4px;">正在讀取檔案…</p>
    <p id="pc-progress-time" class="tiny-muted" style="margin:0;">大型合併PDF可能需要數十分鐘</p>
  </div>`;
  const timer=setInterval(()=>{
    const sec=Math.floor((Date.now()-startedAt)/1000);
    const el=document.getElementById('pc-progress-time');
    if(el) el.textContent=`已執行 ${Math.floor(sec/60)}分${String(sec%60).padStart(2,'0')}秒`;
  },1000);
  try{
    const buf = await file.arrayBuffer();
    const pages = await parsePdfArrayBuffer(buf,(current,total)=>{
      const pct=total?Math.max(1,Math.round(current/total*100)):1;
      const bar=document.getElementById('pc-progress-bar');
      const main=document.getElementById('pc-progress-main');
      if(bar) bar.style.width=`${pct}%`;
      if(main) main.textContent=current===0
        ? `共 ${total.toLocaleString()} 頁，準備開始`
        : `第 ${current.toLocaleString()}／${total.toLocaleString()} 頁（${pct}%）`;
    });
    const main=document.getElementById('pc-progress-main');
    if(main) main.textContent='解析完成，正在辨識文件並儲存…';
    const docs = segmentDocuments(pages);
    const pdfFileId = await dbAdd('pdfFiles', {
      fileName:file.name, displayName:file.name.replace(/\.pdf$/i,''), data:buf,
      uploadedAt:new Date().toISOString(), pageCount:pages.length, documentCount:0,
      fileSize:file.size, status:'待確認'
    });
    clearInterval(timer);
    showImportReview(docs, pdfFileId);
  }catch(err){
    clearInterval(timer);
    console.error(err);
    contentEl.innerHTML=`<div class="card" style="text-align:center;padding:28px 20px;">
      <div style="font-size:32px;">⚠️</div>
      <p style="font-weight:600;margin:8px 0;">PDF匯入未完成</p>
      <p class="tiny-muted" style="padding:8px;background:#f2f2f7;border-radius:8px;word-break:break-all;">${escapeHtml(err?.message||'未知錯誤')}</p>
      <button class="secondary" id="pc-import-back">返回文件庫</button>
    </div>`;
    document.getElementById('pc-import-back').addEventListener('click',renderLibrary);
  }
}

/* --- SOP text reader modal --- */
function highlightReaderText(text, terms){
  const readable = readablePdfText(text);
  const lower = readable.toLocaleLowerCase();
  const ranges=[];
  terms.forEach(term=>{
    const needle=readablePdfText(term).toLocaleLowerCase();
    if(!needle) return;
    let from=0,idx;
    while((idx=lower.indexOf(needle,from))>=0){
      ranges.push([idx,idx+needle.length]);
      from=idx+Math.max(1,needle.length);
    }
  });
  ranges.sort((a,b)=>a[0]-b[0]);
  const merged=[];
  ranges.forEach(r=>{
    const last=merged[merged.length-1];
    if(last && r[0]<=last[1]) last[1]=Math.max(last[1],r[1]);
    else merged.push([...r]);
  });
  let html='',pos=0;
  merged.forEach(([start,end])=>{
    html+=escapeHtml(readable.slice(pos,start));
    html+=`<span class="highlight">${escapeHtml(readable.slice(start,end))}</span>`;
    pos=end;
  });
  return html+escapeHtml(readable.slice(pos));
}
function stripSopPageHeader(text){
  let source=String(text||'').trim();
  let rawLines=source.split(/\n+/);
  const chapterIndex=rawLines.slice(0,6).findIndex(line=>/章\s*節\s*[:：]/.test(line));
  if(chapterIndex>=0){
    const chapterLine=rawLines[chapterIndex].replace(/\s+/g,' ').trim();
    const afterChapter=chapterLine.split(/章\s*節\s*[:：]/).slice(1).join('').trim();
    const bodyStart=afterChapter.match(/^(?:\d{1,4}\s+)?(\d{1,3}(?:\.\d+)*\.\s*[\u3400-\u9fff][\s\S]*)$/);
    rawLines=rawLines.slice(chapterIndex+1);
    if(bodyStart) rawLines.unshift(bodyStart[1]);
  }else{
    source=source.replace(/^[\s\S]*?文件名稱[\s\S]*?章節\s*[:：]\s*(?:\d{1,3}\s+(?=\d{1,3}\.))?/,'');
    rawLines=source.split(/\n+/);
  }
  return rawLines.map((line,lineIndex)=>{
    let cleaned=line.replace(/\s+/g,' ').trim();
    if(/^(文件名稱|文件編號)\s*[:：]/.test(cleaned)) return '';
    if(/^最新版別\s*[:：]/.test(cleaned)) return '';
    if(/^\d{1,4}$/.test(cleaned)) return '';
    if(/最新版別/.test(cleaned) && /章節/.test(cleaned)){
      cleaned=cleaned.replace(/^.*?章節\s*[:：]?\s*\d+\s*/,'');
    }
    return cleaned;
  }).filter(Boolean);
}
function parenthesisDelta(text){
  let delta=0;
  for(const c of text){ if(c==='('||c==='（') delta++; if(c===')'||c==='）') delta--; }
  return delta;
}
function detectClauseMarker(line,insideParentheses){
  if(insideParentheses) return null;
  let top=line.match(/^(\d{1,2})\.(?=\s*[\u3400-\u9fff【])/);
  if(top) return {marker:top[1],className:'level-2'};
  let m=line.match(/^(\d{1,2}(?:\.\d+){1,4})\.?(?=\s|[^\d.])/);
  if(m){
    const after=line.slice(m[0].length).trim();
    if(/^(?:說明|規定|辦理|所述)/.test(after)) return null;
    const depth=m[1].split('.').length;
    return {marker:m[1],className:depth===2?'level-2':'level-3'};
  }
  m=line.match(/^([A-Z](?:\.\d+)+|[A-Z]\.)(?=\s|[\u3400-\u9fff【（(])/);
  if(m) return {marker:m[1].replace(/\.$/,''),className:'letter'};
  m=line.match(/^[（(](\d+)[）)]/);
  if(m) return {marker:`(${m[1]})`,className:'subitem'};
  m=line.match(/^(步驟[一二三四五六七八九十]+)[、：:\s]/);
  if(m) return {marker:m[1],className:'letter'};
  return null;
}
function splitInlineStructures(line){
  const candidates=[];
  const patterns=[
    /\d{1,2}(?:\.\d+){1,4}\.?(?=\s*[\u3400-\u9fff【])/g,
    /\d{1,2}\.(?=\s*[\u3400-\u9fff【])/g,
    /[A-Z]\.(?:\d+)?(?=\s|[\u3400-\u9fff【])/g,
    /步驟[一二三四五六七八九十]+(?=[、：:\s])/g
  ];
  patterns.forEach(pattern=>{
    for(const m of line.matchAll(pattern)){
      if(m.index===0) continue;
      const before=line.slice(0,m.index);
      const prev=before.slice(-4);
      if((before.match(/[（(]/g)||[]).length>(before.match(/[）)]/g)||[]).length) continue;
      if(/(?:見|詳見|參照|依照|比照)\s*$/.test(prev)) continue;
      const preceding=line[m.index-1]||'';
      if(!/[\s。；;：:，,）)]/.test(preceding)) continue;
      candidates.push(m.index);
    }
  });
  const points=[0,...new Set(candidates)].sort((a,b)=>a-b);
  return points.map((start,i)=>line.slice(start,points[i+1]??line.length).trim()).filter(Boolean);
}
function parseSopParagraphs(text){
  const lines=stripSopPageHeader(text).flatMap(splitInlineStructures);
  const paragraphs=[];
  let current=null,parenDepth=0;
  const pushCurrent=()=>{ if(current?.text) paragraphs.push(current); current=null; };
  lines.forEach(line=>{
    const marker=detectClauseMarker(line,parenDepth>0);
    if(marker){
      pushCurrent();
      current={text:line,marker:marker.marker,className:marker.className};
      parenDepth=Math.max(0,parenthesisDelta(line));
    }else if(current){
      current.text+=` ${line}`;
      parenDepth=Math.max(0,parenDepth+parenthesisDelta(line));
    }else{
      current={text:line,marker:null,className:''};
      parenDepth=Math.max(0,parenthesisDelta(line));
    }
  });
  pushCurrent();
  return paragraphs;
}
function formatStructuredSopText(text,terms){
  return parseSopParagraphs(text).map(paragraph=>{
    let content=highlightReaderText(paragraph.text,terms);
    content=content.replace(/(見|詳見|依照?|參照|比照)(?:第)?((?:\d+(?:\.\d+)+)|(?:[A-Z]\.\d+))/g,
      '$1<span class="reference-chip" data-clause-ref="$2">$2</span>');
    const clauseAttr=paragraph.marker?` data-clause="${escapeHtml(paragraph.marker)}"`:'';
    return `<div class="sop-block ${paragraph.className}"${clauseAttr}>${content}</div>`;
  }).join('');
}
function readablePageForCopy(page){
  return parseSopParagraphs(page.formattedText||page.text).map(p=>p.text).join('\n\n');
}
async function copyTextToClipboard(text){
  try{
    if(navigator.clipboard?.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(_){}
  const area=document.createElement('textarea');
  area.value=text;
  area.style.position='fixed';
  area.style.opacity='0';
  document.body.appendChild(area);
  area.focus();area.select();
  const ok=document.execCommand('copy');
  area.remove();
  return ok;
}

        currentIndex=Number(el.dataset.readerIndex); draw();
      });
    });
    document.querySelectorAll('[data-copy-reader-page]').forEach(btn=>{
      btn.addEventListener('click',async e=>{
        e.stopPropagation();
        const page=eligible[Number(btn.dataset.copyReaderPage)];
        const ok=await copyTextToClipboard(readablePageForCopy(page));
        const original=btn.textContent;
        btn.textContent=ok?'已複製':'複製失敗';
        setTimeout(()=>{if(btn.isConnected)btn.textContent=original;},1200);
      });
    });
    document.querySelectorAll('[data-clause-ref]').forEach(refEl=>{
      refEl.addEventListener('click',e=>{
        e.stopPropagation();
        const target=refEl.dataset.clauseRef;
        const targetIndex=eligible.findIndex(p=>
          parseSopParagraphs(p.formattedText||p.text).some(paragraph=>paragraph.marker===target)
        );
        if(targetIndex<0) return alert(`本文件中找不到條文 ${target}，請查看PDF原版。`);
        currentIndex=targetIndex;
        draw();
        setTimeout(()=>{
          [...document.querySelectorAll('[data-clause]')].find(el=>el.dataset.clause===target)
            ?.scrollIntoView({behavior:'smooth',block:'center'});
        },80);
      });
    });
    requestAnimationFrame(()=>{
      document.querySelector('.reader-page.current')?.scrollIntoView({block:'center'});
    });
  }
  document.getElementById('reader-close').addEventListener('click',()=>{
    overlay.remove();
    if(currentTab==='sop'&&!sopKeyword) render();
  });
  document.getElementById('reader-prev').addEventListener('click',()=>{ if(currentIndex>0){currentIndex--;draw();} });
  document.getElementById('reader-next').addEventListener('click',()=>{ if(currentIndex<eligible.length-1){currentIndex++;draw();} });
  document.getElementById('reader-favorite').addEventListener('click',async()=>{
    const p=eligible[currentIndex];
    const item={type:'sop',docId:doc.id,absolutePage:p.absolutePage,startPage:Math.max(getSopPageBounds({docId:doc.id}).min,p.absolutePage-1),endPage:Math.min(getSopPageBounds({docId:doc.id}).max,p.absolutePage+1),title:displayName,sourceTitle:displayName};
    await openProcedureNameDialog(item,favoriteFor(item)||null);
    draw();
  });
  document.getElementById('reader-pdf').addEventListener('click',()=>{
    const p=eligible[currentIndex];
    overlay.remove();
    openSopPdfReader(doc.id,p.absolutePage);
  });
  draw();
  if(targetClause){
    setTimeout(()=>{
      [...document.querySelectorAll('[data-clause]')].find(el=>el.dataset.clause===targetClause)
        ?.scrollIntoView({behavior:'smooth',block:'center'});
    },120);
  }
}

/* --- SOP PDF優先閱讀器：文字負責搜尋，PDF負責正式閱讀 --- */
async function openSopPdfReader(docId,absolutePage,options={}){
  const doc=cache.sopDocs.find(d=>d.id===Number(docId));
  if(!doc) return alert('找不到這份文件，請重新整理後再試。');
  const rec=cache.pdfFiles.find(f=>f.id===doc.pdfFileId);
  if(!rec?.data) return alert('找不到原始PDF，請至文件庫確認檔案是否仍存在。');
  const displayName=resolvedDocName(doc);
  const bounds=getSopPageBounds({type:'sop',docId:doc.id,absolutePage});
  let currentPage=Math.min(bounds.max,Math.max(bounds.min,Number(absolutePage)||bounds.min));
  const hasSavedRange=Number.isFinite(Number(options.startPage))&&Number.isFinite(Number(options.endPage));
  let rangeStart=hasSavedRange?Math.max(bounds.min,Number(options.startPage)):Math.max(bounds.min,currentPage-1);
  let rangeEnd=hasSavedRange?Math.min(bounds.max,Number(options.endPage)):Math.min(bounds.max,currentPage+1);
  if(rangeStart>rangeEnd){rangeStart=currentPage;rangeEnd=currentPage;}
  currentPage=Math.min(rangeEnd,Math.max(rangeStart,currentPage));
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.style.zIndex='75';
  overlay.innerHTML=`<div class="modal-sheet pdf-reader-shell">
    <div class="modal-header">
      <span style="font-weight:650;font-size:13px;line-height:1.4;padding-right:8px;">${escapeHtml(displayName)}</span>
      <button id="sop-pdf-close" style="background:none;border:none;font-size:18px;flex-shrink:0;">✕</button>
    </div>
    <div class="pdf-reader-toolbar">
      <div class="toolbar-group">
        <button class="secondary" id="sop-pdf-prev" title="上一頁">←</button>
        <input class="pdf-reader-page-input" type="number" id="sop-pdf-jump" value="${currentPage}" min="${hasSavedRange?rangeStart:bounds.min}" max="${hasSavedRange?rangeEnd:bounds.max}" aria-label="跳至PDF頁碼">
        <button class="secondary" id="sop-pdf-next" title="下一頁">→</button>
      </div>
      <div class="toolbar-group">
        <button class="secondary" id="sop-pdf-zoom-out" title="縮小">−</button>
        <button class="secondary" id="sop-pdf-fit" title="適合寬度">適合寬度</button>
        <button class="secondary" id="sop-pdf-zoom-in" title="放大">＋</button>
      </div>
      <div class="toolbar-group">
        <button class="secondary" id="sop-pdf-text">文字模式</button>
        <button class="primary" id="sop-pdf-favorite">☆ 加入／設定常用</button>
      </div>
      <span class="pdf-reader-status" id="sop-pdf-status">PDF第 ${rangeStart}～${rangeEnd} 頁</span>
    </div>
    <div class="pdf-reader-stage" id="sop-pdf-stage"><p style="color:#fff;text-align:center;padding:30px;">正在載入PDF…</p></div>
  </div>`;
  document.getElementById('phone').appendChild(overlay);
  const stage=overlay.querySelector('#sop-pdf-stage');
  let pdf=null,zoom=1,renderToken=0,closed=false;

  function updateControls(){
    overlay.querySelector('#sop-pdf-jump').value=currentPage;
    overlay.querySelector('#sop-pdf-prev').disabled=currentPage<=(hasSavedRange?rangeStart:bounds.min);
    overlay.querySelector('#sop-pdf-next').disabled=currentPage>=(hasSavedRange?rangeEnd:bounds.max);
    overlay.querySelector('#sop-pdf-status').textContent=`PDF第 ${rangeStart}～${rangeEnd} 頁｜目前第 ${currentPage} 頁｜${Math.round(zoom*100)}%`;
    overlay.querySelector('#sop-pdf-favorite').textContent='☆ 加入／設定常用';
  }
  function buildFrames(){
    let html='';
    for(let page=rangeStart;page<=rangeEnd;page++){
      html+=`<section class="pdf-page-frame ${page===currentPage?'current':''}" data-pdf-page="${page}">
        <div class="pdf-page-label">PDF第${page}頁</div><div style="color:#636366;padding:70px 50px;text-align:center;">載入中…</div>
      </section>`;
    }
    stage.innerHTML=html;
  }
  async function renderPages(scrollToCurrent=true){
    if(!pdf||closed) return;
    const token=++renderToken;
    buildFrames();updateControls();
    const available=Math.max(280,stage.clientWidth-30);
    for(let pageNum=rangeStart;pageNum<=rangeEnd;pageNum++){
      if(closed||token!==renderToken) return;
      const page=await pdf.getPage(pageNum);
      const base=page.getViewport({scale:1});
      const fit=Math.min(1.65,available/base.width);
      const cssScale=fit*zoom;
      const pixelRatio=Math.min(1.6,window.devicePixelRatio||1);
      const cssViewport=page.getViewport({scale:cssScale});
      const viewport=page.getViewport({scale:cssScale*pixelRatio});
      const canvas=document.createElement('canvas');
      canvas.width=Math.floor(viewport.width);canvas.height=Math.floor(viewport.height);
      canvas.style.width=`${Math.floor(cssViewport.width)}px`;
      canvas.style.height=`${Math.floor(cssViewport.height)}px`;
      const frame=stage.querySelector(`[data-pdf-page="${pageNum}"]`);
      if(!frame) continue;
      frame.style.width=`${Math.floor(cssViewport.width)}px`;
      frame.style.height=`${Math.floor(cssViewport.height)}px`;
      frame.querySelector('div:last-child').replaceWith(canvas);
      await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
      if(closed||token!==renderToken) return;
      try{
        const textContent=await page.getTextContent();
        if(textContent.items?.length){
          const textLayer=document.createElement('div');
          textLayer.className='pdf-text-layer';
          textLayer.style.width=`${Math.floor(cssViewport.width)}px`;
          textLayer.style.height=`${Math.floor(cssViewport.height)}px`;
          frame.appendChild(textLayer);
          await pdfjsLib.renderTextLayer({textContentSource:textContent,container:textLayer,viewport:cssViewport,textDivs:[]}).promise;
        }
      }catch(textError){console.warn('PDF文字圖層無法建立',textError);}
    }
    if(scrollToCurrent&&!closed){
      requestAnimationFrame(()=>stage.querySelector(`[data-pdf-page="${currentPage}"]`)?.scrollIntoView({block:'start'}));
    }
  }
  function goToPage(next){
    const min=hasSavedRange?rangeStart:bounds.min,max=hasSavedRange?rangeEnd:bounds.max;
    const target=Math.min(max,Math.max(min,Number(next)||currentPage));
    currentPage=target;
    if(!hasSavedRange){
      rangeStart=Math.max(bounds.min,currentPage-1);
      rangeEnd=Math.min(bounds.max,currentPage+1);
      renderPages(true);
    }else{
      stage.querySelectorAll('[data-pdf-page]').forEach(el=>el.classList.toggle('current',Number(el.dataset.pdfPage)===currentPage));
      updateControls();
      stage.querySelector(`[data-pdf-page="${currentPage}"]`)?.scrollIntoView({behavior:'smooth',block:'start'});
    }
  }
  overlay.querySelector('#sop-pdf-close').addEventListener('click',()=>{closed=true;renderToken++;overlay.remove();});
  overlay.querySelector('#sop-pdf-prev').addEventListener('click',()=>goToPage(currentPage-1));
  overlay.querySelector('#sop-pdf-next').addEventListener('click',()=>goToPage(currentPage+1));
  overlay.querySelector('#sop-pdf-jump').addEventListener('change',e=>goToPage(e.target.value));
  overlay.querySelector('#sop-pdf-zoom-out').addEventListener('click',()=>{zoom=Math.max(.6,zoom-.15);renderPages(false);});
  overlay.querySelector('#sop-pdf-zoom-in').addEventListener('click',()=>{zoom=Math.min(2,zoom+.15);renderPages(false);});
  overlay.querySelector('#sop-pdf-fit').addEventListener('click',()=>{zoom=1;renderPages(false);});
  overlay.querySelector('#sop-pdf-text').addEventListener('click',()=>{closed=true;renderToken++;overlay.remove();openTextReader(doc.id,currentPage);});
  overlay.querySelector('#sop-pdf-favorite').addEventListener('click',async()=>{
    const item={type:'sop',docId:doc.id,absolutePage:currentPage,startPage:rangeStart,endPage:rangeEnd,title:displayName,sourceTitle:displayName};
    const existing=options.favoriteId?cache.favorites.find(f=>f.id===Number(options.favoriteId)):favoriteFor(item);
    if(await openProcedureNameDialog(item,existing||null)) updateControls();
  });
  stage.addEventListener('click',e=>{
    const frame=e.target.closest('[data-pdf-page]');
    if(!frame) return;
    currentPage=Number(frame.dataset.pdfPage);
    stage.querySelectorAll('[data-pdf-page]').forEach(el=>el.classList.toggle('current',el===frame));
    updateControls();
  });
  try{
    pdf=await pdfjsLib.getDocument({data:rec.data.slice(0)}).promise;
    if(pdf.numPages<bounds.max){bounds.max=pdf.numPages;rangeEnd=Math.min(rangeEnd,pdf.numPages);}
    await renderPages(true);
  }catch(error){
    stage.innerHTML=`<div style="color:#fff;text-align:center;padding:40px 20px;"><p style="font-size:28px;">⚠️</p><p>PDF載入失敗</p><p style="font-size:12px;color:#c7c7cc;">${escapeHtml(String(error?.message||error))}</p></div>`;
  }
}

/* --- Document library tab --- */
function formatFileSize(bytes){
  const n=Number(bytes)||0;
  if(!n) return '未記錄';
  return n>=1048576 ? `${(n/1048576).toFixed(1)} MB` : `${Math.ceil(n/1024)} KB`;
}
function formatUploadDate(value){
  if(!value) return '舊版匯入';
  return new Date(value).toLocaleString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}
async function deletePdfSource(id){
  const related=cache.sopDocs.filter(d=>d.pdfFileId===id);
  if(!confirm(`確定刪除這個PDF及其 ${related.length} 份SOP搜尋資料嗎？`)) return;
  for(const doc of related) await dbDelete('sopDocs',doc.id);
  await dbDelete('pdfFiles',id);
  await reloadCache(); renderLibrary();
}
