function highlightReaderText(text, terms){
  const readable = readablePdfText(text);
  const lower = readable.toLocaleLowerCase();
  const ranges=[];
  terms.forEach(term=>{
    const needle=readablePdfText(term).toLocaleLowerCase();
    if(!needle) return;
    let from=0,idx;
    while((idx=lower.indexOf(needle,from))>=0){
      ranges.push([idx,idx+needle.length]);
      from=idx+Math.max(1,needle.length);
    }
  });
  ranges.sort((a,b)=>a[0]-b[0]);
  const merged=[];
  ranges.forEach(r=>{
    const last=merged[merged.length-1];
    if(last && r[0]<=last[1]) last[1]=Math.max(last[1],r[1]);
    else merged.push([...r]);
  });
  let html='',pos=0;
  merged.forEach(([start,end])=>{
    html+=escapeHtml(readable.slice(pos,start));
    html+=`<span class="highlight">${escapeHtml(readable.slice(start,end))}</span>`;
    pos=end;
  });
  return html+escapeHtml(readable.slice(pos));
}
function stripSopPageHeader(text){
  let source=String(text||'').trim();
  let rawLines=source.split(/\n+/);
  const chapterIndex=rawLines.slice(0,6).findIndex(line=>/章\s*節\s*[:：]/.test(line));
  if(chapterIndex>=0){
    const chapterLine=rawLines[chapterIndex].replace(/\s+/g,' ').trim();
    const afterChapter=chapterLine.split(/章\s*節\s*[:：]/).slice(1).join('').trim();
    const bodyStart=afterChapter.match(/^(?:\d{1,4}\s+)?(\d{1,3}(?:\.\d+)*\.\s*[\u3400-\u9fff][\s\S]*)$/);
    rawLines=rawLines.slice(chapterIndex+1);
    if(bodyStart) rawLines.unshift(bodyStart[1]);
  }else{
    source=source.replace(/^[\s\S]*?文件名稱[\s\S]*?章節\s*[:：]\s*(?:\d{1,3}\s+(?=\d{1,3}\.))?/,'');
    rawLines=source.split(/\n+/);
  }
  return rawLines.map((line,lineIndex)=>{
    let cleaned=line.replace(/\s+/g,' ').trim();
    if(/^(文件名稱|文件編號)\s*[:：]/.test(cleaned)) return '';
    if(/^最新版別\s*[:：]/.test(cleaned)) return '';
    if(/^\d{1,4}$/.test(cleaned)) return '';
    if(/最新版別/.test(cleaned) && /章節/.test(cleaned)){
      cleaned=cleaned.replace(/^.*?章節\s*[:：]?\s*\d+\s*/,'');
    }
    return cleaned;
  }).filter(Boolean);
}
function parenthesisDelta(text){
  let delta=0;
  for(const c of text){ if(c==='('||c==='（') delta++; if(c===')'||c==='）') delta--; }
  return delta;
}
function clauseMarkerResult(line,match,marker,className){
  const raw=match[0],body=line.slice(raw.length).trim();
  if(!body||/^(?:頁|面|項|次|版)$/.test(body)||/^QM[-－—]/i.test(line)) return null;
  return {marker,markerLabel:raw.trim(),className,body};
}
function detectClauseMarker(line,insideParentheses){
  if(insideParentheses) return null;
  let m=line.match(/^(\d{1,2}(?:\.\d{1,2}){1,4})[.、]?\s*(?=\S)/);
  if(m){
    const depth=m[1].split('.').length;
    return clauseMarkerResult(line,m,m[1],depth===2?'level-2':'level-3');
  }
  m=line.match(/^([A-Z](?:\.\d{1,2}){1,3})[.、]?\s*(?=\S)/);
  if(m) return clauseMarkerResult(line,m,m[1],'letter');
  m=line.match(/^(\d{1,2})[.、]\s*(?=\S)/);
  if(m) return clauseMarkerResult(line,m,m[1],'level-1');
  m=line.match(/^([A-Z])(?:[.、]|\s+)(?=\s*[\u3400-\u9fff【（(])/);
  if(m) return clauseMarkerResult(line,m,m[1],'letter');
  m=line.match(/^([一二三四五六七八九十百]{1,4})、\s*(?=\S)/);
  if(m) return clauseMarkerResult(line,m,m[1],'level-1');
  m=line.match(/^([（(])([一二三四五六七八九十百]{1,4}|\d{1,2})[)）]\s*(?=\S)/);
  if(m) return clauseMarkerResult(line,m,`(${m[2]})`,'subitem');
  m=line.match(/^(步驟[一二三四五六七八九十]+)[、：:\s]+(?=\S)/);
  if(m) return clauseMarkerResult(line,m,m[1],'letter');
  return null;
}
function splitInlineStructures(line){
  const candidates=[];
  const patterns=[
    /\d{1,2}(?:\.\d{1,2}){1,4}[.、]?(?=\s*[\u3400-\u9fff【])/g,
    /\d{1,2}[.、](?=\s*[\u3400-\u9fff【])/g,
    /[A-Z][.、](?=\s*[\u3400-\u9fff【（(])/g,
    /[A-Z](?:\.\d{1,2}){1,3}[.、]?(?=\s|[\u3400-\u9fff【])/g,
    /[（(](?:[一二三四五六七八九十百]{1,4}|\d{1,2})[)）](?=\s*[\u3400-\u9fff【])/g,
    /[一二三四五六七八九十百]{1,4}、(?=\s*[\u3400-\u9fff【])/g,
    /步驟[一二三四五六七八九十]+(?=[、：:\s])/g
  ];
  patterns.forEach(pattern=>{
    for(const m of line.matchAll(pattern)){
      if(m.index===0) continue;
      const before=line.slice(0,m.index);
      const prev=before.slice(-4);
      if((before.match(/[（(]/g)||[]).length>(before.match(/[）)]/g)||[]).length) continue;
      if(/(?:見|符合|有關|依據|詳見|參照|依照|比照)\s*$/.test(before)) continue;
      const sentence=before.split(/[。；;！？!?]/).pop()||'';
      if(/(?:符合|有關|依據|依照|詳見|參照|比照)/.test(sentence)&&/\d{1,2}(?:\.\d{1,2})+/.test(sentence)) continue;
      const preceding=line[m.index-1]||'';
      if(!/[\s。；;：:，,）)]/.test(preceding)) continue;
      candidates.push(m.index);
    }
  });
  const points=[0,...new Set(candidates)].sort((a,b)=>a-b);
  return points.map((start,i)=>line.slice(start,points[i+1]??line.length).trim()).filter(Boolean);
}
function repairBrokenClauseLines(sourceLines){
  const repaired=[];
  for(let i=0;i<sourceLines.length;i++){
    let line=String(sourceLines[i]||'').trim();
    if(!line) continue;
    line=line.replace(/^((?:\d{1,2}\s*\.\s*)+\d{1,2})(?=\s|[.、]|$)/,marker=>marker.replace(/\s+/g,''));
    line=line.replace(/^步\s*驟\s*([一二三四五六七八九十百]+)[、：:]\s*/,(_,n)=>`步驟${n}、 `);
    const stepHead=line.match(/^步\s*驟(?:\s+|$)(.*)$/);
    const next=String(sourceLines[i+1]||'').trim().match(/^([一二三四五六七八九十百]+)[、：:]\s*(.*)$/);
    if(stepHead&&next){
      const firstBody=stepHead[1].trim(),secondBody=next[2].trim();
      repaired.push(`步驟${next[1]}、 ${[firstBody,secondBody].filter(Boolean).join(' ')}`.trim());
      i++;
      continue;
    }
    // 短項次若以「符合／依／如／按」等未完成語句結尾，下一行的條號是正文引用，不是新條文。
    const incompleteItem=line.match(/^([A-Z][.、]|[（(](?:\d{1,2}|[一二三四五六七八九十百]+)[)）])\s*(符合|依|依據|如|按|有關)\s*$/);
    const referencedLine=String(sourceLines[i+1]||'').trim();
    if(incompleteItem&&/^\d{1,2}(?:\.\d{1,2}){1,4}\s*\S/.test(referencedLine)){
      repaired.push(`${incompleteItem[1]} ${incompleteItem[2]}${referencedLine}`);
      i++;
      continue;
    }
    repaired.push(line);
  }
  return repaired;
}
function parseSopParagraphs(text){
  const lines=repairBrokenClauseLines(stripSopPageHeader(text)).flatMap(splitInlineStructures);
  const paragraphs=[];
  let current=null,parenDepth=0;
  const pushCurrent=()=>{ if(current?.text) paragraphs.push(current); current=null; };
  lines.forEach(line=>{
    const marker=detectClauseMarker(line,parenDepth>0);
    if(marker){
      pushCurrent();
      current={text:line,body:marker.body,marker:marker.marker,markerLabel:marker.markerLabel,className:marker.className};
      parenDepth=Math.max(0,parenthesisDelta(line));
    }else if(current){
      current.text+=` ${line}`;
      current.body=current.marker?`${current.body} ${line}`:current.text;
      parenDepth=Math.max(0,parenDepth+parenthesisDelta(line));
    }else{
      current={text:line,body:line,marker:null,markerLabel:'',className:'no-marker'};
      parenDepth=Math.max(0,parenthesisDelta(line));
    }
  });
  pushCurrent();
  return paragraphs;
}
function clauseHierarchyDepth(marker,className){
  const value=String(marker||'');
  if(!value) return 0;
  if(/^\d+(?:\.\d+)+$/.test(value)) return Math.min(3,Math.max(1,value.split('.').length-1));
  if(/^\d+$/.test(value)||/^[一二三四五六七八九十百]+$/.test(value)) return 0;
  if(/^[A-Z](?:\.\d+)*$/.test(value)) return Math.min(3,1+(value.split('.').length-1));
  if(/^\(/.test(value)) return 3;
  if(/^步驟/.test(value)) return 2;
  return className==='subitem'?3:className==='letter'?1:0;
}
function formatStructuredSopText(text,terms){
  return parseSopParagraphs(text).map(paragraph=>{
    let content=highlightReaderText(paragraph.body||paragraph.text,terms);
    content=content.replace(/(見|詳見|依照?|參照|比照)(?:第)?((?:\d+(?:\.\d+)+)|(?:[A-Z]\.\d+))/g,
      '$1<span class="reference-chip" data-clause-ref="$2">$2</span>');
    const clauseAttr=paragraph.marker?` data-clause="${escapeHtml(paragraph.marker)}"`:'';
    if(!paragraph.marker) return `<div class="sop-block no-marker">${content}</div>`;
    const depth=clauseHierarchyDepth(paragraph.marker,paragraph.className);
    return `<div class="sop-block ${paragraph.className} depth-${depth}" style="--sop-depth:${depth}"${clauseAttr}><span class="sop-marker">${escapeHtml(paragraph.markerLabel||paragraph.marker)}</span><span class="sop-body">${content}</span></div>`;
  }).join('');
}
function formatPdfTableCell(cell,terms){
  return (cell.runs||[]).map(line=>line.map(run=>{
    const content=highlightReaderText(run.text,terms);
    return run.color==='red'?`<span class="pdf-table-red">${content}</span>`:content;
  }).join(' ')).join('<br>');
}
function formatPdfTableLayout(layout,terms){
  if(!layout?.rows?.length) return '';
  const before=layout.beforeText?formatStructuredSopText(layout.beforeText,terms):'';
  const after=layout.afterText?formatStructuredSopText(layout.afterText,terms):'';
  const rows=layout.rows.map((row,rowIndex)=>`<tr>${row.cells.map(cell=>{
    const tag=rowIndex===0||cell.header?'th':'td';
    return `<${tag}>${formatPdfTableCell(cell,terms)}</${tag}>`;
  }).join('')}</tr>`).join('');
  return `${before}<p class="pdf-table-hint">表格可左右滑動查看完整欄位</p><div class="pdf-table-wrap"><table class="pdf-text-table"><tbody>${rows}</tbody></table></div>${after}`;
}
function formatReaderPageText(page,terms){
  return page.tableLayout?.rows?.length?formatPdfTableLayout(page.tableLayout,terms):formatStructuredSopText(page.formattedText||page.text,terms);
}
function readablePageForCopy(page){
  if(page.tableLayout?.rows?.length){
    const rows=page.tableLayout.rows.map(row=>row.cells.map(cell=>(cell.runs||[]).map(line=>line.map(run=>run.text).join(' ')).join(' ')).join('\t'));
    return [page.tableLayout.beforeText,...rows,page.tableLayout.afterText].filter(Boolean).join('\n');
  }
  return parseSopParagraphs(page.formattedText||page.text).map(p=>p.text).join('\n\n');
}
async function copyTextToClipboard(text){
  try{
    if(navigator.clipboard?.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(_){}
  const area=document.createElement('textarea');
  area.value=text;
  area.style.position='fixed';
  area.style.opacity='0';
  document.body.appendChild(area);
  area.focus();area.select();
  const ok=document.execCommand('copy');
  area.remove();
  return ok;
}
async function ensureDocumentLayoutText(doc){
  if(doc.pages.every(p=>p.formattedText&&p.tableLayoutVersion===3)) return;
  const rec=cache.pdfFiles.find(f=>f.id===doc.pdfFileId);
  if(!rec?.data) return;
  const loading=document.createElement('div');
  loading.className='modal-overlay';
  loading.style.zIndex='80';
  loading.innerHTML=`<div class="modal-sheet" style="height:auto;"><div class="modal-body" style="text-align:center;padding:30px;">
    <div style="font-size:28px;">⏳</div><p>首次整理PDF原始段落，請稍候…</p>
  </div></div>`;
  document.getElementById('phone').appendChild(loading);
  try{
    const pdf=await pdfjsLib.getDocument({data:rec.data.slice(0)}).promise;
    for(const p of doc.pages){
      const pdfPage=await pdf.getPage(p.absolutePage);
      const tc=await pdfPage.getTextContent();
      const viewport=pdfPage.getViewport({scale:1});
      p.formattedText=extractFormattedText(tc,viewport.height);
      p.tableLayout=await extractPdfTableLayout(pdfPage,tc,viewport);
      p.tableLayoutVersion=3;
    }

}
function resolveTextReaderPages(doc,options={}){
  const all=(doc.pages||[]).filter(p=>p.type!=='cover' && !(sopFilter==='content' && isRevisionLikePage(p)));
  const rangeStart=Number(options.startPage),rangeEnd=Number(options.endPage);
  const hasSavedRange=Number.isFinite(rangeStart)&&Number.isFinite(rangeEnd)&&rangeStart<=rangeEnd;
  const eligible=hasSavedRange?all.filter(p=>Number(p.absolutePage)>=rangeStart&&Number(p.absolutePage)<=rangeEnd):all;
  return {eligible,hasSavedRange,rangeStart,rangeEnd};
}
async function openTextReader(docId,absolutePage,targetClause=null,options={}){
  const doc=cache.sopDocs.find(d=>d.id===docId);

  if(currentIndex<0) currentIndex=0;

  overlay.className='modal-overlay';
  overlay.style.zIndex='70';
  overlay.innerHTML=`<div class="modal-sheet" style="height:96%;">
    <div class="modal-header">
      <span style="font-weight:600;font-size:13px;line-height:1.4;padding-right:8px;">${escapeHtml(displayName)}</span>

    <div style="padding:10px 14px;border-top:0.5px solid var(--border);background:var(--card);">

      </div>
      <div class="reader-nav" style="margin-bottom:0;">
        <button class="secondary" id="reader-favorite">☆ 加入常用</button>

      </div>
    </div>

  document.getElementById('phone').appendChild(overlay);
  function draw(){

    let html=hasSavedRange
      ?`<p class="tiny-muted" style="margin:0 0 10px;">常用程序範圍：PDF第 ${rangeStart}～${rangeEnd} 頁，共 ${eligible.length} 頁；藍框為目前頁面。</p>`
      :`<p class="tiny-muted" style="margin:0 0 10px;">顯示命中頁及相鄰頁；藍框為目前頁面。</p>`;

        </div>

    document.getElementById('reader-prev').disabled=currentIndex===0;
    document.getElementById('reader-next').disabled=currentIndex===eligible.length-1;
    const currentSaved={type:'sop',docId:doc.id,absolutePage:eligible[currentIndex].absolutePage,title:displayName};
    document.getElementById('reader-favorite').textContent=favoriteFor(currentSaved)?'★ 已加入常用':'☆ 加入常用';
    document.querySelectorAll('[data-reader-index]').forEach(el=>{
      el.addEventListener('click',e=>{
        if(e.target.closest('button')||window.getSelection()?.toString()) return;
        currentIndex=Number(el.dataset.readerIndex); draw();
      });
    });

      btn.addEventListener('click',async e=>{
        e.stopPropagation();
        const page=eligible[Number(btn.dataset.copyReaderPage)];
        const ok=await copyTextToClipboard(readablePageForCopy(page));
        const original=btn.textContent;
        btn.textContent=ok?'已複製':'複製失敗';
        setTimeout(()=>{if(btn.isConnected)btn.textContent=original;},1200);

      refEl.addEventListener('click',e=>{

          parseSopParagraphs(p.formattedText||p.text).some(paragraph=>paragraph.marker===target)
        );

      document.querySelector('.reader-page.current')?.scrollIntoView({block:'center'});
    });
  }
  document.getElementById('reader-close').addEventListener('click',()=>{
    overlay.remove();
    if(options.onClose) options.onClose(); else if(currentTab==='sop'&&!sopKeyword) render();
  });
  document.getElementById('reader-prev').addEventListener('click',()=>{ if(currentIndex>0){currentIndex--;draw();} });
  document.getElementById('reader-next').addEventListener('click',()=>{ if(currentIndex<eligible.length-1){currentIndex++;draw();} });
  document.getElementById('reader-favorite').addEventListener('click',async()=>{

  });
  draw();
  if(targetClause){
    setTimeout(()=>{
      [...document.querySelectorAll('[data-clause]')].find(el=>el.dataset.clause===targetClause)
        ?.scrollIntoView({behavior:'smooth',block:'center'});
    },120);
  }
}

function filterNoticeCards(){
  const q=String(noticeKeyword||'').trim().toLowerCase(),cat=document.getElementById('notice-filter-cat')?.value||'';
  const matched=[...contentEl.querySelectorAll('[data-notice-card]')].filter(card=>{
    const n=cache.announcements.find(x=>x.id===Number(card.dataset.noticeCard));
    const hay=[n?.title,n?.number,n?.unit,n?.content,n?.note].join(' ').toLowerCase();
    return (!cat||n?.category===cat)&&(!q||hay.includes(q));
  });
  const totalPages=Math.max(1,Math.ceil(matched.length/NOTICE_PAGE_SIZE));noticePage=Math.min(noticePage,totalPages);
  const start=(noticePage-1)*NOTICE_PAGE_SIZE,end=start+NOTICE_PAGE_SIZE;
  contentEl.querySelectorAll('[data-notice-card]').forEach(card=>card.style.display='none');
  matched.slice(start,end).forEach(card=>card.style.display='');
  const status=document.getElementById('notice-page-status');if(status)status.textContent=matched.length?`第 ${start+1}–${Math.min(end,matched.length)} 筆，共 ${matched.length} 筆（${noticePage}/${totalPages}頁）`:'沒有符合的通告';
  const prev=document.getElementById('notice-prev-page'),next=document.getElementById('notice-next-page');if(prev)prev.disabled=noticePage<=1;if(next)next.disabled=noticePage>=totalPages;
}

function parseEventParticipants(raw,defaultStation=''){
  const lines=String(raw||'').replace(/\r/g,'').split('\n');
  const out=[];
  const roleNames=['值班站務專員','值班站務員','值班副站長','值班站長','站務專員','站務員','副站長','站長','保全','清潔人員','清潔'];
  const shiftNames=['小班','早班','日班','夜班','晚班'];
  const stationNames=[...new Set(eventStationOptions().map(r=>r.station).filter(Boolean))];
  let stationContext=defaultStation||'';

    const normalized=line.replace(/[。．.\s]/g,'').replace(/站$/,'');

  };
  for(const rawLine of lines){
    const line=rawLine.trim();

    if(/^([01]?\d|2[0-3]):[0-5]\d(?:[:：][0-5]\d)?\s+/.test(line)) break;

    const heading=resolveStationHeading(line);
    if(heading){stationContext=heading;continue;}

    // 支援：(簡稱XXX)/(以下簡稱XXX)，亦允許沒有簡稱；位置可用「於」或「在」。
    const m=line.match(/^(.*?)(?:[（(](?:以下)?簡稱\s*([^）)]+)[）)])?\s*(?:於|在)\s*(.+?)[。．.]?$/);

}

const RIDERSHIP_LINES = {
  BR:'文湖線', R:'淡水信義線', G:'松山新店線',
  O:'中和新蘆線', BL:'板南線', Y:'環狀線'

const MONTH_LABELS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
function parseRidershipStation(raw){
  const source = String(raw||'').replace(/\s+/g,' ').trim();
  const match = source.match(/^(.*?)\s*[（(]\s*((?:BR|BL|B|R|G|O|Y)\s*\d+[A-Z]?)\s*[)）]\s*$/i);
  if(!match) return {station:source, code:'', lineCode:'', lineName:'未識別線別', stationKey:source};
  const station = match[1].trim();
  let code = match[2].replace(/\s+/g,'').toUpperCase();
  const legacyB=code.match(/^B(\d{1,2})$/);
  if(legacyB&&Number(legacyB[1])>=1&&Number(legacyB[1])<=11) code=`BR${Number(legacyB[1])+13}`;
  if(code==='G01A') code='G03A';
  const prefix = (code.match(/^(BR|BL|R|G|O|Y)/)||[])[1] || '';
  return {station, code, lineCode:prefix, lineName:RIDERSHIP_LINES[prefix]||'未識別線別', stationKey:code||source};
}
function normalizeHeader(value){

function detectWorkbookYear(fileName){
  const western = String(fileName).match(/(?:^|[^\d])((?:19|20)\d{2})(?:[^\d]|$)/);
  if(western) return Number(western[1]);
  const roc = String(fileName).match(/(?:^|[^\d])(\d{3})(?:[^\d]|$)/);
  if(roc && Number(roc[1])>=100 && Number(roc[1])<=199) return Number(roc[1])+1911;

}

function makeLineChart(current, previous, metric, selectedMonth=0){
  const compact=window.innerWidth<600,width=compact?390:Math.max(760,Math.min(window.innerWidth-320,1440)),height=compact?260:Math.max(320,Math.min(window.innerHeight-410,520)),right=compact?10:18,top=24,bottom=40;

  const monthHits=MONTH_LABELS.map((m,i)=>`<rect class="chart-month-hit" data-chart-month="${i+1}" x="${left+i*monthWidth}" y="${top}" width="${monthWidth}" height="${height-top-bottom}" tabindex="0" role="button" aria-label="查看${m}明細"><title>查看${m}明細</title></rect>`).join('');

function makeYoyChart(current, previous){

async function importRidershipWorkbook(file){
  if(typeof XLSX==='undefined') throw new Error('Excel 解析元件未載入，請確認程式檔與必要元件完整後重新開啟。');
  const guessedYear=detectWorkbookYear(file.name);
  const input=prompt('請確認資料年度（西元年）', guessedYear||new Date().getFullYear());
  if(input===null) return;
  const year=Number(input);
  if(!Number.isInteger(year)||year<2000||year>2200) throw new Error('年度格式錯誤，請輸入例如 2025。');
  const workbook=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:false});
  const accepted=workbook.SheetNames.filter(n=>/^(0[1-9]|1[0-2])$/.test(n));
  const ignored=workbook.SheetNames.filter(n=>!accepted.includes(n));
  const missing=Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0')).filter(n=>!accepted.includes(n));
  const rows=[], warnings=[];let excludedY=0,unknownCode=0;
  accepted.forEach(month=>{
    const grid=XLSX.utils.sheet_to_json(workbook.Sheets[month],{header:1,defval:null,raw:true});
    let headerRow=-1, stationCol=-1, averageCol=-1;
    for(let r=0;r<Math.min(grid.length,15);r++){
      const normalized=(grid[r]||[]).map(normalizeHeader);
      const s=normalized.findIndex(h=>h.includes('車站名稱')||h==='站名'||h==='車站');
      const a=normalized.findIndex(h=>h.includes('平均日運量')||h.includes('日平均運量')||h.includes('平均每日運量'));
      if(s>=0&&a>=0){headerRow=r;stationCol=s;averageCol=a;break;}
    }
    if(headerRow<0){warnings.push(`${month}：找不到「車站名稱／平均日運量」欄位`);return;}
    for(let r=headerRow+1;r<grid.length;r++){

  contentEl.innerHTML=`<div class="ridership-query-shell"><div class="ridership-module-tabs"><button class="ridership-module-tab active">運量查詢</button><button class="ridership-module-tab" data-ridership-section="manage">資料管理</button></div><div class="panel"><div class="ridership-query-header"><div class="ridership-filter-grid"><div class="field" style="margin:0"><label>年度</label><select id="ridership-year">${yearOptions}</select></div><div class="field" style="margin:0"><label>範圍</label><select id="ridership-scope">${scopeOptions}</select></div><div class="field" style="margin:0"><label>車站</label><select id="ridership-station">${stationOptions}</select></div><div class="field" style="margin:0"><label>月份</label><select id="ridership-rank-month">${monthOptions}</select></div></div></div>${detailTabs}</div></div>${body}`;
  contentEl.querySelector('[data-ridership-section="manage"]').onclick=()=>{ridershipView.section='manage';renderRidership();};contentEl.querySelectorAll('[data-ridership-detail]').forEach(btn=>btn.onclick=()=>{ridershipView.detailSection=btn.dataset.ridershipDetail;renderRidership();});contentEl.querySelectorAll('[data-rank-band]').forEach(btn=>btn.onclick=()=>{ridershipView.rankBand=btn.dataset.rankBand;renderRidership();});contentEl.querySelectorAll('[data-ridership-bin]').forEach(btn=>btn.onclick=()=>openRidershipDistributionList(scopeRows,btn.dataset.ridershipBin,stationKey,ranked));document.getElementById('ridership-year').onchange=e=>{ridershipView.year=e.target.value;ridershipView.rankMonth='';renderRidership();};document.getElementById('ridership-scope').onchange=e=>{ridershipView.rankScope=e.target.value;ridershipView.stationKey='';renderRidership();};document.getElementById('ridership-station').onchange=e=>{ridershipView.stationKey=e.target.value;renderRidership();};document.getElementById('ridership-rank-month').onchange=e=>{ridershipView.rankMonth=e.target.value;renderRidership();};contentEl.querySelectorAll('[data-chart-month]').forEach(hit=>{const open=()=>{ridershipView.rankMonth=String(hit.dataset.chartMonth).padStart(2,'0');ridershipView.detailSection='monthly';renderRidership();};hit.onclick=open;hit.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}};});

/* --- Data management (export/import) --- */
function bufToBase64(buf){
  let binary=''; const bytes = new Uint8Array(buf);
  const chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    binary += String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
  }
  return btoa(binary);
}
function base64ToBuf(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return bytes.buffer;
}
async function exportData(){
  const dump = {};
  for(const name of STORES){
    const rows = await dbGetAll(name);
    dump[name] = rows.map(r=>{
      if(name==='pdfFiles') return {...r, data: bufToBase64(r.data)};
      return r;
    });
  }
  dump._localData={ridershipEvents:ridershipEvents()};
  const blob = new Blob([JSON.stringify(dump)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `station-assistant-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
  localStorage.setItem('stationAssistantLastBackup',new Date().toLocaleString('zh-TW'));
}
async function importData(file){
  const text = await file.text();
  const dump = JSON.parse(text);
  for(const name of STORES){
    if(!dump[name]) continue;
    for(const row of dump[name]){
      const copy = {...row};
      delete copy.id;
      if(name==='pdfFiles') copy.data = base64ToBuf(copy.data);
      await dbAdd(name, copy);
    }
  }
  if(Array.isArray(dump._localData?.ridershipEvents))saveRidershipEvents(dump._localData.ridershipEvents);
  await reloadCache();
  render();
}

      <input type="file" id="dm-import-input" accept="application/json" style="display:none">
    </div>
  </div></div>`;
  contentEl.insertAdjacentHTML('beforeend', html);
  document.getElementById('dm-close').addEventListener('click', ()=>document.getElementById('dm-overlay').remove());
  document.getElementById('dm-transfer-export').addEventListener('click', exportProcedures);

  document.getElementById('dm-export').addEventListener('click', exportData);

    const file = e.target.files[0];

    if(confirm('匯入的資料會加進目前資料庫（不會清除既有資料），確定匯入嗎？')){
      await importData(file);
      document.getElementById('dm-overlay').remove();
    }
  });
}
