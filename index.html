<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101d33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="站務助手">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<title>站務工作助手｜手機離線版</title>
<script src="./vendor/pdf.min.js?v=5.14.0"></script>
<script src="./vendor/xlsx.full.min.js?v=5.14.0"></script>
<style>
  :root{
    --bg:#f1f4f8; --card:#ffffff; --border:#dce3ec; --border-strong:#bcc8d7;
    --text:#172235; --text-2:#56657a; --text-muted:#7d8a9d;
    --accent:#1467b8; --accent-bg:#e8f2fc; --accent-text:#0b4f91;
    --danger:#b52a32; --danger-bg:#fcebec; --signal:#e5b700;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#d1d1d6;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--text);display:flex;justify-content:center;padding:24px 0;min-height:100vh;}
  #phone{
    width:390px; height:820px; background:var(--bg); border-radius:38px; border:7px solid #1c1c1e;
    box-shadow:0 12px 40px rgba(0,0,0,0.25); overflow:hidden; display:flex; flex-direction:column; position:relative;
  }
  #topbar{
    height:56px; flex-shrink:0; background:rgba(249,249,249,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:0.5px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; padding:0 16px;
  }
  #topbar h1{font-size:17px;font-weight:650;margin:0;}
  #topbar button{background:none;border:none;font-size:20px;color:var(--text-2);cursor:pointer;padding:4px;}
  #content{flex:1; overflow-y:auto; padding:14px;}
  #tabbar{
    height:68px;flex-shrink:0;background:rgba(249,249,249,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:0.5px solid var(--border);
    display:flex; align-items:stretch;
  }
  .desktop-brand,.desktop-version{display:none;}
  .tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:var(--text-muted);font-size:11px;cursor:pointer;}
  .tab-btn.active{color:var(--accent);}
  .tab-btn .icon{font-size:20px;}


  .event-kind-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.event-kind{min-height:42px;border:.5px solid var(--border-strong);border-radius:11px;background:#fff;font-size:13px;color:var(--text-2)}.event-kind.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-text);font-weight:650}
  .event-bad{color:#c62828!important;font-weight:750}.event-good{color:#14733b!important;font-weight:700}.event-editor-sheet{height:92%;max-width:900px}.event-raw-input{min-height:220px}.event-timeline{position:relative;margin:8px 0 12px 8px;padding-left:19px;border-left:2px solid #b8d3ec}.event-time-row{position:relative;background:#fff;border:.5px solid var(--border);border-radius:11px;padding:10px 11px;margin:0 0 9px}.event-time-row:before{content:"";position:absolute;left:-26px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 1px var(--accent)}.event-time{font-size:12px;font-weight:750;color:var(--accent-text);margin-bottom:4px}.event-body{font-size:13px;line-height:1.65;color:var(--text)}.event-edit-grid{display:grid;grid-template-columns:100px 1fr;gap:8px}.event-edit-grid textarea{min-height:74px}.event-person-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px;margin-bottom:7px}.event-person-card{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:.5px solid var(--border)}.event-person-card:last-child{border-bottom:0}.event-person-card span{font-size:12px;color:var(--text-2)}.event-summary-card{border-left:4px solid var(--accent)}.event-raw{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.65;color:var(--text-2)}
  @media(max-width:700px){.event-person-row{grid-template-columns:1fr 1fr}.event-edit-grid{grid-template-columns:1fr}.event-editor-sheet{height:94%}}


  .desktop-search-status{position:sticky;top:0;z-index:14;display:flex;align-items:center;gap:10px;padding:9px 12px;margin:0 0 10px;border:1px solid rgba(20,103,184,.18);border-radius:10px;background:rgba(255,255,255,.97);box-shadow:0 5px 16px rgba(16,29,51,.08);backdrop-filter:blur(10px)}.desktop-search-status .key{min-width:0;flex:1;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.desktop-search-status .count{font-size:12px;color:var(--text-muted);white-space:nowrap}.viewed-badge{font-size:10px;color:#667487;background:#eef2f6;border-radius:999px;padding:3px 7px;white-space:nowrap;font-weight:500}

  .event-toolbar-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 10px}
  .event-tabs{display:flex;gap:18px;align-items:center;border-bottom:.5px solid var(--border);flex:1}
  .event-tab{appearance:none;border:0;background:transparent;padding:10px 2px 9px;font-size:14px;color:var(--text-2);cursor:pointer;border-bottom:3px solid transparent}
  .event-tab.active{color:var(--accent-text);font-weight:750;border-bottom-color:var(--accent)}
  .event-add-btn{flex:0 0 auto;min-height:38px!important;padding:7px 14px!important;font-size:14px!important}
  .event-filter-bar{display:grid;grid-template-columns:minmax(300px,2.3fr) 150px 180px 150px 170px auto;gap:8px;align-items:center;padding:10px;background:rgba(255,255,255,.58);border:.5px solid var(--border);border-radius:13px;margin-bottom:7px}
  .event-filter-bar input,.event-filter-bar select{min-height:40px;padding:7px 10px;font-size:14px;margin:0}
  .event-filter-bar .filter-clear{min-height:40px;padding:7px 11px;white-space:nowrap}
  .event-filter-summary{font-size:11px;color:var(--text-muted);margin:0 2px 9px}
  .event-list-card{padding:9px 13px;margin-bottom:7px;cursor:pointer;transition:border-color .15s ease,background .15s ease}
  .event-list-card:hover{border-color:rgba(20,103,184,.28);background:#fbfdff}
  .event-list-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:5px}
  .event-list-date{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}
  .event-list-main{display:flex;align-items:center;gap:8px;min-width:0}
  .event-list-station{font-weight:750;font-size:14px;white-space:nowrap}
  .event-list-sep{color:#b0b9c4}
  .event-list-subject{font-size:14px;color:var(--text);font-weight:520;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .event-list-actions{display:flex;gap:6px;flex:0 0 auto}
  .event-action{min-height:30px!important;padding:4px 10px!important;border-radius:8px!important;font-size:12px!important}
  .event-delete{background:#fff7f7!important;border:.5px solid #efb9b9!important;color:#b42318!important}
  @media(max-width:1100px){.event-filter-bar{grid-template-columns:2fr 1fr 1fr}.event-list-subject{white-space:normal}.event-toolbar-head{align-items:flex-end}}


  .event-list-card.compact{padding:8px 12px;margin-bottom:6px}
  .event-list-one{display:grid;grid-template-columns:92px minmax(90px,130px) auto minmax(260px,1fr) auto;align-items:center;gap:9px;min-height:36px}
  .event-list-one .event-list-date{margin:0}
  .event-list-one .event-list-subject{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .event-period-wrap{display:flex;gap:6px;align-items:center;min-width:0}
  .event-period-wrap select,.event-period-wrap input{min-width:0}
  .event-improvement{min-height:110px}
  @media(max-width:1100px){.event-list-one{grid-template-columns:88px 110px auto 1fr auto}.event-filter-bar{grid-template-columns:2fr 1fr 1fr}.event-period-wrap{grid-column:span 2}}


  .event-participants:not(.editing){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 10px}
  .event-participants:not(.editing) .event-person-card{border:.5px solid var(--border);border-radius:10px;padding:8px 10px;display:flex;gap:9px;align-items:baseline;min-width:0}
  .event-participants:not(.editing) .event-person-card span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .event-checks{display:grid;gap:8px}
  .event-check-row{display:grid;grid-template-columns:minmax(220px,1.6fr) 110px 110px 120px 120px 42px;gap:7px;align-items:center}
  .event-check-row input,.event-check-row select{min-height:38px;padding:7px 8px}
  .event-check-duration{font-size:12px;font-weight:700;color:var(--accent-text);text-align:center;white-space:nowrap}
  .event-check-result.ok{color:#137333;font-weight:700}.event-check-result.ng{color:#c62828;font-weight:700}
  .event-check-view{display:grid;grid-template-columns:minmax(240px,1fr) auto auto auto;gap:10px;align-items:center;padding:9px 10px;border-bottom:.5px solid var(--border)}
  .event-check-view:last-child{border-bottom:0}
  .event-detail-priority{border-left:4px solid var(--accent)}


  .event-person-row{grid-template-columns:150px 1.05fr .9fr .95fr 1.2fr}
  .event-participant-station{font-weight:750;color:var(--accent-text);margin:5px 0 6px;font-size:13px}
  .event-participant-group{margin-bottom:10px}
  .event-participant-group:last-child{margin-bottom:0}
  .event-participants:not(.editing){display:block}
  .event-participant-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 10px}
  .event-participant-grid .event-person-card{border:.5px solid var(--border);border-radius:10px;padding:8px 10px;display:flex;gap:9px;align-items:baseline;min-width:0}
  .event-participant-grid .event-person-card span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .ridership-module-tabs{grid-column:1/-1;width:100%;margin:0 0 10px;padding:0 2px}
  .ridership-filter-grid .ridership-module-tabs{grid-column:1/-1}

  .ridership-module-tabs{display:flex;gap:18px;align-items:center;border-bottom:.5px solid var(--border);margin-bottom:12px}
  .ridership-module-tab{appearance:none;border:0;background:transparent;padding:10px 2px 9px;font-size:14px;color:var(--text-2);cursor:pointer;border-bottom:3px solid transparent}
  .ridership-module-tab.active{color:var(--accent-text);font-weight:750;border-bottom-color:var(--accent)}


  /* v2.21.1：SOP 內容定位、OP 可讀性與固定操作 */
  .sop-slot-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 2px 12px}
  .sop-slot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}
  .sop-slot-card{margin:0;padding:15px 16px;min-height:154px;display:flex;flex-direction:column;justify-content:space-between}
  .sop-slot-title{font-size:15px;font-weight:760;line-height:1.45;margin:0}
  .sop-slot-status{font-size:11px;font-weight:700;border-radius:999px;padding:4px 8px;white-space:nowrap;background:#eef5fb;color:var(--accent-text)}
  .sop-slot-status.missing{background:#f2f2f7;color:var(--text-2)}
  .sop-slot-file{font-size:12px;line-height:1.55;color:var(--text-2);word-break:break-all;margin:9px 0 5px}
  .sop-slot-meta{font-size:12px;line-height:1.6;color:var(--text-muted);margin:0 0 11px}
  .sop-slot-actions{display:flex;justify-content:flex-end}
  .sop-slot-warning{padding:10px 12px;border-radius:10px;background:#fff8e8;color:#7a5414;font-size:12px;line-height:1.6;margin-bottom:12px}
  .procedure-review-badge{display:inline-block;margin-top:6px;font-size:10px;font-weight:700;color:#8a5b00;background:#fff1c7;border-radius:999px;padding:3px 7px}
  .op-detail-btn{min-width:44px}
  .op-detail-btn.has-data{background:#e9f3ff!important;border-color:#9fc8ef!important;color:var(--accent-text)!important;font-weight:750}
  .event-time{font-size:14px!important;font-weight:780!important;line-height:1.35}
  .event-body{font-size:14px!important;line-height:1.58!important}
  .event-time-row{padding:11px 12px!important;margin-bottom:10px!important}
  .event-detail-priority .event-check-name,.event-check-row,.event-check-view{font-size:14px}
  .event-person-card span{font-size:13px!important;line-height:1.5}
  .event-raw{font-size:13.5px!important;line-height:1.7!important}
  .ridership-query-shell>.ridership-module-tabs{margin:0 0 12px!important}
  @media(max-width:900px){.sop-slot-grid{grid-template-columns:1fr}}

  .procedure-review-badge.auto{color:#075fa8;background:#e7f3ff}
  .procedure-review-badge.changed{color:#8a5b00;background:#fff1c7}
  .procedure-review-badge.unmatched{color:#a12622;background:#ffe9e7}
  .search-group-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 8px}
  .search-group-count{font-size:11px;font-weight:700;color:var(--accent-text);background:#eaf4ff;border-radius:999px;padding:3px 8px}
  .search-hit-list{display:grid;gap:6px;margin-top:8px}
  .search-hit-row{width:100%;border:0;border-left:3px solid #b8d8f4;border-radius:8px;background:#f8f8f6;padding:8px 10px;text-align:left;cursor:pointer;color:var(--text)}
  .search-hit-row:hover{background:#f2f6fa}
  .search-hit-head{font-size:11px;font-weight:750;color:var(--accent-text);margin-bottom:3px}
  .search-hit-text{font-size:13px;line-height:1.55}
  .search-more-hits{font-size:11px;color:var(--text-muted);margin:5px 2px 0}

  .event-action.op-has-data{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important;font-weight:750}
  .op-records{display:grid;gap:10px}
  .op-record-row{display:grid;grid-template-columns:54px minmax(0,1fr);column-gap:10px;align-items:start}
  .op-record-time{font-size:14px;font-weight:780;line-height:1.65;color:var(--accent-text);font-variant-numeric:tabular-nums}
  .op-record-body{font-size:15px;line-height:1.65;color:var(--text);white-space:pre-wrap;word-break:break-word}
  .op-record-preamble{font-size:15px;line-height:1.65;color:var(--text);white-space:pre-wrap;word-break:break-word;margin-bottom:10px}
  .card{background:var(--card);border:0.5px solid var(--border);border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.035);}
  .row{display:flex;align-items:center;gap:8px;}
  .between{justify-content:space-between;}
  .muted{color:var(--text-2);font-size:12px;}
  .tiny-muted{color:var(--text-muted);font-size:11px;}
  input, select, textarea{
    width:100%;border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 12px;min-height:44px;
    font-size:16px;background:#fff;color:var(--text);font-family:inherit;outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,122,255,.13);}
  textarea{resize:vertical;min-height:70px;}
  label{font-size:12px;color:var(--text-2);display:block;margin-bottom:4px;}
  .field{margin-bottom:10px;}
  button.primary{
    background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:10px 14px;min-height:44px;
    font-size:15px;font-weight:600;cursor:pointer;
  }
  button.secondary{
    background:#fff; color:var(--text); border:0.5px solid var(--border-strong); border-radius:var(--radius);
    padding:9px 14px;min-height:44px;font-size:14px;cursor:pointer;
  }
  button.danger-text{background:none;border:none;color:var(--danger);font-size:13px;cursor:pointer;padding:4px;}
  .chip{font-size:12px;padding:4px 10px;border-radius:999px;border:0.5px solid var(--border-strong);color:var(--text-2);cursor:pointer;white-space:nowrap;}
  .chip.active{background:var(--accent-bg);color:var(--accent-text);border-color:var(--accent-bg);}
  .chips-row{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;}
  .empty{text-align:center;padding:60px 20px;color:var(--text-muted);}
  .empty .icon{font-size:36px;margin-bottom:10px;}
  .highlight{color:var(--accent-text);font-weight:500;}
  .search-summary{margin:2px 0 10px;color:var(--text-2);font-size:12px;}
  .search-doc-title{font-size:13px;font-weight:600;line-height:1.45;flex:1;}
  .search-page-badge{font-size:11px;color:var(--accent-text);background:var(--accent-bg);border-radius:999px;padding:3px 8px;white-space:nowrap;}
  .search-snippet{font-size:13px;line-height:1.7;color:var(--text-2);margin:8px 0 0;padding:8px 10px;background:#f7f6f2;border-radius:8px;border-left:3px solid #b5d4ef;}
  .search-keywords{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 10px;}
  .search-keyword{font-size:11px;color:var(--accent-text);background:var(--accent-bg);border-radius:999px;padding:3px 8px;}
  .search-field{position:relative;margin-bottom:10px;}
  .search-field input{padding-left:38px;padding-right:42px;background:#e9e9ee;border:none;}
  .search-field .search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:15px;pointer-events:none;}
  .search-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:27px;height:27px;min-height:0;padding:0;border:0;border-radius:50%;background:#8e8e93;color:white;font-size:16px;line-height:27px;cursor:pointer;}
  .reader-page{background:#fff;border:0.5px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;}
  .reader-page.current{border:1.5px solid var(--accent);background:#f6fbff;}
  .reader-page-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:var(--text-2);}
  .reader-text{font-size:14px;line-height:1.85;white-space:pre-wrap;word-break:break-word;margin:0;color:var(--text);user-select:text;-webkit-user-select:text;}
  .reader-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
  .sop-block{--sop-depth:0;font-size:14px;line-height:1.8;margin:0 0 7px calc(var(--sop-depth) * 16px);padding:2px 0;display:grid;grid-template-columns:72px minmax(0,1fr);align-items:start;gap:9px;background:transparent;}
  .sop-block.no-marker{display:block;margin-left:0;padding:3px 0 5px 81px;background:transparent;}
  .sop-block.depth-1,.sop-block.depth-2,.sop-block.depth-3{padding-left:0;border-left:0;}
  .sop-marker{color:#075fac;font-weight:650;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .sop-body{min-width:0;color:var(--text);font-weight:400;}
  .sop-block.level-1 .sop-marker,.sop-block.level-2 .sop-marker{font-weight:750;}
  .reader-text .highlight{background:#fff0a6;color:inherit;font-weight:500;padding:0 1px;border-radius:2px;}
  .pdf-table-wrap{width:100%;overflow-x:auto;margin:8px 0 12px;border:1px solid #9aa8b8;border-radius:8px;background:#fff;}
  .pdf-text-table{width:100%;min-width:820px;border-collapse:collapse;table-layout:fixed;font-size:14px;line-height:1.55;color:var(--text);}
  .pdf-text-table th,.pdf-text-table td{border:1px solid #9aa8b8;padding:9px 10px;vertical-align:top;white-space:normal;word-break:break-word;background:#fff;}
  .pdf-text-table th{background:#fff4a8;color:#172235;font-weight:700;text-align:center;}
  .pdf-text-table td:first-child{font-weight:650;background:#f3f7fb;text-align:center;vertical-align:middle;}
  .pdf-table-red{color:#d93025;font-weight:500;}
  .pdf-table-intro{font-size:14px;line-height:1.65;margin:0 0 8px;color:var(--text-2);white-space:pre-wrap;}
  .pdf-table-hint{font-size:12px;color:var(--text-muted);margin:0 0 6px;}
  .scenario-tag{display:inline-block;font-size:11px;font-weight:600;color:#854f0b;background:#faeeda;padding:2px 7px;border-radius:999px;margin-right:5px;}
  .reference-chip{display:inline-block;color:#005bb5;background:#eaf4ff;border:0;border-radius:999px;padding:1px 6px;margin:0 2px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;}
  .shortcut-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .shortcut-card{background:#fff;border:0.5px solid var(--border);border-radius:13px;padding:11px;min-height:72px;cursor:pointer;position:relative;}
  .shortcut-title{font-size:13px;font-weight:600;line-height:1.35;margin:0 24px 5px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .shortcut-meta{font-size:11px;color:var(--text-muted);margin:0;}
  .favorite-btn{border:0;background:none;color:var(--accent);font-size:21px;line-height:1;padding:4px;min-height:0;cursor:pointer;flex-shrink:0;}

  .import-review-sheet{height:min(760px,88vh);max-height:88vh;}

  .import-review-title{text-align:center;font-size:14px;font-weight:650;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .import-review-action{min-height:38px;padding:7px 10px;border:0;border-radius:9px;font-size:14px;font-weight:650;cursor:pointer;}
  .import-review-cancel{background:transparent;color:var(--text-2);text-align:left;}
  .import-review-confirm{background:var(--accent);color:#fff;text-align:center;}
  .import-review-body{min-height:0;overscroll-behavior:contain;}
  .doc-review-item{border:0.5px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff;}
  #pdf-canvas-wrap{display:flex;justify-content:center;padding:8px;background:#3a3a38;}
  canvas{max-width:100%;height:auto;background:#fff;}
  .pdf-reader-shell{height:96%;max-height:96%;}
  .pdf-reader-toolbar{padding:9px 12px;border-bottom:.5px solid var(--border);background:var(--card);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pdf-reader-toolbar .toolbar-group{display:flex;align-items:center;gap:6px;}
  .pdf-reader-toolbar button{min-height:36px;padding:6px 10px;}
  .pdf-reader-page-input{width:74px;min-height:36px;padding:6px 8px;font-size:14px;text-align:center;}
  .pdf-reader-status{font-size:12px;color:var(--text-2);margin-left:auto;white-space:nowrap;}
  .pdf-reader-stage{background:#30343b;overflow:auto;flex:1;padding:18px 12px;scroll-behavior:smooth;}
  .pdf-page-frame{width:fit-content;max-width:100%;margin:0 auto 18px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.28);position:relative;}
  .pdf-page-frame.current{outline:3px solid var(--accent);outline-offset:3px;}
  .pdf-page-label{position:sticky;top:4px;z-index:2;width:max-content;margin:0 0 -30px 8px;padding:5px 9px;border-radius:999px;background:rgba(28,28,30,.78);color:#fff;font-size:11px;backdrop-filter:blur(8px);}
  .pdf-page-frame canvas{display:block;max-width:none;}
  .pdf-text-layer{position:absolute;inset:0;overflow:hidden;line-height:1;opacity:1;z-index:1;pointer-events:auto;}
  .pdf-text-layer span,.pdf-text-layer br{position:absolute;color:transparent;white-space:pre;transform-origin:0 0;cursor:text;}
  .pdf-text-layer ::selection{background:rgba(0,122,255,.3);}
  .procedure-range-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .procedure-range-help{margin:8px 0 0;padding:9px 10px;border-radius:9px;background:var(--accent-bg);color:var(--accent-text);font-size:11px;line-height:1.6;}
  .procedure-heading{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 8px;}
  .procedure-heading h2{font-size:15px;margin:0;}
  .procedure-card-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px;}
  .procedure-card{position:relative;min-height:76px;border:0;border-radius:13px;padding:14px 30px 14px 12px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.07);color:#17324d;transition:transform .14s ease,box-shadow .14s ease,opacity .14s ease;user-select:none;}
  .procedure-card:active{cursor:grabbing;}
  .procedure-card.dragging{opacity:.42;transform:scale(.97);}

  .procedure-card-name{font-size:14px;font-weight:700;line-height:1.4;margin:0;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .procedure-card-menu{position:absolute;right:7px;top:7px;width:28px;height:28px;min-height:0;border:0;border-radius:50%;background:rgba(255,255,255,.62);color:#334155;font-size:18px;line-height:1;cursor:pointer;}
  .procedure-blue{background:#dceeff}.procedure-green{background:#dff4e7}.procedure-orange{background:#ffead2}.procedure-purple{background:#eee4ff}.procedure-red{background:#ffe1e1}.procedure-gray{background:#e9ebef}
  .color-options{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px;}
  .color-choice{width:36px;height:36px;min-height:0;border:3px solid transparent;border-radius:50%;cursor:pointer;}
  .color-choice.selected{border-color:#1c1c1e;box-shadow:0 0 0 2px #fff inset;}
  .recent-searches{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 14px;}
  .recent-search-item{display:inline-flex;align-items:center;background:#fff;border:.5px solid var(--border);border-radius:999px;overflow:hidden;}
  .recent-search-use,.recent-search-remove{border:0;background:transparent;min-height:34px;cursor:pointer;color:var(--text-2);}
  .recent-search-use{padding:6px 4px 6px 11px;font-size:12px;}.recent-search-remove{padding:4px 9px 4px 5px;color:var(--text-muted);font-size:15px;}
  .match-label{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:650;margin-right:5px;background:#eaf2ff;color:#1d5fa7;}
  .match-label.synonym{background:#f1ebff;color:#6842a6;}.match-label.notice{background:#fff1df;color:#92540a;}
  .procedure-heading-actions{display:flex;gap:7px;align-items:center;}
  .procedure-heading-actions button{min-height:34px;padding:6px 10px;font-size:12px;}
  .notice-grid{display:grid;grid-template-columns:1fr;gap:8px;}
  .notice-card{margin:0;min-width:0;padding:12px 14px;}
  .notice-list-main{display:grid;grid-template-columns:minmax(220px,1.25fr) minmax(260px,1.75fr) auto;gap:14px;align-items:center;}
  .notice-list-title{font-weight:650;font-size:14px;line-height:1.4;margin:0 0 5px;}
  .notice-list-summary{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;}
  .notice-pagination{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 4px;}
  .notice-pagination button{min-height:36px;padding:6px 12px;}
  .notice-meta{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0;}
  .notice-tag{font-size:11px;padding:3px 8px;border-radius:999px;background:#eef3fb;color:#34506e;}
  .page-tabs{display:flex;gap:4px;background:#e9ebf0;border-radius:11px;padding:3px;margin-bottom:14px;width:max-content;max-width:100%;}
  .page-tab{border:0;background:transparent;color:var(--text-2);border-radius:8px;min-height:36px;padding:7px 16px;font:600 13px inherit;cursor:pointer;}
  .page-tab.active{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12);}
  .settings-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
  .settings-card{margin:0;cursor:pointer;}
  .version-info{display:grid;grid-template-columns:88px minmax(0,1fr);gap:7px 10px;margin-top:10px;font-size:12px;line-height:1.55;}
  .version-info dt{color:var(--text-2);}.version-info dd{margin:0;font-weight:600;}
  .annotation-layer{position:absolute;inset:0;z-index:3;pointer-events:none;}
  .annotation-layer.tools-open{pointer-events:auto;touch-action:pan-x pan-y pinch-zoom;}
  .annotation-layer.drawing{cursor:crosshair;touch-action:none;}
  .annotation-mark{position:absolute;pointer-events:none;border-radius:2px;}
  .annotation-layer.tools-open .annotation-mark{pointer-events:auto;cursor:pointer;}
  .annotation-mark.selected{outline:2px solid #007aff;outline-offset:2px;}
  .annotation-mark.highlight{background:rgba(255,220,0,.38);}
  .annotation-mark.underline{border-bottom:4px solid rgba(220,35,35,.9);}
  .annotation-draft{position:absolute;border:2px dashed #ff9f0a;background:rgba(255,220,0,.24);pointer-events:none;}
  .annotation-draft.underline{border:0;border-bottom:4px solid rgba(220,35,35,.9);background:transparent;}
  .annotation-tools{display:none;gap:6px;align-items:center;flex-wrap:wrap;padding:7px 12px;background:#fff8e8;border-bottom:.5px solid #ead7aa;}

  /* ---------- 專業桌面版（不更動PDF與資料庫核心） ---------- */
  .section-title{font-size:18px;font-weight:700;margin:0 0 4px;}
  .section-subtitle{font-size:13px;color:var(--text-2);margin:0;}
  .toolbar-card{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .toolbar-actions{display:flex;gap:8px;flex-wrap:wrap;}

  .panel{background:#fff;border:.5px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.035);margin-bottom:12px;}
  .panel-title{font-size:15px;font-weight:700;margin:0 0 3px;}
  .panel-note{font-size:12px;color:var(--text-2);margin:0 0 12px;}
  .filter-grid{display:grid;grid-template-columns:1fr 1.5fr 1fr auto;gap:10px;align-items:end;}
  .ridership-filter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end;}
  .rank-columns{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .rank-list{margin:0;padding:0;list-style:none;}

  .rank-station{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rank-line{font-size:11px;color:var(--text-muted);margin-top:2px;}
  .rank-value{text-align:right;font-size:12px;font-variant-numeric:tabular-nums;}
  .chart-wrap{width:100%;overflow:hidden;}
  .chart-wrap svg{display:block;width:100%;height:auto;}
  .chart-month-hit{cursor:pointer;fill:transparent;}
  .chart-month-hit:focus{fill:rgba(255,210,0,.12);outline:none;}
  .ridership-unit{font-size:.52em;font-weight:650;margin-left:3px;color:var(--text-2);}
  .selected-month-row{background:#fff8d8;box-shadow:inset 3px 0 #e2b900,inset -3px 0 #e2b900;}
  .selected-rank-item{background:#fff8d8;border:1.5px solid #e2b900;border-radius:10px;padding-left:7px;padding-right:7px;}
  .chart-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin:4px 0 10px;}
  .legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;}

  .data-table td{text-align:right;padding:9px;border-bottom:.5px solid var(--border);font-variant-numeric:tabular-nums;}
  .distribution-list{display:grid;gap:11px;margin-top:14px;}
  .rank-band-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#e9ebf0;border-radius:10px;padding:3px;margin:0 0 14px;}

  .rank-band-tabs button.active{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12);}
  .distribution-row{display:grid;grid-template-columns:130px minmax(0,1fr) 110px;align-items:center;gap:12px;font-size:14px;width:100%;border:0;background:transparent;color:var(--text);padding:6px 0;text-align:left;}
  .distribution-track{display:block;height:13px;background:#e7edf5;border-radius:999px;overflow:hidden;}

  .distribution-value{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-2);}
  .positive{color:#218739}.negative{color:#c43b32}.neutral{color:var(--text-2)}
  .import-report{background:#f7f7fa;border-radius:12px;padding:11px 12px;font-size:12px;line-height:1.7;color:var(--text-2);margin-top:10px;}
  .segmented{display:flex;background:#eeeeF3;border-radius:9px;padding:2px;}

<script>
/* v5.15.0 2026-09-09：
   1) 修正文件名稱命中會把整份文件所有段落都算命中的問題；正文命中頁／段落只計實際符合；
   2) 搜尋段落點入 PDF 前以該段正文重新驗證實體 PDF 頁，避免搜尋索引與原始 PDF 定位錯位；
   3) 常用程序待確認閱讀器新增「確認頁碼正確」，確認後清除提醒並保存新版正文快照；
   4) 事件參與人員解析支援「小班＋值班站長／值班站務專員」等班別職稱；
   5) 維持修訂／異動頁排除、文字模式階層、表格與 SOP 安全更新規則。 */
pdfjsLib.GlobalWorkerOptions.workerSrc = './vendor/pdf.worker.min.js?v=5.14.0';

/* ---------- IndexedDB layer ---------- */
const DB_NAME = 'stationAssistantDB';
const STORES = ['pdfFiles','sopDocs','announcements','personnel','ridership','favorites','recentViews','synonymGroups','unmatchedQueries','annotations'];
// 使用專用名稱，避免PDF.js在file://假Worker模式下與通用全域名稱 db 衝突。
let stationOperationsDatabase;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, 4);
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      STORES.forEach(name=>{
        if(!d.objectStoreNames.contains(name)){
          d.createObjectStore(name,{keyPath:'id',autoIncrement:true});
        }
      });
    };
    req.onsuccess = ()=>{stationOperationsDatabase=req.result; resolve(stationOperationsDatabase);};
    req.onerror = ()=>reject(req.error);
  });
}
function txStore(name, mode){
  return stationOperationsDatabase.transaction(name, mode).objectStore(name);
}
function dbGetAll(name){
  return new Promise((res,rej)=>{
    const r = txStore(name,'readonly').getAll();
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function dbAdd(name, obj){
  return new Promise((res,rej)=>{
    const r = txStore(name,'readwrite').add(obj);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function dbPut(name, obj){
  return new Promise((res,rej)=>{
    const r = txStore(name,'readwrite').put(obj);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function dbDelete(name, id){
  return new Promise((res,rej)=>{
    const r = txStore(name,'readwrite').delete(id);
    r.onsuccess=()=>res(); r.onerror=()=>rej(r.error);
  });
}
function dbClear(name){
  return new Promise((res,rej)=>{
    const r=txStore(name,'readwrite').clear();
    r.onsuccess=()=>res();r.onerror=()=>rej(r.error);
  });
}

/* ---------- In-memory cache ---------- */
const cache = { pdfFiles:[], sopDocs:[], announcements:[], personnel:[], ridership:[], favorites:[], recentViews:[], synonymGroups:[], unmatchedQueries:[], annotations:[] };
async function reloadCache(){
  for(const name of STORES){ cache[name] = await dbGetAll(name); }
}

/* ---------- App state ---------- */
let currentTab = 'sop';
let sopFilter = 'content'; // 'content' | 'all'
let searchSource = 'all'; // 'all' | 'sop' | 'notice'
let sopKeyword = '';
let sopSearchReturnTop = null;

let noticeKeyword = '';
let personnelKeyword = '';
let ridershipKeyword = '';
let ridershipView = {year:'', stationKey:'', metric:'averageDaily', rankMonth:'', rankScope:'all', section:'query', detailSection:'trend', rankBand:'top'};
let lastRidershipImportReport = '';
const RIDERSHIP_EVENTS_KEY='stationAssistantRidershipEventsV1';
let procedureKeyword = '';
let procedureEditMode = false;

let settingsSection = 'home';

/* ---------- PDF parsing helpers ---------- */
function isRevisionPage(text){
  const compact = text.replace(/\s+/g,'');
  if(compact.includes('文件異動狀況表')) return true;
  const set1 = compact.includes('修訂緣由') && compact.includes('修訂內容概述');
  const set2 = compact.includes('版別') && compact.includes('編訂') && compact.includes('審查') && compact.includes('核定');
  return set1 || set2;
}
function isRevisionLikePage(page){
  if(!page) return false;
  if(page.type==='revision') return true;
  return isRevisionPage(String(page.formattedText||page.text||''));
}
function isRevisionStartPage(text){
  const compact = text.replace(/\s+/g,'');
  // 每份文件封面後的第一張異動表，會有表名或完整的異動表主要欄位。
  return compact.includes('文件異動狀況表') ||
    (compact.includes('發行日期') &&
     compact.includes('修訂緣由') &&
     compact.includes('修訂內容概述'));
}
function isCoverPage(text){
  const compact = text.replace(/\s+/g,'');
  const hasCode = compact.includes('文件編號');
  const hasFirstIssue = compact.includes('首次發行日期') || compact.includes('初次發行日期');
  const hasOwner = compact.includes('編訂單位') || compact.includes('保管單位');
  // 公司封面固定會同時出現文件編號及首次發行日期；第三欄作為掃描／抽字不完整時的備援。
  return (hasCode && hasFirstIssue) || (hasCode && hasOwner && !compact.includes('文件異動狀況表'));
}
function extractHeaderInfo(text){
  const compact = text.replace(/\s+/g,'');
  const nameM = compact.match(/文件名稱[:：]?([\s\S]*?)(?=文件編號|最新版別|版別|章節|首次發行日期|初次發行日期|編訂單位|保管單位|$)/);
  const codeM = compact.match(/文件編號[:：]?([\s\S]*?)(?=首次發行日期|初次發行日期|最新版別|編訂單位|保管單位|$)/);
  return {
    name: nameM ? nameM[1].trim() : null,
    code: codeM ? codeM[1].trim() : null
  };
}
function resolvedDocName(doc){
  for(const page of doc.pages||[]){
    const compact=String(page.formattedText||page.text||'').replace(/\s+/g,'');
    const m=compact.match(/文件名稱[:：]?(.{2,100}?)(?=文件編號|最新版別|版別|章節|首次發行日期|初次發行日期|編訂單位|保管單位)/);
    if(m){
      const candidate=m[1].replace(/[，,。；;：:]+$/,'').trim();
      if(candidate.length>=2&&candidate.length<=80&&!/(?:修訂第|編訂|審查|核定|工程師|中心主任)/.test(candidate)) return candidate;
    }
  }
  const original=String(doc.name||'').trim();
  if(original.length<=80&&!/(?:修訂第|編訂|審查|核定|工程師|中心主任)/.test(original)) return original;
  return '站務工作說明書';
}
function guessTitle(coverText){
  let cleaned = coverText.replace(/\s+/g,'').trim();
  // 常見前綴：把公司抬頭類的詞先去掉再取一段當標題
  const stopWords = ['股份有限公司','有限公司'];
  stopWords.forEach(w=>{
    const idx = cleaned.indexOf(w);
    if(idx>=0) cleaned = cleaned.slice(idx+w.length);
  });
  return cleaned.slice(0,24) || '未命名文件';
}
function textItemColorRecords(operatorList){
  const records=[];
  let fill=[0,0,0];
  for(let i=0;i<(operatorList?.fnArray||[]).length;i++){
    const fn=operatorList.fnArray[i],args=operatorList.argsArray[i];
    if(fn===pdfjsLib.OPS.setFillRGBColor) fill=Array.from(args||[0,0,0]);

}
function positionedPdfItems(textContent,colorRecords=[]){
  let colorIndex=0;
  return textContent.items.map(it=>{
    const target=String(it.str||'').replace(/\s+/g,'');
    let record={color:'black'},matched=-1;
    if(target){
      for(let j=colorIndex;j<Math.min(colorRecords.length,colorIndex+40);j++){
        if(String(colorRecords[j].text||'').replace(/\s+/g,'')===target){matched=j;break;}
      }
    }
    if(matched>=0){record=colorRecords[matched];colorIndex=matched+1;}
    return {text:(it.str||'').trim(),x:it.transform?it.transform[4]:0,y:it.transform?it.transform[5]:0,
      width:Math.abs(it.width||0),height:Math.abs(it.height||it.transform?.[3]||10),color:record.color};
  }).filter(it=>it.text);
}
function pdfCellRuns(items,rect){
  const [x,y,w,h]=rect,inside=items.filter(it=>{
    const cx=it.x+Math.max(1,it.width)/2,cy=it.y+Math.max(1,it.height)/2;
    return cx>=x-2&&cx<=x+w+2&&cy>=y-3&&cy<=y+h+3;
  }).sort((a,b)=>Math.abs(a.y-b.y)>3?b.y-a.y:a.x-b.x);
  const lines=[];
  inside.forEach(item=>{
    let line=lines.find(row=>Math.abs(row.y-item.y)<=3);
    if(!line){line={y:item.y,items:[]};lines.push(line);}
    line.items.push(item);
  });
  return lines.sort((a,b)=>b.y-a.y).map(line=>line.items.sort((a,b)=>a.x-b.x).map(item=>({text:item.text,color:item.color})));
}
function mergeOverlappingTableRects(rects){
  const merged=[];
  rects.sort((a,b)=>b[2]*b[3]-a[2]*a[3]).forEach(rect=>{
    const [x,y,w,h]=rect,area=w*h;
    const duplicate=merged.some(other=>{
      const ix=Math.max(0,Math.min(x+w,other[0]+other[2])-Math.max(x,other[0]));
      const iy=Math.max(0,Math.min(y+h,other[1]+other[3])-Math.max(y,other[1]));
      const overlap=ix*iy;
      return overlap/Math.min(area,other[2]*other[3])>=.82;
    });
    if(!duplicate) merged.push(rect);
  });
  return merged;
}
function positionedItemsToText(items){
  const lines=[];
  [...items].sort((a,b)=>Math.abs(a.y-b.y)>3?b.y-a.y:a.x-b.x).forEach(item=>{
    let line=lines.find(row=>Math.abs(row.y-item.y)<=3);
    if(!line){line={y:item.y,items:[]};lines.push(line);}
    line.items.push(item);
  });
  return lines.sort((a,b)=>b.y-a.y).map(line=>line.items.sort((a,b)=>a.x-b.x).map(item=>item.text).join(' ').replace(/\s+/g,' ').trim()).filter(Boolean).join('\n');
}
async function extractPdfTableLayout(pdfPage,textContent,viewport){
  let operatorList;
  try{operatorList=await pdfPage.getOperatorList();}catch(_){return null;}
  const colors=textItemColorRecords(operatorList),items=positionedPdfItems(textContent,colors);
  const raw=[];
  for(let i=0;i<operatorList.fnArray.length;i++){
    if(operatorList.fnArray[i]!==pdfjsLib.OPS.constructPath) continue;
    const args=operatorList.argsArray[i];
    if(args?.[0]?.length!==1||args[0][0]!==pdfjsLib.OPS.rectangle) continue;
    const [x,y,w,h]=args[1]||[];
    if(![x,y,w,h].every(Number.isFinite)||w<28||h<20||w>viewport.width*.92||h>viewport.height*.9) continue;
    raw.push([x,y,w,h]);
  }
  const unique=mergeOverlappingTableRects([...new Map(raw.map(r=>{
    const key=[r[0],r[1],r[0]+r[2],r[1]+r[3]].map(v=>Math.round(v)).join(':');
    return [key,r];
  })).values()]);
  const rowGroups=new Map();
  unique.forEach(rect=>{
    const key=`${Math.round(rect[1]/2)*2}:${Math.round((rect[1]+rect[3])/2)*2}`;
    if(!rowGroups.has(key)) rowGroups.set(key,[]);
    rowGroups.get(key).push(rect);
  });
  const rows=[...rowGroups.values()].filter(group=>group.length>=3).map(group=>group.sort((a,b)=>a[0]-b[0]))
    .sort((a,b)=>(b[0][1]+b[0][3])-(a[0][1]+a[0][3]));
  if(rows.length<2||Math.max(...rows.map(r=>r.length))<4) return null;
  const used=new Set();
  const tableRows=rows.map((row,rowIndex)=>({cells:row.map(rect=>{
    const runs=pdfCellRuns(items,rect);
    items.forEach((item,itemIndex)=>{
      const cx=item.x+Math.max(1,item.width)/2,cy=item.y+Math.max(1,item.height)/2;
      if(cx>=rect[0]-2&&cx<=rect[0]+rect[2]+2&&cy>=rect[1]-3&&cy<=rect[1]+rect[3]+3) used.add(itemIndex);
    });
    return {runs,header:rowIndex===0};
  })}));
  const allRects=rows.flat(),minY=Math.min(...allRects.map(r=>r[1])),maxY=Math.max(...allRects.map(r=>r[1]+r[3]));
  const tableZoneIndexes=items.map((item,index)=>({item,index})).filter(x=>x.item.y>=minY-3&&x.item.y<=maxY+3).map(x=>x.index);
  const assignmentRate=tableZoneIndexes.length?tableZoneIndexes.filter(index=>used.has(index)).length/tableZoneIndexes.length:0;
  const columnCount=Math.max(...tableRows.map(r=>r.cells.length));
  const completeRows=tableRows.filter(r=>r.cells.length===columnCount).length;
  if(assignmentRate<.68||columnCount<3||columnCount>8||completeRows<2) return null;
  const beforeText=positionedItemsToText(items.filter(item=>item.y>maxY+3));
  const afterText=positionedItemsToText(items.filter(item=>item.y<minY-3&&item.y>viewport.height*.075));
  const headerKey=(tableRows[0]?.cells?.[0]?.runs||[]).flat().map(run=>run.text).join('').replace(/\s+/g,'');
  return {version:3,beforeText,afterText,rows:tableRows,columnCount,assignmentRate,minY,maxY,pageHeight:viewport.height,headerKey};
}
function markCrossPageTables(pages){
  for(let i=0;i<pages.length-1;i++){
    const current=pages[i],next=pages[i+1],a=current.tableLayout,b=next.tableLayout;
    if(!a?.rows?.length||!b?.rows?.length) continue;
    const currentTouchesBottom=a.minY<=a.pageHeight*.14;
    const nextTouchesTop=b.maxY>=b.pageHeight*.78;
    const sameColumns=a.columnCount===b.columnCount;
    const relatedHeaders=!!a.headerKey&&!!b.headerKey&&(a.headerKey.includes(b.headerKey)||b.headerKey.includes(a.headerKey));
    if(currentTouchesBottom&&nextTouchesTop&&sameColumns&&relatedHeaders){
      current.tableLayout=null;next.tableLayout=null;
      current.tableFallbackReason='cross-page';next.tableFallbackReason='cross-page';
    }
  }
  return pages;
}
function extractFormattedText(textContent,pageHeight){
  const layoutLines=[];
  let currentLine=[],lastY=null;
  const flushLine=()=>{
    if(currentLine.length) layoutLines.push(currentLine.join(' ').replace(/\s+/g,' ').trim());
    currentLine=[];
  };
  textContent.items.forEach(it=>{
    const str=(it.str||'').trim();
    if(!str) return;
    const y=it.transform ? it.transform[5] : lastY;
    // 排除頁面最下方獨立的文件內部頁碼；APP另以PDF總檔頁碼顯示。
    if(pageHeight && y<pageHeight*.075 && /^\d{1,4}$/.test(str)) return;
    if(currentLine.length && lastY!==null && y!==null && Math.abs(y-lastY)>3) flushLine();
    currentLine.push(str);
    lastY=y;
    if(it.hasEOL) flushLine();
  });
  flushLine();
  return layoutLines.filter(Boolean).join('\n');
}
async function parsePdfArrayBuffer(buf,onProgress=()=>{}){
  const pdf = await pdfjsLib.getDocument({data:buf.slice(0)}).promise;
  const pages = [];
  onProgress(0,pdf.numPages);
  for(let i=1;i<=pdf.numPages;i++){
    try{
      const page = await pdf.getPage(i), tc = await page.getTextContent(), viewport = page.getViewport({scale:1});
      const text = tc.items.map(it=>it.str).join(' '), formattedText=extractFormattedText(tc,viewport.height);
      const tableLayout=await extractPdfTableLayout(page,tc,viewport);
      const positionedText = positionedPdfItems(tc);
      pages.push({absolutePage:i,text,formattedText,positionedText,pageWidth:viewport.width,pageHeight:viewport.height,tableLayout,tableLayoutVersion:3});
    }catch(error){
      console.warn(`PDF 第 ${i} 頁文字解析失敗`,error);
      pages.push({absolutePage:i,text:'',formattedText:'',positionedText:[],pageWidth:0,pageHeight:0,parseError:String(error?.message||error)});
    }
    onProgress(i,pdf.numPages);
  }
  return markCrossPageTables(pages);
}
function romanToInt(s){
  const vals={i:1,v:5,x:10,l:50,c:100,d:500,m:1000};
  s=s.toLowerCase();
  if(!/^[ivxlcdm]+$/.test(s)) return null;
  let total=0;
  for(let i=0;i<s.length;i++){
    const cur=vals[s[i]], next=vals[s[i+1]];
    if(next && cur<next) total-=cur; else total+=cur;
  }
  return total;
}
function parsePageLabelToken(token){
  const cleaned = String(token || '').trim().replace(/[－—–\-_.頁第]/g,'');
  if(/^\d{1,4}$/.test(cleaned)) return {type:'arabic', value:parseInt(cleaned,10)};
  if(/^[ivxlcdm]{1,6}$/i.test(cleaned)){
    const v = romanToInt(cleaned);
    if(v) return {type:'roman', value:v};
  }
  return null;
}
function extractPageLabel(page){
  // PDF 文字陣列的先後順序不代表版面位置，優先從頁面底部 18% 尋找置中的頁碼。
  const footer = (page.positionedText || [])
    .filter(it=>it.y <= page.pageHeight * .18)
    .map(it=>({it, label:parsePageLabelToken(it.text)}))
    .filter(x=>x.label)
    .sort((a,b)=>Math.abs(a.it.x-page.pageWidth/2)-Math.abs(b.it.x-page.pageWidth/2));
  if(footer.length) return footer[0].label;
  // 舊式或座標缺失 PDF 的備援。
  const tokens = page.text.trim().split(/\s+/);
  const last = tokens[tokens.length-1] || '';
  return parsePageLabelToken(last) || {type:'none', value:null};
}
function segmentDocuments(pages){
  const labels = pages.map(p=>extractPageLabel(p));
  const boundaries = new Set();
  const explicitCovers = new Set();
  pages.forEach((page,i)=>{
    // 單靠「文件編號／首次發行日期」會把正文中的表單誤認成封面。
    // 依公司文件固定結構，只有「封面之後緊接異動表」才視為新文件。
    const nextIsRevisionStart = i+1 < pages.length && isRevisionStartPage(pages[i+1].text);
    if(isCoverPage(page.text) && nextIsRevisionStart) explicitCovers.add(i);
  });
  if(explicitCovers.size){
    // 找到真正封面時，以第一個封面為起點；封面之前的總目錄／對照表不建立成SOP。
    explicitCovers.forEach(i=>boundaries.add(i));
  } else {
    // 若整份 PDF 都抽不到封面固定欄位，保留第1頁並退回以 i／正文 1 的重置位置推測分界。
    boundaries.add(0);
    for(let i=0;i<pages.length;i++){
      const lab = labels[i];
      if(lab.type==='roman' && lab.value===1){
        boundaries.add(i);
      } else if(lab.type==='arabic' && lab.value===1){
        const prev = i>0 ? labels[i-1] : null;
        if(!prev || prev.type!=='roman') boundaries.add(i);
      }
    }
  }
  // 把緊接在邊界前、沒有頁碼的封面頁往前納入這份新文件，並記錄哪些索引才是真正的封面頁
  const coverIdxSet = new Set();
  const finalSet = new Set();
  boundaries.forEach(idx=>{
    let start = idx;
    while(!explicitCovers.size && start>0 && labels[start-1].type==='none' && !boundaries.has(start-1)){
      coverIdxSet.add(start-1);
      start--;
    }
    if(explicitCovers.has(idx)) coverIdxSet.add(idx);
    finalSet.add(start);
  });
  const sorted = Array.from(finalSet).sort((a,b)=>a-b);

  const docs = [];
  for(let i=0;i<sorted.length;i++){
    const start = sorted[i];
    const end = (i+1<sorted.length) ? sorted[i+1]-1 : pages.length-1;
    const slice = pages.slice(start, end+1);
    let info = extractHeaderInfo(slice[0].text);
    if(!info.name){
      for(const pg of slice){ const alt = extractHeaderInfo(pg.text); if(alt.name){ info = alt; break; } }
    }
    const name = info.name || guessTitle(slice[0].text);
    const docPages = slice.map((p,rel)=>{
      const absIdx = start+rel;
      // 型態判斷改為只依內容特徵（修訂紀錄關鍵字），封面只認定為明確被歸類的封面索引，不再受頁碼抓取失敗影響
      const type = coverIdxSet.has(absIdx) ? 'cover' : (isRevisionPage(p.text) ? 'revision' : 'content');
      return { pageNum: rel+1, absolutePage: p.absolutePage, text: p.text, formattedText:p.formattedText, type, _label: labels[absIdx] };
    });
    docs.push({name, pages:docPages});
  }
  return docs;
}

// 中文注音／拼音輸入時，compositionend 前不可重建輸入框，否則組字會被中斷。
function bindImeSafeSearch(input, setValue, rerender){
  if(!input) return;
  let composing = false;
  input.addEventListener('compositionstart', ()=>{ composing = true; });
  input.addEventListener('input', e=>{
    setValue(e.target.value);
    if(!composing && !e.isComposing) rerender();
  });
  input.addEventListener('compositionend', e=>{
    composing = false;
    setValue(e.target.value);
    rerender();
  });
}

}

async function resolveSearchHitPdfPage(docId,storedPage,rawText){
  const doc=cache.sopDocs.find(d=>Number(d.id)===Number(docId));
  const rec=doc?cache.pdfFiles.find(f=>Number(f.id)===Number(doc.pdfFileId)):null;
  const wanted=sopMatchNormalize(rawText||'');
  if(!doc||!rec?.data||wanted.length<10)return Number(storedPage);
  const anchors=snapshotAnchors(rawText).slice(0,3);
  const scoreText=text=>{
    const norm=sopMatchNormalize(text);
    if(!norm)return 0;
    if(norm.includes(wanted)||wanted.includes(norm))return 1;
    const anchorScore=anchors.length?anchors.filter(a=>norm.includes(a)).length/anchors.length:0;
    return Math.max(anchorScore,sopContentSimilarity(rawText,text));
  };
  let pdf;
  try{
    pdf=await pdfjsLib.getDocument({data:rec.data.slice(0)}).promise;
    const bounds=getSopPageBounds({type:'sop',docId:doc.id,absolutePage:storedPage});
    const min=Math.max(1,bounds.min),max=Math.min(pdf.numPages,bounds.max);
    const candidates=[Number(storedPage),...Array.from({length:max-min+1},(_,i)=>min+i).filter(p=>p!==Number(storedPage))];
    let best={page:Number(storedPage),score:0};
    for(const pageNum of candidates){
      const page=await pdf.getPage(pageNum);
      const tc=await page.getTextContent();
      const text=tc.items.map(it=>it.str).join(' ');
      const score=scoreText(text);
      if(score>best.score)best={page:pageNum,score};
      if(score>=.96)break;
    }
    return best.score>=.58?best.page:Number(storedPage);
  }catch(err){
    console.warn('搜尋結果 PDF 頁碼驗證失敗',err);
    return Number(storedPage);
  }finally{
    try{await pdf?.destroy?.();}catch(_){}
  }
}
function searchPageGroups(result){
  const map=new Map();

    const page=Number(hit.absolutePage);

    map.get(page).push({...hit,hitIndex:index});
  });
  return [...map.entries()].map(([page,hits])=>({page,hits:hits.sort((a,b)=>String(a.clauseMarker||'').localeCompare(String(b.clauseMarker||''),'zh-Hant',{numeric:true}))})).sort((a,b)=>a.page-b.page);
}

function readablePdfText(text){
  let out = String(text || '').replace(/\s+/g,' ').trim();
  // 移除PDF抽字時夾在中文字之間的假空格，但保留一般詞組及英文空格。
  for(let i=0;i<6;i++){
    const next = out.replace(/([\u3400-\u9fff])\s+([\u3400-\u9fff])/g,'$1$2');
    if(next===out) break;

function makeSearchSnippet(text, term){
  const readable = readablePdfText(text);

  if(idx<0){
    // 搜尋時忽略空格；若原文仍有特殊空白，退回顯示頁面開頭。
    return `…${escapeHtml(readable.slice(0,70))}${readable.length>70?'…':''}`;
  }
  const start = Math.max(0,idx-32);
  const end = Math.min(readable.length,idx+compactTerm.length+48);
  return `${start>0?'…':''}${escapeHtml(readable.slice(start,idx))}<span class="highlight">${escapeHtml(readable.slice(idx,idx+compactTerm.length))}</span>${escapeHtml(readable.slice(idx+compactTerm.length,end))}${end<readable.length?'…':''}`;
}
const SMART_CONCEPTS=[
  ['電梯','升降機'],
  ['電扶梯','扶梯'],
  ['困人','受困','受困旅客','電梯受困'],
  ['非真實火警','火警誤報','誤報','假火警'],
  ['真實火警','火災','起火'],
  ['旅客受傷','跌傷','跌倒','滑倒'],
  ['行動電源','鋰電池','自燃','冒煙'],
  ['淹水','積水','進水','防洪'],
  ['大量旅客','人潮','旅客壅塞'],
  ['遺失物','拾得物'],
  ['無錢購票','沒有錢買車票','沒錢買票','無錢買票','票款不足','無法購票'],
  ['列車異常','列車故障'],
  ['廣播','廣播詞'],
  ['停機','停止運轉'],
  ['通報','回報','通知'],
  ['管制','警戒','隔離']

const QUESTION_WORDS=/如何|怎麼辦|怎麼|怎樣|遭遇|遇到|發生|應如何|要如何|請問|規定為何|處理方式/g;
const ACTION_ALIASES=['處理','處置','應變','排除','救援','通報','停機','管制','確認'];
let lastSearchPlan=null;
function buildSmartSearchPlan(keyword){
  const customGroups=cache.synonymGroups.map(g=>[g.canonical,...(g.aliases||[])].filter(Boolean));
  const cleaned=String(keyword||'').replace(QUESTION_WORDS,' ').replace(/[，。？！、；：]/g,' ').trim();
  const hasExplicitSpace=/\s/.test(cleaned);
  // 搜尋規則：無空格＝完整詞組；有空格＝各詞 AND。只有使用者自行設定的同義詞才會擴充。
  const rawTerms=hasExplicitSpace?parseSearchTerms(cleaned).filter(term=>term.length>=2):[cleaned].filter(term=>term.length>=2);
  const terms=rawTerms.length?rawTerms:parseSearchTerms(String(keyword||'')).filter(term=>term.length>=2);
  const groups=terms.map(term=>{
    if(!hasExplicitSpace) return [term];
    const key=searchComparable(term);
    const custom=customGroups.find(group=>group.some(alias=>searchComparable(alias)===key));
    return custom||[term];
  });
  const expanded=[...new Set(groups.flat())];
  const normalized=searchComparable(keyword);
  const intent=ACTION_ALIASES.filter(word=>normalized.includes(searchComparable(word)));
  const usedCustom=hasExplicitSpace&&groups.some(g=>g.length>1);
  return {groups,expanded,intent,isSmart:usedCustom,usedCustom,mode:hasExplicitSpace?'and':'phrase',terms};

function groupMatches(text,group){
  const comparable=searchComparable(text);
  return group.some(alias=>comparable.includes(searchComparable(alias)));
}
function highlightedClause(text,terms){
  const readable=readablePdfText(text);
  const display=readable.length>320?`${readable.slice(0,320)}…`:readable;
  return highlightReaderText(display,terms);
}
function searchSop(keyword,plan){
  const out=[];
  cache.sopDocs.forEach(doc=>{
    const displayName=resolvedDocName(doc);
    const titleMatches=plan.groups.map(group=>groupMatches(displayName,group));
    const pages=(doc.pages||[]).filter(p=>p.type!=='cover' && !(sopFilter==='content' && isRevisionLikePage(p)));
    const rows=[];
    pages.forEach(p=>{
      parseSopParagraphs(p.formattedText||p.text).forEach(paragraph=>{
        const matches=plan.groups.map(group=>groupMatches(paragraph.text,group));
        rows.push({p,paragraph,matches});
      });
    });

    const hits=[];
    if(plan.mode==='phrase'){
      // 無空格：完整詞組，只接受同一段落直接命中。
      rows.forEach(({p,paragraph,matches})=>{
        if(!matches.every(Boolean))return;
        const matchedAliases=plan.expanded.filter(alias=>groupMatches(paragraph.text,[alias]));
        let score=70+matches.filter(Boolean).length*8+(paragraph.marker?2:0);
        hits.push({
          absolutePage:Number(p.absolutePage),pageNum:p.pageNum,clauseMarker:paragraph.marker||'',
          score,rawText:paragraph.text,matchLevel:'paragraph',
          snippetHtml:highlightedClause(paragraph.text,matchedAliases.length?matchedAliases:plan.expanded)

      // 有空格：AND。只保留「同段」或「同頁」同時具備所有條件的頁面；
      // 不再因同一程序其他頁曾出現另一個詞，就把只有單一詞的頁面一起列出。
      const byPage=new Map();
      rows.forEach(r=>{
        const page=Number(r.p.absolutePage);
        if(!byPage.has(page))byPage.set(page,[]);
        byPage.get(page).push(r);
      });
      for(const [page,pageRows] of byPage){
        const pageCoverage=plan.groups.map((g,gi)=>pageRows.some(r=>r.matches[gi]));
        if(!pageCoverage.every(Boolean))continue;
        const sameParagraphRows=pageRows.filter(r=>r.matches.every(Boolean));
        const chosen=sameParagraphRows.length?sameParagraphRows:pageRows.filter(r=>r.matches.some(Boolean));
        chosen.forEach(({p,paragraph,matches})=>{
          const matchedAliases=plan.expanded.filter(alias=>groupMatches(paragraph.text,[alias]));
          const sameParagraph=matches.every(Boolean);
          let score=(sameParagraph?70:50)+matches.filter(Boolean).length*8+(paragraph.marker?2:0);
          hits.push({
            absolutePage:Number(p.absolutePage),pageNum:p.pageNum,clauseMarker:paragraph.marker||'',
            score,rawText:paragraph.text,matchLevel:sameParagraph?'paragraph':'page',
            snippetHtml:highlightedClause(paragraph.text,matchedAliases.length?matchedAliases:plan.expanded)
          });
        });
      }
    }

    // 文件名稱可作為輔助標示，但不能單獨讓正文不符合的頁面進入結果。
    if(!hits.length)return;
    hits.sort((a,b)=>b.score-a.score||a.absolutePage-b.absolutePage);
    const uniquePages=[...new Set(hits.map(h=>h.absolutePage))];
    const best=hits[0];
    out.push({
      source:'sop',docId:doc.id,docName:displayName,pdfFileId:doc.pdfFileId,
      pageNum:best.pageNum,absolutePage:Number(best.absolutePage),clauseMarker:best.clauseMarker||'',
      titleMatched:titleMatches.some(Boolean),titleOnly:false,score:best.score,
      hitPages:uniquePages,hitSegments:hits,totalSegments:hits.length,
      matchLevel:hits.some(h=>h.matchLevel==='paragraph')?'paragraph':'page',
      snippetsHtml:hits.slice(0,3).map(h=>h.snippetHtml)

function searchNotices(keyword,plan){
  return cache.announcements.map(n=>{
    const combined=searchComparable(`${n.title} ${n.category||''} ${n.content||''}`);
    const matches=plan.groups.map(group=>group.some(alias=>combined.includes(searchComparable(alias))));
    if(!matches.every(Boolean)) return null;
    const matched=plan.expanded.filter(alias=>combined.includes(searchComparable(alias)));
    return {
    source:'notice',noticeId:n.id,docName:n.title,pageNum:null,absolutePage:null,
    titleMatched:plan.groups.some(group=>groupMatches(n.title,group)),score:matches.filter(Boolean).length*10,

function searchUnified(keyword){
  const plan=buildSmartSearchPlan(keyword);
  lastSearchPlan=plan;
  let out=[];
  if(searchSource!=='notice') out=out.concat(searchSop(keyword,plan));
  if(searchSource!=='sop') out=out.concat(searchNotices(keyword,plan));
  const rawTerms=parseSearchTerms(keyword.replace(QUESTION_WORDS,' ').replace(/[，。？！、；：]/g,' ')).filter(t=>t.length>1);
  out.forEach(r=>{if(r.source==='notice'){r.matchType='notice';return;}const doc=cache.sopDocs.find(d=>d.id===Number(r.docId)),page=doc?.pages?.find(p=>Number(p.absolutePage)===Number(r.absolutePage));const originalText=`${r.docName} ${page?.formattedText||page?.text||''}`;r.matchType=rawTerms.length&&rawTerms.every(term=>searchComparable(originalText).includes(searchComparable(term)))?'original':'synonym';});
  const merged=new Map();
  for(const r of out){
    if(r.source!=='sop'){merged.set(`notice:${r.noticeId}`,r);continue;}
    const logicalName=searchComparable(r.docName||'');
    const key=`sop:${r.pdfFileId||''}:${logicalName}`;
    const prev=merged.get(key);
    if(!prev){merged.set(key,r);continue;}
    const hits=[...(prev.hitSegments||[]),...(r.hitSegments||[])];
    const hitMap=new Map();

    prev.hitPages=[...new Set(uniqueHits.map(h=>Number(h.absolutePage)))].sort((a,b)=>a-b);
    prev.totalSegments=uniqueHits.length;
    prev.titleMatched=prev.titleMatched||r.titleMatched;
    prev.titleOnly=!uniqueHits.length&&(prev.titleOnly||r.titleOnly);

  });
}
async function recordUnmatchedQuery(query){

    existing.count=(existing.count||1)+1;
    existing.lastUsedAt=new Date().toISOString();

function getSopPageBounds(item){
  const doc=cache.sopDocs.find(d=>d.id===Number(item.docId));
  const pages=(doc?.pages||[]).map(p=>Number(p.absolutePage)).filter(Number.isFinite);
  if(!pages.length) return {min:1,max:Math.max(1,Number(item.absolutePage)||1)};
  return {min:Math.min(...pages),max:Math.max(...pages)};
}
function openProcedureNameDialog(item,existing=null){

    const defaultName=existing?.title || item.title || '';

    const bounds=item.type==='sop'?getSopPageBounds(item):null;
    const anchor=Math.min(bounds?.max||1,Math.max(bounds?.min||1,Number(existing?.absolutePage||item.absolutePage)||1));
    const defaultStart=Number(existing?.startPage)||Math.max(bounds?.min||1,anchor-1);
    const defaultEnd=Number(existing?.endPage)||Math.min(bounds?.max||anchor,anchor+1);
    let selectedColor=existing?.color||item.color||'blue';
    const overlay=document.createElement('div');
    overlay.className='modal-overlay';
    overlay.style.zIndex='90';
    overlay.innerHTML=`<div class="modal-sheet" style="height:auto;">
      <div class="modal-header"><span style="font-weight:650;">${existing?'重新命名':'新增常用程序'}</span></div>
      <div class="modal-body">
        <div class="field"><label>常用程序名稱</label><input id="procedure-name-input" maxlength="30" value="${escapeHtml(defaultName)}" placeholder="例如：電梯困人"></div>
        <div class="field"><label>卡片顏色</label><div class="color-options">${PROCEDURE_COLORS.map(color=>`<button type="button" class="color-choice procedure-${color} ${color===selectedColor?'selected':''}" data-procedure-color="${color}" aria-label="${color}"></button>`).join('')}</div></div>
        <p class="tiny-muted" style="line-height:1.6;margin:0;">來源：${escapeHtml(sourceTitle)}${item.type==='sop'&&item.absolutePage?`｜命中PDF第${item.absolutePage}頁`:''}</p>
        ${item.type==='sop'?`<div class="procedure-range-grid">
          <div class="field" style="margin:0;"><label>起始PDF頁</label><input type="number" id="procedure-start-page" min="${bounds.min}" max="${bounds.max}" value="${defaultStart}"></div>
          <div class="field" style="margin:0;"><label>結束PDF頁</label><input type="number" id="procedure-end-page" min="${bounds.min}" max="${bounds.max}" value="${defaultEnd}"></div>
        </div>
        <div class="procedure-range-help">本文件範圍：PDF第 ${bounds.min}～${bounds.max} 頁。預設帶入命中頁前後各1頁，可依完整程序自行調整。</div>`:''}
        <div class="row" style="margin-top:16px;">
          <button class="secondary" id="procedure-name-cancel" style="flex:1;">取消</button>
          <button class="primary" id="procedure-name-save" style="flex:1;">${existing?'儲存':'加入'}</button>
        </div>
      </div></div>`;
    document.getElementById('phone').appendChild(overlay);
    const input=overlay.querySelector('#procedure-name-input');
    input.focus(); input.select();
    overlay.querySelectorAll('[data-procedure-color]').forEach(btn=>btn.addEventListener('click',()=>{
      selectedColor=btn.dataset.procedureColor;
      overlay.querySelectorAll('[data-procedure-color]').forEach(b=>b.classList.toggle('selected',b===btn));
    }));
    const close=value=>{overlay.remove();resolve(value);};
    overlay.querySelector('#procedure-name-cancel').addEventListener('click',()=>close(false));
    overlay.querySelector('#procedure-name-save').addEventListener('click',async()=>{
      const title=input.value.trim();
      if(!title) return alert('請輸入常用程序名稱');
      let rangeData={};
      if(item.type==='sop'){
        const startPage=Number(overlay.querySelector('#procedure-start-page').value);
        const endPage=Number(overlay.querySelector('#procedure-end-page').value);
        if(!Number.isInteger(startPage)||!Number.isInteger(endPage)) return alert('請輸入正確的PDF頁碼');
        if(startPage<bounds.min||endPage>bounds.max) return alert(`頁碼必須在本文件第 ${bounds.min}～${bounds.max} 頁內`);
        if(startPage>endPage) return alert('起始頁不能大於結束頁');
        if(endPage-startPage+1>15&&!confirm(`此常用程序共有 ${endPage-startPage+1} 頁，確定要儲存嗎？`)) return;
        rangeData={startPage,endPage,absolutePage:Math.min(endPage,Math.max(startPage,anchor))};
      }
      const sourceDoc=item.type==='sop'?cache.sopDocs.find(d=>Number(d.id)===Number(item.docId||existing?.docId)):null;
      const sourceTextSnapshot=sourceDoc?favoriteRangeSnapshot({...item,...existing,...rangeData},sourceDoc,rangeData.startPage,rangeData.endPage):'';
      const snapshotMeta=sourceDoc?{sourceTextSnapshot,sourceSnapshotStartPage:rangeData.startPage,sourceSnapshotEndPage:rangeData.endPage,sourceSnapshotAt:new Date().toISOString()}:{};
      if(existing){
        await dbPut('favorites',{...existing,...rangeData,...snapshotMeta,title,sourceTitle,color:selectedColor,pageReviewRequired:false,pageReviewStatus:'',pageMatchScore:null,pageMatchMethod:'manual-confirm',updatedAt:new Date().toISOString()});
      }else{
        const maxOrder=Math.max(0,...cache.favorites.map(f=>Number(f.sortOrder)||0));
        await dbAdd('favorites',{...item,...rangeData,...snapshotMeta,title,sourceTitle,color:selectedColor,sortOrder:maxOrder+1,createdAt:new Date().toISOString()});
      }
      await reloadCache();
      close(true);
    });
  });
}

function documentVersionSummary(doc){
  if(!doc)return '';
  const cover=(doc.pages||[]).filter(p=>p.type==='cover').map(p=>readablePdfText(p.formattedText||p.text)).join(' ');
  const version=cover.match(/最新版別\s*[:：]?\s*([^\s]{1,12})/)?.[1]||'';
  const date=cover.match(/(?:首次|初次)發行日期\s*[:：]?\s*([0-9./年月日-]{6,14})/)?.[1]||'';
  return [version&&`版別 ${version}`,date&&`首次發行 ${date}`].filter(Boolean).join('｜');
}

function procedurePortableRecord(f){
  const doc=f.type==='sop'?cache.sopDocs.find(d=>d.id===Number(f.docId)):null;
  const pdf=doc?cache.pdfFiles.find(p=>p.id===doc.pdfFileId):null;
  return {...f,portableId:f.id,id:undefined,docId:undefined,noticeId:undefined,
    sourceDocumentName:doc?resolvedDocName(doc):'',sourcePdfFile:pdf?.fileName||'',
    sourceNoticeNumber:f.type==='notice'?(cache.announcements.find(n=>n.id===Number(f.noticeId))?.number||''):''};
}
function downloadJson(data,fileName){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=fileName;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function resolveImportedProcedure(p){
  if(p.type==='notice'){
    const n=cache.announcements.find(x=>(p.sourceNoticeNumber&&x.number===p.sourceNoticeNumber)||x.title===p.sourceTitle||x.title===p.title);
    return n?{...p,noticeId:n.id}:null;
  }
  const doc=cache.sopDocs.find(d=>resolvedDocName(d)===p.sourceDocumentName) || cache.sopDocs.find(d=>{
    const pdf=cache.pdfFiles.find(x=>x.id===d.pdfFileId);return p.sourcePdfFile&&pdf?.fileName===p.sourcePdfFile;
  });
  return doc?{...p,docId:doc.id}:null;
}

async function importProceduresFileLegacy(file){
  let data;try{data=JSON.parse(await file.text())}catch{return alert('無法讀取備份檔，請選擇由本程式匯出的 JSON 檔。')}
  if(data?.format!=='station-assistant-procedures'||!Array.isArray(data.procedures)) return alert('這不是常用程序備份檔。');
  const mode=await chooseImportMode(data);if(!mode)return;
  if(mode==='replace'){await dbClear('favorites');await dbClear('annotations');await reloadCache();}
  const existingKeys=new Set(cache.favorites.map(f=>`${f.type}|${f.title}|${f.startPage||f.absolutePage||''}|${f.endPage||''}`));
  const idMap=new Map();let added=0,skipped=0,unmatched=0;
  for(const source of data.procedures){
    const resolved=resolveImportedProcedure(source);if(!resolved){unmatched++;continue;}
    const key=`${resolved.type}|${resolved.title}|${resolved.startPage||resolved.absolutePage||''}|${resolved.endPage||''}`;
    if(mode==='merge'&&existingKeys.has(key)){skipped++;continue;}
    const oldId=source.portableId;delete resolved.id;delete resolved.portableId;delete resolved.sourceDocumentName;delete resolved.sourcePdfFile;delete resolved.sourceNoticeNumber;
    resolved.sortOrder=cache.favorites.length+added+1;resolved.createdAt=resolved.createdAt||new Date().toISOString();
    const newId=await dbAdd('favorites',resolved);if(oldId!==undefined)idMap.set(Number(oldId),newId);added++;
  }
  for(const a of data.annotations||[]){const newFavoriteId=idMap.get(Number(a.favoriteId));if(newFavoriteId)await dbAdd('annotations',{...a,id:undefined,favoriteId:newFavoriteId});}
  await reloadCache();render();alert(`匯入完成：新增 ${added} 張、略過重複 ${skipped} 張、找不到對應文件 ${unmatched} 張。`);
}

/* v4：書籤式輕量移轉；SOP 僅帶識別資訊，不夾帶 PDF 或全文。 */
function transferText(value){return String(value||'').trim().toLowerCase();}
function transferBufferFingerprint(data){if(!data)return '0-0';const bytes=new Uint8Array(data),step=Math.max(1,Math.floor(bytes.length/64));let hash=2166136261;for(let i=0;i<bytes.length;i+=step){hash^=bytes[i];hash=Math.imul(hash,16777619);}return `${bytes.length}-${(hash>>>0).toString(16)}`;}
function transferDocumentKey(doc,pdf){return `${transferText(resolvedDocName(doc))}|${transferText(pdf?.fileName)}|${transferBufferFingerprint(pdf?.data)}`;}
function transferNoticeKey(n){return n.number?`no:${transferText(n.number)}`:`title:${transferText(n.title)}|${n.date||''}`;}
function transferProcedureKey(p){return `${p.type||'sop'}|${p.sourceDocumentKey||p.sourceNoticeKey||''}|${transferText(p.title)}|${p.startPage||p.absolutePage||''}|${p.endPage||''}`;}
function transferAnnotationKey(a,favoriteId){return [favoriteId,a.pageNum||a.page||a.pdfPage||'',a.type||a.tool||'',a.x||'',a.y||'',a.width||a.w||'',a.height||a.h||'',a.color||'',a.thickness||''].join('|');}
function portableProcedureV3(f){
  const doc=f.type==='sop'?cache.sopDocs.find(d=>d.id===Number(f.docId)):null;
  const pdf=doc?cache.pdfFiles.find(p=>p.id===Number(doc.pdfFileId)):null;
  const notice=f.type==='notice'?cache.announcements.find(n=>n.id===Number(f.noticeId)):null;
  const copy={...f,portableId:f.id,sourceDocumentKey:doc?transferDocumentKey(doc,pdf):'',sourceNoticeKey:notice?transferNoticeKey(notice):''};
  delete copy.id;delete copy.docId;delete copy.noticeId;return copy;
}

async function importProceduresFile(file){

    const pdfIdMap=new Map();
    for(const source of data.pdfFiles||[]){const sourceData=base64ToBuf(source.data);let current=cache.pdfFiles.find(p=>transferText(p.fileName)===transferText(source.fileName)&&transferBufferFingerprint(p.data)===transferBufferFingerprint(sourceData));if(!current){const copy={...source,data:sourceData};delete copy.portableId;current={...copy,id:await dbAdd('pdfFiles',copy)};cache.pdfFiles.push(current);result.pdfAdded++;}pdfIdMap.set(Number(source.portableId),current.id);}
    const documentIdMap=new Map();
    for(const source of data.documents||[]){let current=cache.sopDocs.find(d=>{const p=cache.pdfFiles.find(x=>x.id===Number(d.pdfFileId));return transferDocumentKey(d,p)===source.documentKey;});if(!current){const copy={...source,pdfFileId:pdfIdMap.get(Number(source.portablePdfId))};delete copy.portableId;delete copy.portablePdfId;delete copy.documentKey;if(!copy.pdfFileId){result.unmatched++;continue;}current={...copy,id:await dbAdd('sopDocs',copy)};cache.sopDocs.push(current);result.docAdded++;}documentIdMap.set(source.documentKey,current.id);}
    const procedureIdMap=new Map(),existingProcedureKeys=new Map(cache.favorites.map(f=>{const d=f.type==='sop'?cache.sopDocs.find(x=>x.id===Number(f.docId)):null,p=d?cache.pdfFiles.find(x=>x.id===Number(d.pdfFileId)):null,n=f.type==='notice'?cache.announcements.find(x=>x.id===Number(f.noticeId)):null;return [transferProcedureKey({...f,sourceDocumentKey:d?transferDocumentKey(d,p):'',sourceNoticeKey:n?transferNoticeKey(n):''}),f];}));
    for(const source of data.procedures){const copy={...source};delete copy.portableId;const key=transferProcedureKey(source);let current=existingProcedureKeys.get(key);if(source.type==='sop')copy.docId=documentIdMap.get(source.sourceDocumentKey);delete copy.sourceDocumentKey;delete copy.sourceNoticeKey;if(source.type==='sop'&&!copy.docId){result.unmatched++;continue;}if(current){procedureIdMap.set(Number(source.portableId),current.id);result.procedureUpdated++;continue;}copy.sortOrder=cache.favorites.length+result.procedureAdded+1;const id=await dbAdd('favorites',copy);current={...copy,id};cache.favorites.push(current);existingProcedureKeys.set(key,current);procedureIdMap.set(Number(source.portableId),id);result.procedureAdded++;}
    const existingAnnotationKeys=new Set(cache.annotations.map(a=>transferAnnotationKey(a,a.favoriteId)));

function bindProcedureCardSorting(){

async function reorderProcedures(draggedId,targetId){
  const rows=sortedProcedures();
  const from=rows.findIndex(row=>row.id===Number(draggedId));
  const to=rows.findIndex(row=>row.id===Number(targetId));
  if(from<0||to<0||from===to)return;
  const [moved]=rows.splice(from,1);rows.splice(to,0,moved);
  for(let i=0;i<rows.length;i++){
    rows[i].sortOrder=i+1;
    await dbPut('favorites',rows[i]);
  }
  await reloadCache();
}

function sortedProcedures(){

    (a.createdAt||'').localeCompare(b.createdAt||'')
  );
}
async function moveProcedure(id,direction){
  const rows=sortedProcedures();
  const index=rows.findIndex(r=>r.id===id);
  const other=index+direction;
  if(index<0||other<0||other>=rows.length) return;
  rows.forEach((row,i)=>{ if(!row.sortOrder) row.sortOrder=i+1; });
  const temp=rows[index].sortOrder;
  rows[index].sortOrder=rows[other].sortOrder;
  rows[other].sortOrder=temp;
  await dbPut('favorites',rows[index]);
  await dbPut('favorites',rows[other]);
  await reloadCache();
}

async function handlePdfImport(file,options={}){
  const startedAt=Date.now();
  contentEl.innerHTML = `<div class="card" style="text-align:center;padding:28px 20px;">
    <div style="font-size:30px;">📄</div>
    <p style="font-weight:600;margin:8px 0 4px;">正在解析PDF</p>

  },1000);
  try{

    const pages = await parsePdfArrayBuffer(buf,(current,total)=>{
      const pct=total?Math.max(1,Math.round(current/total*100)):1;
      const bar=document.getElementById('pc-progress-bar');

      if(bar) bar.style.width=`${pct}%`;
      if(main) main.textContent=current===0
        ? `共 ${total.toLocaleString()} 頁，準備開始`
        : `第 ${current.toLocaleString()}／${total.toLocaleString()} 頁（${pct}%）`;
    });
    const main=document.getElementById('pc-progress-main');
    if(main) main.textContent='解析完成，正在辨識文件並儲存…';
    const docs = segmentDocuments(pages);
    const pdfFileId = await dbAdd('pdfFiles', {
      fileName:file.name, displayName:file.name.replace(/\.pdf$/i,''), data:buf,
      uploadedAt:new Date().toISOString(), pageCount:pages.length, documentCount:0,
      fileSize:file.size, status:'待確認', sopType:options.sopType||'', tempUpdateOf:options.replacePdfId||null
    });

    </div>`;

  }

function buildPdfQualityReport(docs){
  const pages=docs.flatMap(d=>d.pages||[]), compact=p=>String(p.formattedText||p.text||'').replace(/\s+/g,'');
  const cover=pages.filter(p=>p.type==='cover').length, revision=pages.filter(p=>p.type==='revision').length;
  const failed=pages.filter(p=>p.parseError).length, noText=pages.filter(p=>!p.parseError&&!compact(p)).length, suspectedScan=pages.filter(p=>{const n=compact(p).length;return !p.parseError&&n>0&&n<12;}).length, content=pages.length-cover-revision;
  return {total:pages.length,content,cover,revision,noText,suspectedScan,failed,searchable:noText===0&&suspectedScan===0&&failed===0};
}
